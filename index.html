<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>Overview of China Mock Exam</title>
<style>
/* Layout: an exam sheet lying on a desk. The student writes in blue ballpoint, the teacher marks in red pen. */
:root{
  --desk:#E3E8EC; --paper:#FCFCFA; --line:#D9E0E6; --ink:#1A222C; --ink2:#4B5663; --muted:#7A8592;
  --blue:#1E4DB3; --blue-soft:#E7EEFB; --red:#C4161C; --red-soft:#FBE9E9; --ok:#13734A; --ok-soft:#E5F4EC;
  --chip:#EEF2F5; --shadow:0 1px 2px rgba(20,30,40,.08),0 8px 28px rgba(20,30,40,.08);
  --f-paper:"Source Serif 4","Noto Serif SC",Georgia,serif; --f-ui:"IBM Plex Sans","Noto Serif SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --f-pen:"Kalam","Chalkboard SE","Segoe Print","Comic Sans MS",sans-serif; --f-cn:"Noto Serif SC","Songti SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0F1317; --paper:#181D23; --line:#2A323C; --ink:#E5E9ED; --ink2:#AEB7C1; --muted:#7E8995;
  --blue:#86A9FF; --blue-soft:#1C2740; --red:#FF6B66; --red-soft:#3A1F21; --ok:#5ED19B; --ok-soft:#173027;
  --chip:#222A33; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0F1317; --paper:#181D23; --line:#2A323C; --ink:#E5E9ED; --ink2:#AEB7C1; --muted:#7E8995;
  --blue:#86A9FF; --blue-soft:#1C2740; --red:#FF6B66; --red-soft:#3A1F21; --ok:#5ED19B; --ok-soft:#173027;
  --chip:#222A33; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:16px/1.55 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
.wrap{max-width:860px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cn{font-family:var(--f-cn)}

/* top nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk);display:flex;gap:4px;align-items:center;padding:14px 0 10px;flex-wrap:wrap}
nav.top .brand{font:600 15px var(--f-paper);margin-right:auto;letter-spacing:.2px}
nav.top .brand small{display:block;font:500 11px var(--f-ui);color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
#sync{letter-spacing:.3px;text-transform:none}
nav.top a{padding:7px 12px;border-radius:999px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14.5px}
nav.top a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

/* the sheet */
.sheet{background:var(--paper);box-shadow:var(--shadow);border-radius:4px;padding:clamp(18px,4vw,44px)}
.sheet + .sheet{margin-top:18px}
.inst{text-align:center;font:500 13px var(--f-paper);color:var(--ink2)}
.ptitle{text-align:center;font:700 clamp(19px,3.2vw,24px)/1.25 var(--f-paper);margin:6px 0 4px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;font:14px var(--f-paper);color:var(--ink2);border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:20px}
.fields{display:flex;flex-wrap:wrap;gap:8px 20px;font:14.5px var(--f-paper);margin-bottom:18px}
.fields label{display:flex;gap:6px;align-items:baseline;flex:1 1 160px;min-width:0}
.fields input{border:0;border-bottom:1px solid var(--ink2);background:none;padding:2px 4px;flex:1;min-width:0;font-family:var(--f-pen);font-size:18px;color:var(--blue)}
h2.part{font:700 17px/1.4 var(--f-paper);margin:26px 0 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
h2.part .score{font:400 14px var(--f-paper);color:var(--ink2)}
h2.part .score b{font:700 22px var(--f-pen);color:var(--red);padding:0 4px}

/* questions */
ol.qs{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.q{position:relative;font-family:var(--f-paper);padding-left:34px}
.q .n{position:absolute;left:0;top:0;font-weight:700;width:28px;text-align:right}
.q .stem{font-size:16.5px;margin-bottom:6px;text-wrap:pretty}
.q .tag{font:500 11px var(--f-ui);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-left:6px;white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.opts.long{grid-template-columns:1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;cursor:pointer;min-width:0}
.opt:hover{background:var(--chip)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .L{font-weight:600;min-width:1.4em}
.opt:has(input:checked){background:var(--blue-soft);color:var(--blue)}
.opt:has(input:checked) .L{font-family:var(--f-pen);font-size:19px;line-height:1.1;border:1.6px solid var(--blue);border-radius:50%;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.opt:has(input:focus-visible){outline:2px solid var(--blue)}
.graded .opt{cursor:default}
.opt.right,.opt.right:has(input:checked){background:var(--ok-soft);color:var(--ok)}
.opt.wrong:has(input:checked) .L{border-color:var(--red)}
.opt.right:has(input:checked) .L{border-color:var(--ok)}
.opt.wrong,.opt.wrong:has(input:checked){background:var(--red-soft);color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px}
.mark{position:absolute;left:-8px;top:-10px;font:700 30px/1 var(--f-pen);color:var(--red);transform:rotate(-8deg);pointer-events:none}
.why{margin-top:6px;font:14px/1.5 var(--f-ui);color:var(--ink2);background:var(--chip);padding:8px 12px;border-radius:6px}
.why b{color:var(--red);font-family:var(--f-pen);font-size:16px}

/* essay */
.prompt{font:600 16.5px/1.5 var(--f-paper)}
textarea{width:100%;min-height:260px;margin-top:10px;border:1px solid var(--line);border-radius:4px;padding:10px 12px;resize:vertical;
  font:19px/32px var(--f-pen);color:var(--blue);background:var(--paper) repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-attachment:local}
.wc{font:13px var(--f-mono);color:var(--muted);text-align:right}

/* chrome */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);box-shadow:var(--shadow);border-radius:999px;padding:6px 6px 6px 18px;margin-bottom:14px}
.timer{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.prog{font:13px var(--f-mono);color:var(--ink2)}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.choice{display:grid;gap:10px;margin:14px 0}
.choice label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.choice label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.choice b{display:block}
.choice span{color:var(--ink2);font-size:14px}
select{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--paper);max-width:100%}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.eyebrow{font:600 11.5px var(--f-ui);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.confirm{border:1.5px solid var(--red);background:var(--red-soft);border-radius:8px;padding:12px 14px;margin-top:12px}

/* result stamp */
.stamp{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:flex-end;border-bottom:1.5px dashed var(--line);padding-bottom:16px;margin-bottom:8px}
.stamp .big{font:700 clamp(54px,11vw,78px)/.9 var(--f-pen);color:var(--red);transform:rotate(-4deg)}
.stamp .big small{font-size:.42em}
.stamp .parts{font:15px var(--f-paper);color:var(--ink2)}
.stamp .parts b{font-family:var(--f-pen);color:var(--red);font-size:20px}
.rub{display:grid;gap:8px;margin:12px 0}
.rub label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 10px;border-radius:6px;background:var(--chip)}
.rub .pts{font:600 14px var(--f-mono)}
.fb{border-left:3px solid var(--red);padding:4px 0 4px 14px;margin-top:12px;font-size:15px}
.fb h4{margin:10px 0 4px;font:600 13px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.fb ul{margin:0;padding-left:20px}
.fb .fix{font-family:var(--f-paper)}
.fb .fix s{color:var(--red)}
.model{font:15.5px/1.65 var(--f-paper);white-space:pre-line;background:var(--chip);border-radius:6px;padding:14px 16px;margin-top:10px}
details>summary{cursor:pointer;font-weight:600;padding:4px 0}

/* practice */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .c{font:12px var(--f-mono);opacity:.7;margin-left:4px}
.pcount{display:flex;justify-content:space-between;font:13px var(--f-mono);color:var(--muted);margin-bottom:12px}
.hist{font:13px var(--f-mono);color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}

/* essays + facts */
.ess{border-top:1px solid var(--line);padding:16px 0}
.eyebrow + .ess{border-top:0;padding-top:10px}
.ess h3{font:700 19px var(--f-paper);margin:0 0 4px}
.badge{display:inline-block;font:600 11px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;background:var(--red-soft);color:var(--red);border-radius:4px;padding:2px 7px;margin-left:6px;vertical-align:3px}
ul.kp{margin:8px 0 0;padding-left:20px;font-family:var(--f-paper)}
ul.kp li{margin:3px 0}
.facts h3{font:700 18px var(--f-paper);margin:22px 0 8px}
.facts h3:first-child{margin-top:0}
.facts ul{margin:0;padding-left:20px;font-family:var(--f-paper)}
.facts li{margin:4px 0}
.facts .pg{font:12px var(--f-mono);color:var(--muted)}
table.mt{border-collapse:collapse;font:14.5px var(--f-paper);width:100%}
table.mt td,table.mt th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.mt td:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.tw{overflow-x:auto}

/* notes */
.notes h2{font:700 22px var(--f-paper);margin:30px 0 0;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.notes .eyebrow + h2{margin-top:10px}
.notes li{margin:8px 0}
.notes .nq{color:var(--ink2)}
.notes .nh{display:block;font:400 16.5px/1.3 var(--f-pen);color:var(--red)}
.notes ol{margin:4px 0;padding-left:20px;font-size:15px;color:var(--ink2)}
.first-group{display:block;margin-top:16px;padding:12px 14px;border-radius:6px;background:var(--red-soft);color:var(--ink);text-decoration:none}
.first-group b{color:var(--red)}
.move{margin-top:16px}
.move label{display:block;margin-top:10px}
.move textarea{min-height:76px;margin:4px 0 8px;padding:8px 10px;font:12px/1.4 var(--f-mono);color:var(--ink2);background:var(--chip);word-break:break-all}
#move-msg{margin-top:8px;color:var(--ok)}
/* learn */
.ready{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:end}
.ready .num{font:700 clamp(46px,9vw,64px)/.9 var(--f-pen);color:var(--red)}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);transition:width .4s ease}
.lessons{display:grid;gap:2px;margin-top:18px}
.lesson{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px}
.lesson:hover{background:var(--chip)}
.lesson .i{font:600 14px var(--f-mono);color:var(--muted)}
.lesson.done .i{color:var(--ok);font-size:17px}
.lesson b{font:600 17px var(--f-paper)}
.lesson small{font-family:var(--f-cn);color:var(--muted);margin-left:6px}
.lesson .s{font:12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.tips{margin:18px 0 0;padding:14px 16px 14px 34px;background:var(--chip);border-radius:6px;font-size:14.5px}
.tips li{margin:3px 0}
.mem{min-height:300px;display:flex;flex-direction:column;gap:14px;justify-content:center;padding:18px 0}
.mem .cue{font:500 17px var(--f-ui);color:var(--ink2)}
.mem .ans{font:700 clamp(25px,5vw,36px)/1.2 var(--f-paper);text-wrap:balance}
.mem .hook{font:400 clamp(19px,3.4vw,23px)/1.35 var(--f-pen);color:var(--red)}
.mem ol{margin:0;padding-left:22px;font:15.5px/1.55 var(--f-paper);color:var(--ink2)}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--chip)}
.steps i.on{background:var(--ink)}
.lhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;font-size:14px;color:var(--muted)}
.lhead button{background:none;border:0;padding:2px 0;color:var(--ink2);text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.mark,.stamp .big{animation:pen .35s ease-out both}@keyframes pen{from{opacity:0;transform:scale(1.4) rotate(-8deg)}}}
</style>

<script>
const DATA = {"bank": {"sets": [{"id": "G", "name": "Geography of China", "src": "Teacher's bank: geography (15)", "questions": [{"q": "Which of the following describes China's terrain feature most accurately?", "options": ["High in the east and low in the west", "High in the west and low in the east, with three tiered steps", "Dominated by plains and basins", "Mostly mountainous with no obvious elevation variation"], "answer": 1, "explain": "China's land falls from the Qinghai-Tibet Plateau in the west to the plains and sea in the east, in three steps (tiers)."}, {"q": "What is the southernmost point of China's territory?", "options": ["Mohe River", "Pamir Plateau", "Zengmu Ansha", "Confluence of Heilongjiang and Wusuli River"], "answer": 2, "explain": "Zengmu Ansha (曾母暗沙, James Shoal) in the Nansha Islands. Mohe is the northernmost point, the Pamirs the westernmost, and the Heilongjiang–Wusuli confluence the easternmost.", "past": 1}, {"q": "Which mountain range serves as the dividing line between the first and second terrain tiers of China?", "options": ["Taihang Mountains", "Himalayas", "Kunlun Mountains - Qilian Mountains - Hengduan Mountains", "Greater Khingan Range"], "answer": 2, "explain": "The Kunlun–Qilian–Hengduan line divides tiers 1 and 2. The Greater Khingan–Taihang–Wushan–Xuefeng line divides tiers 2 and 3.", "past": 2}, {"q": "How many provinces are there in China's administrative division?", "options": ["22", "23", "24", "25"], "answer": 1, "explain": "23 provinces (including Taiwan), plus 5 autonomous regions, 4 municipalities and 2 special administrative regions: 34 provincial-level units."}, {"q": "Which river is known as China's \"Mother River\" and forms a \"hanging river\" in its lower reaches?", "options": ["Yangtze River", "Pearl River", "Yellow River", "Tarim River"], "answer": 2, "explain": "The Yellow River carries so much silt from the Loess Plateau that its bed in the lower reaches is higher than the land around it (地上河, a hanging river)."}, {"q": "Which climate type dominates the Qinghai-Tibet Plateau?", "options": ["Temperate monsoon climate", "Plateau mountain climate", "Temperate continental climate", "Subtropical monsoon climate"], "answer": 1, "explain": "Average height above 4,000 m gives a cold plateau mountain climate."}, {"q": "Where is China's wettest place located?", "options": ["Turpan Basin, Xinjiang", "Huoshaoliao, Taiwan", "Guilin, Guangxi", "Hangzhou, Zhejiang"], "answer": 1, "explain": "Huoshaoliao (火烧寮) in Taiwan has the highest average yearly rainfall in China. The Turpan Basin is one of the driest places."}, {"q": "Which basin is the lowest-lying area in China (with the lowest point at -154 meters)?", "options": ["Sichuan Basin", "Tarim Basin", "Turpan Basin", "Junggar Basin"], "answer": 2, "explain": "The Turpan Basin's Aydingkol Lake is 154 m below sea level.", "past": 3}, {"q": "Which of the following is China's largest plain?", "options": ["Northeast Plain", "North China Plain", "Yangtze River Delta Plain", "Pearl River Delta Plain"], "answer": 0, "explain": "The Northeast Plain (about 350,000 km²) is the largest of China's three great plains.", "past": 4}, {"q": "How many land neighboring countries does China have?", "options": ["12", "13", "14", "15"], "answer": 2, "explain": "14 land neighbours, including Kazakhstan, Russia, Mongolia, India and Vietnam.", "past": 5}, {"q": "Which of the following is an endorheic river (not flowing into the ocean) in China?", "options": ["Heilongjiang", "Tarim River", "Pearl River", "Yangtze River"], "answer": 1, "explain": "The Tarim River in Xinjiang is China's longest inland (endorheic) river and ends in the desert.", "past": 6}, {"q": "Which mountain range is the watershed between the Yangtze River and the Yellow River?", "options": ["Qinling Mountains", "Nanling Mountains", "Wuyi Mountains", "Tianshan Mountains"], "answer": 0, "explain": "The Qinling Mountains divide the two river systems and also form China's north–south climate line (with the Huai River).", "past": 7}, {"q": "Which climate feature is typical of China's eastern regions?", "options": ["Annual precipitation evenly distributed", "Large temperature difference between winter and summer", "No obvious seasonal changes", "Dry all year round"], "answer": 1, "explain": "The monsoon gives eastern China hot, rainy summers and cold, dry winters."}, {"q": "Which autonomous region is located in China's southern border?", "options": ["Inner Mongolia Autonomous Region", "Guangxi Zhuang Autonomous Region", "Xinjiang Uygur Autonomous Region", "Ningxia Hui Autonomous Region"], "answer": 1, "explain": "Guangxi borders Vietnam in the south. Inner Mongolia is north, Xinjiang northwest, Ningxia inland.", "past": 8}, {"q": "What percentage of China's land area is covered by mountainous regions (including mountains, hills and plateaus)?", "options": ["1/3", "1/2", "2/3", "3/4"], "answer": 2, "explain": "About two thirds of China's land is mountains, hills and plateaus.", "past": 9}]}, {"id": "H", "name": "History of China", "src": "Teacher's bank: history (10)", "questions": [{"q": "Who was the first emperor of a unified China?", "options": ["Emperor Wu of Han", "Qin Shi Huang", "Kangxi Emperor", "Tang Taizong"], "answer": 1, "explain": "Qin Shi Huang unified China in 221 BC and took the title 皇帝 (emperor)."}, {"q": "Which dynasty is credited with building the earliest sections of the Great Wall?", "options": ["Ming Dynasty", "Tang Dynasty", "Qin Dynasty", "Song Dynasty"], "answer": 2, "explain": "Teacher's key: Qin. Strictly, states of the Warring States period built walls first; Qin Shi Huang linked them into one wall. Most of the wall you see today is Ming."}, {"q": "The Silk Road was initially established during the reign of which dynasty?", "options": ["Yuan Dynasty", "Han Dynasty", "Qing Dynasty", "Zhou Dynasty"], "answer": 1, "explain": "Zhang Qian's missions to the Western Regions under Emperor Wu of Han (2nd century BC) opened the Silk Road."}, {"q": "Which famous explorer from the Ming Dynasty led naval expeditions to Southeast Asia, India, and East Africa?", "options": ["Guo Shoujing", "Zheng He", "Xu Guangqi", "Li Zicheng"], "answer": 1, "explain": "Zheng He made seven voyages between 1405 and 1433."}, {"q": "Which country invaded China in the Opium Wars (1840–1842 and 1856–1860)?", "options": ["France", "United States", "Britain", "Russia"], "answer": 2, "explain": "Britain fought both Opium Wars (France joined Britain in the second).", "past": 10}, {"q": "Who founded the Yuan Dynasty after conquering the Southern Song?", "options": ["Genghis Khan", "Kublai Khan", "Hongwu Emperor", "Yongle Emperor"], "answer": 1, "explain": "Kublai Khan, Genghis Khan's grandson, founded the Yuan in 1271 and conquered the Southern Song in 1279."}, {"q": "The \"Three Kingdoms\" period followed the collapse of which dynasty?", "options": ["Shang Dynasty", "Han Dynasty", "Tang Dynasty", "Sui Dynasty"], "answer": 1, "explain": "Wei, Shu and Wu rose as the Eastern Han collapsed (220 AD).", "past": 11}, {"q": "Which event marked the end of imperial rule in China in 1912?", "options": ["The May Fourth Movement", "The Xinhai Revolution", "The Boxer Rebellion", "The Long March"], "answer": 1, "explain": "The Xinhai Revolution (1911) led to the Qing emperor's abdication and the Republic of China in 1912.", "past": 12}, {"q": "The Terracotta Army was discovered in the tomb of which ruler?", "options": ["Emperor Gaozu of Han", "Qin Shi Huang", "Wu Zetian", "Emperor Taizong of Tang"], "answer": 1, "explain": "Found in 1974 near Xi'an, guarding Qin Shi Huang's mausoleum.", "past": 13}, {"q": "Which dynasty is known for its cultural flourishing and the invention of movable type printing?", "options": ["Tang Dynasty", "Song Dynasty", "Ming Dynasty", "Qing Dynasty"], "answer": 1, "explain": "Bi Sheng invented movable type in the Northern Song (around 1040).", "past": 14}]}, {"id": "R", "name": "Yangtze & Yellow River", "src": "Teacher's bank: rivers (10) + past paper", "questions": [{"q": "Which is the longest river in China?", "options": ["The Yellow River", "The Yangtze River", "The Pearl River", "The Heilongjiang River"], "answer": 1, "explain": "The Yangtze, about 6,300 km."}, {"q": "The Yangtze River is the ______ longest river in the world.", "options": ["first", "second", "third", "fourth"], "answer": 2, "explain": "Third, after the Nile and the Amazon."}, {"q": "Where does the Yangtze River finally flow into?", "options": ["The East China Sea", "The South China Sea", "The Bohai Sea", "The Yellow Sea"], "answer": 0, "explain": "It reaches the East China Sea at Shanghai."}, {"q": "Which city is along the Yangtze River?", "options": ["Beijing", "Wuhan", "Xi'an", "Zhengzhou"], "answer": 1, "explain": "Wuhan, Chongqing, Nanjing and Shanghai are on the Yangtze. Zhengzhou is on the Yellow River."}, {"q": "The Yellow River is also called ______ of China.", "options": ["the Mother River", "the Longest River", "the Blue River", "the West River"], "answer": 0, "explain": "母亲河, the Mother River: early Chinese civilization grew along it."}, {"q": "Why is it named the Yellow River?", "options": ["Because it has many yellow fish", "Because the river water carries lots of yellow sand", "Because the sky above it is yellow", "Because people build yellow houses along it"], "answer": 1, "explain": "It carries huge amounts of yellow silt from the Loess Plateau."}, {"q": "The Yellow River is the ______ longest river in China.", "options": ["first", "second", "third", "fourth"], "answer": 1, "explain": "Second, about 5,464 km."}, {"q": "The Yellow River flows into the ______.", "options": ["East China Sea", "South China Sea", "Bohai Sea", "Red Sea"], "answer": 2, "explain": "It enters the Bohai Sea in Shandong."}, {"q": "Which river is the birthplace of Chinese civilization?", "options": ["Only the Yangtze River", "Only the Yellow River", "Both the Yangtze and Yellow River", "Neither of them"], "answer": 2, "explain": "Both basins are core cradles (the teacher's 4 Nov message: Chinese civilization is pluralistic and integrated)."}, {"q": "Which of the following is true?", "options": ["The Yellow River is longer than the Yangtze River.", "The Yangtze River has more yellow sand.", "Both rivers run from west to east in China.", "They both flow into the Bohai Sea."], "answer": 2, "explain": "Both rise on the Qinghai-Tibet Plateau and flow east, following the west-high, east-low terrain.", "past": 15}, {"q": "Which of the following provinces does the Yangtze River NOT travel through?", "options": ["Sichuan Province", "Yunnan Province", "Hunan Province", "Shandong Province"], "answer": 3, "explain": "The Yangtze flows through Qinghai, Tibet, Sichuan, Yunnan, Chongqing, Hubei, Hunan, Jiangxi, Anhui, Jiangsu and Shanghai. Shandong is on the Yellow River.", "past": 20}]}, {"id": "M", "name": "Famous mountains", "src": "Teacher's bank: Five Sacred & Three Famous Mountains (10)", "questions": [{"q": "How many sacred mountains are there in the traditional Chinese \"Five Sacred Mountains\"?", "options": ["Three", "Five", "Seven", "Nine"], "answer": 1, "explain": "五岳: Tai (east), Hua (west), Heng 衡 (south), Heng 恒 (north), Song (centre)."}, {"q": "Which mountain is known as the \"Eastern Mountain\" of the Five Sacred Mountains?", "options": ["Mount Hua", "Mount Heng", "Mount Tai", "Mount Song"], "answer": 2, "explain": "东岳泰山, Mount Tai in Shandong."}, {"q": "Which of the following mountains is the highest in the Five Sacred Mountains?", "options": ["Mount Hua", "Mount Tai", "Mount Heng (Hunan)", "Mount Song"], "answer": 0, "explain": "Mount Hua, 2,154.9 m. The lowest is Southern Heng (Hunan), 1,300.2 m."}, {"q": "Which mountain is famous for its steep and dangerous cliffs?", "options": ["Northern Mount Heng", "Mount Hua", "Eastern Mount Tai", "Southern Mount Heng"], "answer": 1, "explain": "华山天下险: Mount Hua is famous as the most dangerous."}, {"q": "Where is Mount Song located?", "options": ["Shandong Province", "Shaanxi Province", "Henan Province", "Hunan Province"], "answer": 2, "explain": "中岳嵩山, Mount Song in Henan."}, {"q": "Which temple is located on Mount Song?", "options": ["Shaolin Temple", "Puji Temple", "Fayu Temple", "Lingyin Temple"], "answer": 0, "explain": "The Shaolin Temple, home of Shaolin kung fu."}, {"q": "Which group belongs to the traditional \"Three Famous Mountains\" (Sanshan)?", "options": ["Huangshan, Lushan, Yandang Mountain", "Tai Mountain, Hua Mountain, Song Mountain", "Heng Mountain, Emei Mountain, Huangshan", "Lushan, Wuyi Mountain, Changbai Mountain"], "answer": 0, "explain": "三山: Huangshan (Anhui), Lushan (Jiangxi) and Yandang (Zhejiang)."}, {"q": "Which mountain is famous for its strange pine trees, weird rocks and sea of clouds?", "options": ["Lushan Mountain", "Huangshan Mountain", "Yandang Mountain", "Heng Mountain"], "answer": 1, "explain": "Huangshan's 'four wonders': odd pines, strange rocks, a sea of clouds and hot springs."}, {"q": "Which mountain is called the \"Western Mountain\" of the Five Sacred Mountains?", "options": ["Mount Tai", "Mount Hua", "Mount Heng", "Mount Song"], "answer": 1, "explain": "西岳华山, Mount Hua in Shaanxi."}, {"q": "Which statement about mountains is correct?", "options": ["Five Sacred Mountains are all in southern China", "Mount Tai lies in Shandong Province", "Huangshan is one of the Five Sacred Mountains", "All three mountains are in northern China"], "answer": 1, "explain": "Mount Tai is in Shandong. Huangshan is one of the Three Famous Mountains, not the Five Sacred Mountains.", "past": 16}]}, {"id": "F", "name": "May Fourth Movement", "src": "Teacher's bank (5)", "questions": [{"q": "When did the May Fourth Movement take place?", "options": ["In 1911", "In 1919", "In 1921", "In 1949"], "answer": 1, "explain": "4 May 1919, after the Paris Peace Conference gave Shandong to Japan."}, {"q": "Where did the May Fourth Movement first break out?", "options": ["Shanghai", "Nanjing", "Beijing", "Guangzhou"], "answer": 2, "explain": "Students gathered at Tiananmen in Beijing."}, {"q": "Which group was the main force at the beginning of the movement?", "options": ["Workers", "Farmers", "Students", "Soldiers"], "answer": 2, "explain": "Students started it; workers in Shanghai later joined with strikes."}, {"q": "What was the main spirit of the May Fourth Movement?", "options": ["Patriotism", "Peace", "Friendship", "Cooperation"], "answer": 0, "explain": "Patriotism, progress, democracy and science. 4 May is now China's Youth Day."}, {"q": "Which statement about the May Fourth Movement is correct?", "options": ["It is a violent war", "It is an important patriotic movement", "It happened after 1950", "It only took place in Shanghai"], "answer": 1, "explain": "A patriotic movement of 1919 that began in Beijing.", "past": 17}]}, {"id": "C", "name": "The Grand Canal", "src": "Teacher's bank (5)", "questions": [{"q": "What is the Grand Canal famous for?", "options": ["The deepest canal", "The longest artificial canal in the world", "The widest canal", "The oldest natural river"], "answer": 1, "explain": "The Beijing–Hangzhou Grand Canal (about 1,794 km) is the world's longest artificial canal and a UNESCO World Heritage site (2014)."}, {"q": "The Grand Canal runs from ______ to ______.", "options": ["east; west", "south; north", "northeast; southwest", "northwest; southeast"], "answer": 1, "explain": "It links south and north, crossing the west–east rivers."}, {"q": "Which two cities are the main ends of the Grand Canal?", "options": ["Beijing and Hangzhou", "Beijing and Shanghai", "Tianjin and Suzhou", "Nanjing and Guangzhou"], "answer": 0, "explain": "京杭大运河: Beijing in the north, Hangzhou in the south."}, {"q": "What is one main function of the Grand Canal?", "options": ["Produce electricity", "Transport goods and people", "Prevent earthquakes", "Provide drinking water only"], "answer": 1, "explain": "It carried grain and goods from the rich south to the capital in the north."}, {"q": "Which province does NOT have the Grand Canal?", "options": ["Zhejiang", "Jiangsu", "Guangdong", "Shandong"], "answer": 2, "explain": "It passes Beijing, Tianjin, Hebei, Shandong, Jiangsu and Zhejiang, not Guangdong.", "past": 18}]}, {"id": "Z", "name": "Zheng He's voyages", "src": "Teacher's bank (5)", "questions": [{"q": "In which dynasty did Zheng He carry out his voyages?", "options": ["Tang Dynasty", "Song Dynasty", "Ming Dynasty", "Qing Dynasty"], "answer": 2, "explain": "Ming, under the Yongle and Xuande emperors (1405–1433)."}, {"q": "How many times did Zheng He sail to the western seas?", "options": ["Five times", "Six times", "Seven times", "Eight times"], "answer": 2, "explain": "Seven voyages (郑和七下西洋)."}, {"q": "Which port did Zheng He mainly depart from?", "options": ["Nanjing", "Suzhou", "Quanzhou", "Shanghai"], "answer": 0, "explain": "Teacher's key: Nanjing, where the fleet was built and assembled. Strictly, it put out to sea from Liujiagang (Taicang, near Suzhou). In the exam, answer Nanjing."}, {"q": "What was the main purpose of Zheng He's voyages?", "options": ["Fight wars", "Trade and cultural communication", "Catch fish", "Find new homes"], "answer": 1, "explain": "Diplomacy, trade and showing Ming power."}, {"q": "Which statement is true about Zheng He's voyages?", "options": ["His ships were very large", "He never left Asia", "The voyages lasted for only one year", "He brought back many wars"], "answer": 0, "explain": "His 'treasure ships' were among the largest wooden ships ever built, and he reached East Africa.", "past": 19}]}]}, "essays": {"rubric": [{"k": "intro", "pts": 5, "label": "Says what it is", "hint": "Name in English and Chinese, plus the date, place or origin."}, {"k": "facts", "pts": 7, "label": "Gives key facts", "hint": "At least 3 correct facts, customs or examples."}, {"k": "why", "pts": 6, "label": "Explains why it matters to you", "hint": "One or two reasons, plus your own view or a link to Kazakhstan."}, {"k": "lang", "pts": 2, "label": "Clear English", "hint": "Short, complete sentences in a logical order."}], "essays": [{"id": "hellochina", "title": "What you learned from Hello China", "prompt": "What have you learned from Hello China?", "points": ["CCTV documentary, 100 short films", "Each film teaches one Chinese word and the story behind it: 龙 dragon, 功夫 kung fu, 春节 Spring Festival", "Example: 东西 'thing' literally means East-West", "Lesson 1: Chinese words carry history and culture", "Lesson 2: the same values return: family, respect, harmony with nature", "Lesson 3: old traditions like tai chi are still part of daily life", "Your link: you saw old people doing tai chi in Shenzhen"], "short": "Hello China 你好中国 is a documentary made by CCTV. It has 100 short films, and each film is only two or three minutes long. Every film teaches one Chinese word, such as 龙 dragon, 功夫 kung fu, 中医 Chinese medicine or 春节 Spring Festival. Then it tells the story and the culture behind that word.\n\nI learned three main things. First, Chinese words carry history. For example, 东西 means \"thing\", but the two characters mean East and West. The film explains that wood and metal could go in a basket, but fire and water could not. Second, the same values come back in many films: love for family, respect for elders and ancestors, and living in harmony with nature. Third, old traditions are still alive today. People still practise tai chi, use Chinese medicine and celebrate the old festivals.\n\nThis documentary was very useful for me as a foreign student. In Shenzhen I saw old people doing tai chi in a square, just like in the film. Now when I learn a new Chinese word, I also try to learn the story behind it. I think language is the best door to understand a culture.", "group": "Documentaries"}, {"id": "seasons", "title": "What you learned from Seasons of China", "prompt": "What have you learned from Seasons of China?", "points": ["24 episodes, one for each solar term 二十四节气, each filmed in a different place", "Host: Dominic 江森海, from the UK", "Solar terms divide the sun's yearly path into 24 parts to guide farming; UNESCO intangible heritage, 2016", "Lesson 1: harmony with nature (Dujiangyan controls water without a dam)", "Lesson 2: each season has its own food and customs (dumplings at Winter Solstice)", "Lesson 3: young people return home and keep old crafts alive", "Your link: Nauryz falls at the Spring Equinox 春分"], "short": "Seasons of China 四季中国 is a documentary with 24 episodes. Each episode explains one of the 24 solar terms 二十四节气 and visits one place in China. The host is Dominic 江森海, a British man who has lived in China for many years. At first he did not know the solar terms, so we learn together with him.\n\nThe solar terms divide the year into 24 parts by the movement of the sun. Ancient Chinese people made them to guide farming: when to plant, when to harvest and when to rest. In 2016 UNESCO listed them as intangible cultural heritage.\n\nI learned three main things. First, Chinese people live in harmony with nature. For example, the Dujiangyan irrigation system in Sichuan is more than 2,000 years old and still controls the water without a dam. Second, every season has its own food and customs, such as dumplings at the Winter Solstice in Xi'an. Third, many young people go back to their hometowns to keep old crafts alive, like the tie-dye of Dali.\n\nIn Kazakhstan, our new year Nauryz comes at the Spring Equinox 春分, when day and night are equal. So I feel that people in China and Kazakhstan share the same old wisdom: we watch nature and follow its rhythm.", "badge": "On the first group's paper", "group": "Documentaries"}, {"id": "festivechina", "title": "What you learned from Festive China", "prompt": "What have you learned from Festive China?", "points": ["China Daily documentary, 12 short films", "It follows one full year: the 24 solar terms, the 4 seasons and 7 festivals", "7 festivals: Spring, Lantern, Qingming, Dragon Boat, Qixi, Mid-Autumn, Double Ninth", "Lesson 1: festivals follow nature and the seasons", "Lesson 2: almost every festival is about family and going home", "Lesson 3: each festival has its own story and food", "Your link: Mid-Autumn was your first Chinese festival; Nauryz at home"], "short": "Festive China 话说中国节 is a documentary made by China Daily. It has 12 short films, and together they follow one full year. It starts with the 24 solar terms, then shows the four seasons and seven traditional festivals: Qingming, the Dragon Boat Festival, Qixi, Mid-Autumn, Double Ninth, the Spring Festival and the Lantern Festival. Each film leads to the next one, so the series is like a circle of the year.\n\nI learned three main things. First, Chinese festivals follow nature. They follow the lunar calendar and the seasons: Mid-Autumn comes with the full moon, and Qingming comes in spring. Second, almost every festival is about family. People travel home for the Spring Festival, eat together at Mid-Autumn and remember their ancestors at Qingming. Third, every festival has its own story and food: Qu Yuan and zongzi at the Dragon Boat Festival, Chang'e and mooncakes at Mid-Autumn, and dumplings at the Spring Festival.\n\nThe film became real for me in Zhuhai. Mid-Autumn was my first Chinese festival, two weeks after I arrived. I was far from my family, but I understood the meaning of reunion 团圆. In Kazakhstan, our Nauryz has the same warm feeling: a clean house, new clothes and a big table with family.", "group": "Documentaries"}, {"id": "amazingchina", "title": "What you learned from Amazing China", "prompt": "What have you learned from Amazing China?", "points": ["72 short films about China's natural wonders", "Mountains, lakes, deserts, glaciers, coasts and animals", "Examples: Tianchi on Changbai Mountain, the coloured lakes of Jiuzhaigou, Sayram Lake in Xinjiang", "The last films (58–72) are about the giant panda", "Lesson 1: China's nature is huge and very different from place to place", "Lesson 2: people must live in harmony with nature", "Lesson 3: nature can be protected: panda reserves since 1963 (Wolong)", "Your link: Sayram Lake is in the Tian Shan, close to Kazakhstan"], "short": "Amazing China 美丽中国 is a documentary with 72 short films about China's natural wonders. Each film shows one place or one animal and explains how it was formed and how people live with it. It shows mountains, lakes, deserts, glaciers, coasts and forests from every part of China. The last films, from 58 to 72, tell the story of the giant panda.\n\nI learned three main things. First, China's nature is huge and very different from place to place. In the northeast there is Tianchi, a crater lake on Changbai Mountain. In Sichuan there are the colourful lakes of Jiuzhaigou. In Xinjiang there are deserts and clear blue mountain lakes. Second, people must live in harmony with nature. The films show how local people live with the land and the seasons. Third, nature can be saved. China has protected giant pandas since 1963, when the first reserves, such as Wolong, were set up.\n\nMy favourite film is about Sayram Lake in the Tian Shan, because it is close to Kazakhstan. The film showed me that our two countries share the same beautiful mountains. It made me want to travel more in China and see these places with my own eyes.", "group": "Documentaries"}, {"id": "axis", "title": "Beijing Central Axis 北京中轴线", "prompt": "Describe the Beijing Central Axis.", "points": ["A 7.8 km north–south line through the centre of old Beijing", "North to south: Bell and Drum Towers → Jingshan → Forbidden City → Tian'anmen → Qianmen → Yongdingmen", "Began in the Yuan Dynasty, developed in the Ming and Qing", "UNESCO World Heritage Site, July 2024, with 15 components", "Meaning: balance, symmetry and the Chinese idea of the centre 中"], "short": "The Beijing Central Axis 北京中轴线 is a long north–south line through the centre of old Beijing. It is about 7.8 kilometres long. It starts at the Bell and Drum Towers in the north. Then it passes Jingshan Hill, the Forbidden City, Tian'anmen and Qianmen, and it ends at Yongdingmen Gate in the south.\n\nThe axis began in the Yuan Dynasty, when Beijing was the capital Dadu. In the Ming and Qing dynasties it grew longer and more important. The emperor's palace, the Forbidden City, stands in the middle of the line. On both sides, buildings stand in balance, like the Temple of Heaven in the east and the Altar of Agriculture in the west. In July 2024, UNESCO listed the Beijing Central Axis as a World Heritage Site, with 15 parts.\n\nThe axis shows two important Chinese ideas. The first is the centre 中: the most important place is in the middle. It is the same 中 as in 中国. The second is balance and order: left and right are equal, and everything has its place.\n\nI think the Central Axis is amazing because a whole city was planned like one piece of art. It teaches me that Chinese culture loves harmony and order.", "badge": "On the first group's paper", "group": "Beijing and Zhuhai"}, {"id": "huabiao", "title": "Huabiao 华表", "badge": "May come up", "prompt": "Introduce Huabiao and explain its meaning.", "points": ["Huabiao 华表: tall ornamental columns in front of palaces and imperial tombs", "Most famous: two pairs at Tian'anmen Gate, one inside and one outside, on the Beijing Central Axis", "White marble, Ming Dynasty, carved with dragons and clouds, almost 10 metres tall", "Legend: began as wooden posts in the time of Yao and Shun, where people wrote criticism of the ruler 诽谤木", "On top: the mythical beast hou 犼", "Traditional meaning: outside pair 望君归 (come back to your duties), inside pair 望君出 (go out and see the people)", "Your view: a ruler must listen to the people; today it is a symbol of Chinese civilization"], "short": "Huabiao 华表 are tall decorative stone columns. They usually stand in front of palaces and imperial tombs. The most famous Huabiao are at Tian'anmen Gate in Beijing, on the Central Axis. There are two pairs: one pair outside the gate and one pair inside.\n\nThe Tian'anmen Huabiao were made of white marble in the Ming Dynasty. They are almost 10 metres tall. A dragon is carved around each column, with clouds around it. Near the top there is a stone cloud board and a round plate. On the very top sits a mythical animal called hou 犼.\n\nAccording to legend, Huabiao began as simple wooden posts in the time of the ancient kings Yao and Shun. People could write their ideas or their criticism of the ruler on these posts, which were called 诽谤木. Later, the wooden posts became beautiful stone columns.\n\nTradition says the hou animals also have a message. The pair outside the gate is called 望君归: it asks the emperor to come back and do his work. The pair inside is called 望君出: it asks him to go out and see how ordinary people live.\n\nI think Huabiao teach an important lesson: a good leader must listen to the people. Today Huabiao are a symbol of Chinese culture, and they make me feel the long history of China.", "group": "Beijing and Zhuhai"}, {"id": "zhuhai", "title": "Zhuhai city 珠海", "prompt": "Describe Zhuhai city.", "points": ["Coastal city in Guangdong, west of the Pearl River Estuary, next to Macao", "One of China's first four special economic zones, 1980", "City of a Hundred Islands 百岛之城; green and romantic", "Symbols: Fisher Girl 珠海渔女 on Lovers' Road 情侣路, Zhuhai Opera House 日月贝 (Sun and Moon Shells) on Yeli Island", "Hong Kong–Zhuhai–Macao Bridge, about 55 km, opened 2018", "Your life: studying at BIT Zhuhai, the campus lake"], "short": "Zhuhai 珠海 is a coastal city in Guangdong Province, in the south of China. It lies on the west side of the Pearl River Estuary, right next to Macao. Its name means \"Pearl Sea\".\n\nZhuhai grew very fast after reform and opening-up. In 1980 it became one of China's first four special economic zones, together with Shenzhen, Shantou and Xiamen. Today it is a modern but very green city.\n\nZhuhai is famous for its sea and islands, so people call it the City of a Hundred Islands. It is also called a romantic city. The long seaside road is called Lovers' Road 情侣路, and on it stands the Fisher Girl statue 珠海渔女, the symbol of the city. The Zhuhai Opera House 日月贝, or Sun and Moon Shells, stands on Yeli Island and looks like two big sea shells. The Hong Kong–Zhuhai–Macao Bridge, about 55 km long, opened in 2018 and connects Zhuhai with Hong Kong and Macao.\n\nI study at BIT Zhuhai, so Zhuhai is my home in China. I love the clean air, the sea and the lake on our campus. I often take the shuttle bus to Shenzhen, and it always leaves on time. I think Zhuhai shows that a city can grow fast and still keep its nature beautiful.", "badge": "On the first group's paper", "group": "Beijing and Zhuhai"}, {"id": "spring", "title": "Spring Festival 春节", "prompt": "Introduce the Spring Festival and explain why it is the most important festival for Chinese people.", "points": ["Chinese New Year, 1st day of the 1st lunar month (6 February 2027); celebrations end with the Lantern Festival on the 15th day", "Legend of the monster Nian, scared away by red colour and firecrackers", "Customs: cleaning the house, spring couplets 春联 and an upside-down 福, the reunion dinner on New Year's Eve, dumplings, red envelopes 红包, the CCTV Gala, visiting relatives", "春运: the largest human migration on Earth, as people travel home", "Why most important: reunion 团圆, hope for a new year, family and roots"], "short": "The Spring Festival 春节, or Chinese New Year, is the most important festival in China. It is on the first day of the first lunar month, usually in January or February. In 2027 it is on 6 February. The celebration lasts about two weeks and ends with the Lantern Festival.\n\nThere is an old legend about a monster called Nian. Every new year it came to attack villages, but it was afraid of the colour red, fire and loud noise. That is why people still use red decorations and firecrackers.\n\nBefore the festival, families clean the house to sweep away bad luck. They put red couplets 春联 on the doors and hang the character 福 upside down, because \"upside down\" 倒 sounds like \"arrive\" 到, so good luck arrives. On New Year's Eve the whole family eats a big reunion dinner, and in the north people make dumplings. Elders give children red envelopes 红包 with money, and many families watch the Spring Festival Gala on TV. Before the festival, hundreds of millions of people travel home. This is called 春运, the biggest yearly migration in the world.\n\nI think the Spring Festival is so important because of reunion 团圆 and hope. Everyone wants to be with family, and everyone hopes for a better new year. In Kazakhstan our Nauryz is similar: we clean the house, wear new clothes, visit elders and share a big table. I am excited to see my first Spring Festival in China.", "group": "Festivals"}, {"id": "lantern", "title": "Lantern Festival 元宵节", "prompt": "Introduce the Lantern Festival and explain why it is meaningful for Chinese people.", "points": ["15th day of the 1st lunar month, the first full moon of the year; it ends the Spring Festival celebrations", "Also called Yuanxiao 元宵, 'the night of the first full moon'", "Customs: admiring lanterns, guessing lantern riddles 猜灯谜, lion and dragon dances", "Food: round Yuanxiao / tangyuan 汤圆, a symbol of family reunion", "Why: reunion, hope for the new year, the whole community celebrates together"], "short": "The Lantern Festival 元宵节 is on the fifteenth day of the first lunar month. It is the night of the first full moon of the new year, and it is the last day of the Spring Festival celebrations. Its other name, Yuanxiao, means \"the night of the first full moon\".\n\nIt is said that lighting lamps on this night became a custom in the Han Dynasty. Today, streets and parks are full of colourful lanterns in many shapes, such as animals, flowers and the zodiac animal of the year. People write riddles on the lanterns, and visitors try to guess them 猜灯谜. There are also lion dances and dragon dances, and in some places fireworks.\n\nThe special food is Yuanxiao, also called tangyuan 汤圆. These are small round balls made of sticky rice, often with a sweet filling inside. Because they are round like the full moon, they mean that the family is together and complete.\n\nI think the Lantern Festival is meaningful for two reasons. First, it carries the value of reunion 团圆, like the Spring Festival. Second, it brings the whole community outside to enjoy the night together before people go back to work and school. In Kazakhstan our Nauryz also brings neighbours together to welcome the new year, so I understand this happy feeling.", "group": "Festivals"}, {"id": "qingming", "title": "Qingming Festival 清明节", "past": true, "prompt": "Introduce the Qingming Festival and why do you think the Qingming Festival is considered to be one of the greatest festivals for Chinese people?", "points": ["Tomb-Sweeping Day; both a solar term (one of the 24) and a festival; 4, 5 or 6 April", "Customs: sweeping tombs and honouring ancestors (offer food and flowers, burn incense); spring outing 踏青, flying kites, planting willows", "Origin: the Cold Food Festival 寒食节 and the legend of Jie Zitui", "Why great: filial piety 孝 and remembering ancestors; it joins sorrow and joy, death and the new life of spring", "Teacher's full-mark idea: it answers 'Who am I? Where do I come from? Where am I going?'"], "short": "The Qingming Festival 清明节, also called Tomb-Sweeping Day, is one of the most important traditional festivals in China. It is also one of the 24 solar terms. It is on 4, 5 or 6 April, when spring is clear and bright. That is the meaning of the name 清明.\n\nThe festival is connected to the older Cold Food Festival 寒食节 and the story of Jie Zitui, a loyal man who died in a fire on a mountain. To remember him, people did not cook with fire for a day.\n\nOn Qingming, people do two main things. First, they visit the graves of their family. They clean the graves, bring food and flowers, burn incense and remember the people they lost. Second, they enjoy spring. They go for a spring walk 踏青, fly kites and plant willow trees.\n\nI think Qingming is one of the greatest Chinese festivals for two reasons. First, it teaches respect for parents and ancestors (孝). It answers three big questions: Who am I? Where do I come from? Where am I going? Second, it has both sad and happy moments. People miss family members who died, but they also enjoy the new life of spring. It teaches us to value every day of our life.\n\nIn Kazakhstan we also visit our ancestors' graves and pray for them, so I understand why Qingming means so much to Chinese people.", "group": "Festivals"}, {"id": "dragonboat", "title": "Dragon Boat Festival 端午节", "prompt": "Introduce the Dragon Boat Festival and explain why it is still important today.", "points": ["5th day of the 5th lunar month; UNESCO intangible cultural heritage (2009)", "Remembers the patriotic poet Qu Yuan 屈原, who drowned himself in the Miluo River", "Customs: dragon boat races, zongzi 粽子 (rice in bamboo leaves), sachets 香囊, hanging mugwort, realgar wine", "Values: patriotism, loyalty, teamwork, staying healthy as summer begins"], "short": "The Dragon Boat Festival 端午节 is on the fifth day of the fifth lunar month, usually in late May or June. In 2009 UNESCO listed it as intangible cultural heritage.\n\nThe festival remembers Qu Yuan 屈原, a great poet and a loyal minister of the state of Chu more than 2,000 years ago. He loved his country, but the king did not listen to him. When his country was in danger, he was so sad that he jumped into the Miluo River. Local people rowed their boats to look for him, and they threw rice into the river so the fish would not eat his body.\n\nFrom this story come the two main customs. The first is dragon boat racing: long boats with a dragon head, where many rowers pull together to the beat of a drum. The second is eating zongzi 粽子, sticky rice wrapped in bamboo leaves, with a sweet or salty filling. People also hang mugwort on the door and give children small scented bags 香囊 to keep away illness in the hot season.\n\nI think this festival is still important for two reasons. First, it teaches love for your country and loyalty through Qu Yuan's story. Second, the boat race teaches teamwork: if the rowers do not move together, they cannot win. It is amazing that a story more than 2,000 years old still brings a whole country together on the same day.", "group": "Festivals"}, {"id": "qixi", "title": "Qixi Festival 七夕节", "prompt": "Introduce the Qixi Festival and explain why it is called the Chinese Valentine's Day.", "points": ["7th day of the 7th lunar month, also called the Double Seventh Festival", "Legend: the Cowherd 牛郎 and the Weaver Girl 织女 are separated by the Milky Way", "Once a year, magpies form a bridge 鹊桥 so they can meet", "Customs: watching the stars (Altair and Vega), girls praying for skill 乞巧, couples giving gifts", "Why: faithful love; Qin Guan: 两情若是久长时，又岂在朝朝暮暮"], "short": "The Qixi Festival 七夕节 is on the seventh day of the seventh lunar month, usually in August. It is also called the Double Seventh Festival, and many people call it the Chinese Valentine's Day.\n\nThe festival comes from a famous love story. The Weaver Girl 织女 was a fairy from heaven who was very good at weaving. The Cowherd 牛郎 was a poor young man on earth. They fell in love, married and had children. But the Queen Mother of Heaven was angry and took the Weaver Girl back to heaven. She drew a river across the sky, the Milky Way, to keep them apart. The magpies felt sorry for them, so once a year, on this night, they make a bridge with their bodies 鹊桥, and the couple can meet.\n\nOn this night, people look at two bright stars, Vega and Altair, which stand for the Weaver Girl and the Cowherd. In the past, girls prayed to the Weaver Girl for skill in sewing 乞巧, for example by threading a needle in the moonlight. Today, couples give each other flowers and gifts.\n\nI think Qixi is special because it shows true love and patience. The poet Qin Guan wrote 两情若是久长时，又岂在朝朝暮暮: if love is true and long, lovers do not need to be together every day. Kazakhs have a famous love story too, Kozy Korpesh and Bayan Sulu, so I understand why such stories live for hundreds of years.", "group": "Festivals"}, {"id": "midautumn", "title": "Mid-Autumn Festival 中秋节", "prompt": "Introduce the Mid-Autumn Festival and explain its meaning for Chinese people.", "points": ["15th day of the 8th lunar month (25 September 2026), when the moon is fullest", "Legend of Chang'e 嫦娥 flying to the moon, with the Jade Rabbit", "Customs: admiring the moon, mooncakes 月饼, family dinner, lanterns, and in the south, osmanthus wine", "A round moon and a round mooncake both mean reunion 团圆", "Su Shi: 但愿人长久，千里共婵娟 ('we share the same moon though a thousand miles apart')"], "short": "The Mid-Autumn Festival 中秋节 is on the fifteenth day of the eighth lunar month, usually in September or early October. On this night the moon is the roundest and brightest of the year. In 2026 it was on 25 September. It is the second most important festival in China after the Spring Festival.\n\nThe most famous legend is about Chang'e 嫦娥. She drank a magic medicine and flew to the moon, where she still lives with the Jade Rabbit. People look at the moon and remember her story.\n\nOn this day, families come home and eat dinner together. After dinner they sit outside, admire the full moon and share mooncakes 月饼. Mooncakes are round cakes with sweet fillings like lotus seed paste, and some have a salty egg yolk inside. Children carry lanterns, and in the south people drink osmanthus wine.\n\nThe key idea of the festival is reunion 团圆. The round moon and the round mooncake are symbols of a complete family. The poet Su Shi wrote 但愿人长久，千里共婵娟: \"I hope we live long and share the beautiful moon, even a thousand miles apart.\" So even people who cannot go home look at the same moon as their family.\n\nMid-Autumn was my first Chinese festival. It came two weeks after I arrived in Zhuhai. I was almost 4,800 km from my family, and that night I understood Su Shi's poem: the moon over Zhuhai was the same moon my family saw in Turkestan.", "group": "Festivals"}, {"id": "doubleninth", "title": "Double Ninth Festival 重阳节", "prompt": "Introduce the Double Ninth Festival and explain why it is meaningful for Chinese people today.", "points": ["9th day of the 9th lunar month (18 October 2026); nine is a yang number, so 'double yang' 重阳", "Legend of Huan Jing, who escaped disaster by climbing a mountain with dogwood 茱萸 and chrysanthemum wine", "Customs: climbing heights 登高, enjoying chrysanthemums, chrysanthemum wine, Chongyang cake 重阳糕, wearing dogwood", "九九 sounds like 久久 (long-lasting), so it wishes long life; since 2012 by law it is also Seniors' Day 老年节", "Wang Wei: 独在异乡为异客，每逢佳节倍思亲"], "short": "The Double Ninth Festival 重阳节 is on the ninth day of the ninth lunar month, usually in October. In 2026 it was on 18 October. In Chinese thinking, nine is a yang number, so a day with two nines is called \"double yang\" 重阳.\n\nThere is an old legend about a man called Huan Jing. A wise teacher warned him that a disaster would come on the ninth day of the ninth month. Huan Jing took his family up a mountain. They wore dogwood 茱萸 and drank chrysanthemum wine, and they were safe.\n\nFrom this story come the customs. People climb mountains or high places 登高. They enjoy chrysanthemum flowers, drink chrysanthemum wine and eat Chongyang cake 重阳糕. The word 糕 (cake) sounds like 高 (high), so the cake also means going higher in life.\n\nToday the festival is mostly about respecting old people. The number 九九 sounds like 久久, which means \"for a long time\", so it is a wish for a long life. Since 2012 the law has made it Seniors' Day 老年节. Families visit their grandparents, and many old people go hiking together. It shows the Chinese value of respect for parents and elders (孝).\n\nThe poet Wang Wei wrote 独在异乡为异客，每逢佳节倍思亲: \"Alone in a strange land, on every festival I miss my family twice as much.\" As a student far from Kazakhstan, I feel this line strongly. Respect for elders is also very important in my culture, so this festival feels close to my heart.", "badge": "On the first group's paper", "group": "Festivals"}, {"id": "nationalday", "title": "National Day 国庆节", "prompt": "Introduce China's National Day and explain why it is important for Chinese people.", "points": ["Say China's National Day (the teacher's answer in the group), on 1 October", "1 October 1949: Mao Zedong declared the founding of the People's Republic of China at Tian'anmen; about 300,000 people attended", "National anthem March of Volunteers; five-star red flag: red for revolution, the stars for the people united under the Party", "Customs: flag-raising at Tian'anmen, parades, red flags, a week-long Golden Week holiday", "Why: the end of over 100 years of semi-colonial history, independence, national pride and unity"], "short": "China's National Day 国庆节 is on 1 October. It celebrates the founding of the People's Republic of China. Our teacher reminded us that in English we should say China's National Day.\n\nOn 1 October 1949, about 300,000 people gathered in Tian'anmen Square in Beijing. At 3 pm, Chairman Mao Zedong stood on the Tian'anmen Gate and declared the founding of the People's Republic of China. Then he raised the first five-star red flag while the national anthem, March of Volunteers, was played. After that there was a big military parade. On the flag, red stands for the revolution, and the stars stand for the Chinese people united under the Communist Party of China.\n\nToday National Day is a holiday of about one week, called Golden Week. Many people travel or go back to their hometowns. There is a flag-raising ceremony in Tian'anmen Square, and cities are decorated with red flags and lanterns. On big anniversaries there are grand parades.\n\nI think National Day is important for two reasons. First, it marks the end of more than 100 years of a weak, semi-colonial China, so it is a symbol of independence. Second, it brings people together with national pride. This was my first National Day in China. The red flags everywhere made our lessons on the national anthem and the flag-raising real for me. Kazakhstan celebrates its Independence Day on 16 December, so I understand how much it means for a nation to have its own country.", "group": "National Day and BIT"}, {"id": "bitmotto", "title": "BIT slogan 德以明理 学以精工", "prompt": "What is the motto of Beijing Institute of Technology? Explain its meaning and what it means to you as a BIT student.", "points": ["Motto: 德以明理，学以精工 (dé yǐ míng lǐ, xué yǐ jīng gōng)", "English: Seek Truth in Virtue; Pursue Study to Perfect Practice", "德以明理: good character helps us understand what is right and true", "学以精工: we study in order to become excellent at real, practical work", "History: founded in Yan'an in 1940, the first science and engineering university set up by the CPC; moved to Beijing in 1949; 'Yan'an roots, military-industry soul' 延安根、军工魂", "Your view: skill needs morals; connect it to your own studies"], "short": "The motto of Beijing Institute of Technology is 德以明理，学以精工 (dé yǐ míng lǐ, xué yǐ jīng gōng). In English it is usually translated as \"Seek Truth in Virtue; Pursue Study to Perfect Practice\".\n\nThe first part, 德以明理, is about character. It means that a good heart and good morals help us understand what is right and true. The second part, 学以精工, is about skills. It means that we study hard so that we can do practical work very well, especially in science and engineering. Together, the motto says that a good engineer needs both a good heart and strong skills.\n\nThe motto comes from BIT's history. The university was founded in Yan'an in 1940. It was the first science and engineering university set up by the Communist Party of China. Life was very hard, but students learned science to help their country. In 1949 the university moved to Beijing. Because of this history, BIT talks about its \"Yan'an roots and military-industry soul\" 延安根、军工魂.\n\nI think the motto is important for two reasons. First, technology without morals can hurt people, so knowledge must be used for good. Second, knowledge is only valuable when we can use it in real life. As a student who loves programming, I know that a program must be both correct and useful. I want to use what I learn at BIT to help people in both Kazakhstan and China.", "group": "National Day and BIT"}]}, "book": [{"chapter": "Geography", "pages": "1-31", "questions": [{"q": "What is the northernmost point of China?", "options": ["The Pamir Plateau", "The meeting point of the Heilongjiang and Wusuli Rivers", "The central line of the main channel of the Heilongjiang River", "The Daxing'anling Mountains"], "answer": 2, "explain": "The book says the northernmost part of China is the central line in the main channel of the Heilongjiang River (the Heilongjiang-Wusuli meeting point is the easternmost).", "page": 2}, {"q": "In land area, China is second only to which two countries?", "options": ["The USA and Brazil", "Russia and Canada", "Russia and the USA", "Canada and Australia"], "answer": 1, "explain": "The book says China's land area of about 9.6 million square km is second only to Russia and Canada, making it the third largest country in the world.", "page": 2}, {"q": "How long is China's coastline?", "options": ["About 22,800 km", "About 5,500 km", "About 9,600 km", "About 18,000 km"], "answer": 3, "explain": "The book gives a total coastline of about 18,000 km (22,800 km is the length of the land border).", "page": 3}, {"q": "Which list shows China's seas in order from north to south?", "options": ["Yellow Sea, Bohai Sea, South China Sea, East China Sea", "Bohai Sea, Yellow Sea, East China Sea, South China Sea", "East China Sea, Bohai Sea, Yellow Sea, South China Sea", "Bohai Sea, East China Sea, Yellow Sea, South China Sea"], "answer": 1, "explain": "The book lists China's seas from north to south as the Bohai Sea, the Yellow Sea, the East China Sea and the South China Sea.", "page": 3}, {"q": "Which of the following is NOT one of China's 4 municipalities?", "options": ["Chongqing", "Tianjin", "Shanghai", "Guangzhou"], "answer": 3, "explain": "The book's table lists the 4 municipalities as Beijing, Shanghai, Tianjin and Chongqing; Guangzhou is the capital of Guangdong Province.", "page": 4}, {"q": "Which province has the short name \"Lu\"?", "options": ["Shandong", "Hubei", "Anhui", "Liaoning"], "answer": 0, "explain": "The book's table gives Shandong the short name Lu (Hubei is E, Anhui is Wan, Liaoning is Liao).", "page": 4}, {"q": "According to the book, about what share of the world's population is Chinese?", "options": ["About 22% (one in five people)", "About 10% (one in ten people)", "About 33% (one in three people)", "About 50% (one in two people)"], "answer": 0, "explain": "The book says China has more than 1.37 billion people, 22% of the world, so one in five people is Chinese; today it is about 1.41 billion (about 17%), and India passed China in 2023.", "page": 5}, {"q": "The Han people make up about what percent of China's population?", "options": ["55%", "91.5%", "98%", "75%"], "answer": 1, "explain": "The book says the Han have the largest population, about 91.5% of China's total (the 2020 census gives 91.11%); 98% is the Han share in Taiwan.", "page": 6}, {"q": "Which ethnic group is called the \"Prairie Nation\" and holds the Nadamu fair?", "options": ["The Uyghur people", "The Miao people", "The Tibetan people", "The Mongolian people"], "answer": 3, "explain": "The book says the Mongolian people are known as the \"Prairie Nation\" and hold the yearly Nadamu fair.", "page": 6}, {"q": "According to the book, which is the third largest of China's four great plateaus?", "options": ["The Qinghai-Tibet Plateau", "The Inner Mongolia Plateau", "The Loess Plateau", "The Yunnan-Guizhou Plateau"], "answer": 2, "explain": "The book says the Loess Plateau is the third largest of the four plateaus and is covered with 50-80 meters of loess.", "page": 8}, {"q": "Which of these is NOT one of China's four major basins?", "options": ["The Junggar Basin", "The Turpan Basin", "The Qaidam Basin", "The Sichuan Basin"], "answer": 1, "explain": "The book lists the four major basins as the Tarim, Junggar, Qaidam and Sichuan Basins.", "page": 9}, {"q": "Which basin is called a \"land of abundance\"?", "options": ["The Tarim Basin", "The Qaidam Basin", "The Junggar Basin", "The Sichuan Basin"], "answer": 3, "explain": "The book says the Sichuan Basin has plains and hills, many kinds of plants and a developed economy, and is a rich \"land of abundance\".", "page": 9}, {"q": "Which of these is NOT one of China's three major plains?", "options": ["The North China Plain", "The Pearl River Delta", "The Northeast Plain", "The Middle and Lower Yangtze River Plain"], "answer": 1, "explain": "The book names the Northeast Plain, the North China Plain and the Middle and Lower Yangtze River Plain as the three major plains; the Pearl River Delta is listed as an extra one.", "page": 9}, {"q": "What is the largest desert in China?", "options": ["The Taklamakan Desert", "The Gobi Desert", "The Badain Jaran Desert", "The Tengger Desert"], "answer": 0, "explain": "The book says the Tarim Basin in Xinjiang holds the largest desert in China, the Taklamakan Desert.", "page": 23}, {"q": "According to the book, how high is Qomolangma (Mount Everest)?", "options": ["3,767 meters", "6,000 meters", "8,844.43 meters", "9,120 meters"], "answer": 2, "explain": "The book gives 8,844.43 meters (the 2005 survey); the 2020 China-Nepal survey gives 8,848.86 meters.", "page": 10}, {"q": "Which of the following about the Himalayas is true?", "options": ["They are one of the oldest mountains in the world", "They are on the border between China and Mongolia", "The north slope gets more rain than the south slope", "They are still rising because they are young mountains"], "answer": 3, "explain": "The book says the Himalayas are one of the youngest mountains in the world and are still rising; the south slope is the rainy, green side.", "page": 10}, {"q": "What is the main peak of the Qinling Ridge?", "options": ["Mount Taibai", "Mount Tai", "Mount Song", "Mount Lu"], "answer": 0, "explain": "The book says Mount Taibai (3,767 m) is the main peak of the Qinling Ridge and the highest peak east of the Qinghai-Tibet Plateau.", "page": 11}, {"q": "Which river belongs to the Arctic Ocean water system?", "options": ["The Nujiang River", "The Pearl River", "The Ertiz River", "The Yarlung Zangbo River"], "answer": 2, "explain": "The book divides China's rivers into Pacific, Indian Ocean and Arctic Ocean systems, and gives the Ertiz River as the Arctic example.", "page": 12}, {"q": "Where does the Yangtze River begin?", "options": ["The Bayankala Mountain", "The Tanggula Mountains on the Qinghai-Tibet Plateau", "The Tianshan Mountains", "The Qinling Ridge"], "answer": 1, "explain": "The book says the Yangtze originates from the Tanggula Mountains on the Qinghai-Tibet Plateau (the Yellow River starts at Bayankala).", "page": 12}, {"q": "Beijing was the capital of six dynasties. Which of these was NOT one of them?", "options": ["Yuan", "Liao", "Tang", "Ming"], "answer": 2, "explain": "The book lists Beijing's six dynasties as Yan, Liao, Jin, Yuan, Ming and Qing.", "page": 17}, {"q": "Which is the largest of the three grand halls of the Forbidden City?", "options": ["The Hall of Central Harmony (Zhonghe)", "The Hall of Preserving Harmony (Baohe)", "The Hall of Heavenly Purity", "The Hall of Supreme Harmony (Taihe)"], "answer": 3, "explain": "The book says the Taihe (Supreme Harmony) Hall is the largest of the three grand halls and the Zhonghe Hall is the smallest.", "page": 17}, {"q": "Which city is called \"the Paris of the Orient\"?", "options": ["Hong Kong", "Shanghai", "Beijing", "Guangzhou"], "answer": 1, "explain": "The book says Shanghai has the title of \"the Paris of the Orient\" (Hong Kong is \"the Pearl of the Orient\").", "page": 17}, {"q": "When did Hong Kong return to China?", "options": ["July 1, 1997", "October 1, 1949", "December 20, 1999", "July 1, 1982"], "answer": 0, "explain": "The book says China set up the Hong Kong Special Administrative Region on July 1, 1997; talks with Britain began in 1982.", "page": 20}, {"q": "Which mountains divide Xinjiang into southern and northern parts?", "options": ["The Kunlun Mountains", "The Aertai (Altai) Mountains", "The Tianshan Mountains", "The Qilian Mountains"], "answer": 2, "explain": "The book says Xinjiang is \"three mountains squeezing two basins\" and the Tianshan in the middle divides southern and northern Xinjiang.", "page": 23}, {"q": "Which city is called the \"City of Sunlight\"?", "options": ["Lhasa", "Shigatse", "Urumqi", "Xining"], "answer": 0, "explain": "The book says Lhasa, more than 3,500 meters above sea level, is called the \"City of Sunlight\".", "page": 26}, {"q": "What does the name \"Jiuzhaigou\" mean?", "options": ["Valley of nine villages", "Valley of nine lakes", "Valley of nine waterfalls", "Valley of nine dragons"], "answer": 0, "explain": "The book says the Jiuzhaigou valley in northern Sichuan has nine Tibetan villages, hence its name.", "page": 26}, {"q": "Which is the first National Forest Park in China?", "options": ["Jiuzhaigou", "The Yili Valley", "Zhangjiajie", "Shennongjia"], "answer": 2, "explain": "The book says Zhangjiajie in northwest Hunan is the first National Forest Park in China.", "page": 27}, {"q": "The Ming Dynasty Great Wall runs from where in the east to where in the west?", "options": ["From Shanhaiguan to Yumenguan", "From Beijing to Xi'an", "From the Bohai Sea to Lhasa", "From the Yalu River to Jiayuguan Pass"], "answer": 3, "explain": "The book says the Ming Great Wall, about 6,300 km long, runs from the Yalu River in the east to Jiayuguan Pass in the west.", "page": 28}, {"q": "When did local peasants find the Terracotta Army?", "options": ["1949", "1974", "1987", "2004"], "answer": 1, "explain": "The book says peasants found the clay warriors in 1974 while drilling wells (1987 is when it became World Heritage).", "page": 29}, {"q": "Where are the Hani Terraces?", "options": ["Yunnan", "Guangxi", "Sichuan", "Hunan"], "answer": 0, "explain": "The book names the Hani Terraces in Yunnan and the Longji Terraces in Guangxi as China's two representative terraced fields.", "page": 30}], "facts": [{"fact": "China is in Eastern Asia on the west coast of the Pacific; land area about 9.6 million sq km, 3rd largest country in the world and largest in Asia.", "page": 2}, {"fact": "North-south distance about 5,500 km; east-west about 5,200 km, spanning 5 time zones.", "page": 2}, {"fact": "Easternmost point: where the main channels of the Heilongjiang and Wusuli Rivers meet; westernmost point: near the Pamir Plateau.", "page": 2}, {"fact": "Land border about 22,800 km; coastline about 18,000 km.", "page": 3}, {"fact": "Seas from north to south: Bohai, Yellow, East China, South China. More than 7,600 islands; Taiwan is the largest.", "page": 3}, {"fact": "Divisions: 23 provinces, 4 municipalities (Beijing, Shanghai, Tianjin, Chongqing), 5 autonomous regions, 2 SARs. Short names: Beijing = Jing, Jiangsu = Su.", "page": 4}, {"fact": "Autonomous region capitals: Guangxi - Nanning, Inner Mongolia - Huhhot, Ningxia - Yinchuan, Tibet - Lhasa, Xinjiang - Urumqi.", "page": 5}, {"fact": "Population (book, 'as of 2010'): over 1.37 billion = 22% of the world; urban 49.68%, rural 50.32% in 2010. (Now about 1.41 billion; India is more populous since 2023.)", "page": 5}, {"fact": "56 ethnic groups; Han 91.5%; 55 minorities live mainly in the northwest, southwest and northeast.", "page": 6}, {"fact": "Miao embroidery (Guizhou) became National Intangible Cultural Heritage in 2006; 'Nadamu' means 'entertainment/game' in Mongolian.", "page": 6}, {"fact": "Plains are only 18.75% of land area (book figure); mountains, plateaus and hills are more than two-thirds.", "page": 7}, {"fact": "Four great plateaus (Qinghai-Tibet, Inner Mongolia, Loess, Yunnan-Guizhou) = 33.3% of land (book figure); Qinghai-Tibet is largest, average over 4,000 m.", "page": 8}, {"fact": "Four major basins: Tarim, Junggar, Qaidam, Sichuan. Tarim is the largest inland basin and rich in oil and natural gas.", "page": 9}, {"fact": "Himalayas: more than 2,400 km long, average over 6,000 m; Qomolangma ('Mother Earth' in Tibetan) is 8,844.43 m in the book (8,848.86 m since 2020), on the China-Nepal border.", "page": 10}, {"fact": "Yarlung Zangbo Grand Canyon is the world's largest and deepest canyon.", "page": 11}, {"fact": "Qinling Ridge: more than 1,500 km long, from Gansu through Shaanxi to Henan; main peak Mount Taibai, 3,767 m, the 'back garden' of Xi'an.", "page": 11}, {"fact": "Three water systems: Pacific (Yangtze, Yellow, Pearl), Indian Ocean (Nujiang, Yarlung Zangbo), Arctic (Ertiz). China's hydropower resources rank first in the world.", "page": 12}, {"fact": "Yangtze: starts at the Tanggula Mountains; basin 1.8 million sq km (about 20% of China); more than 6,300 km; lower reaches = 'golden waterway'.", "page": 13}, {"fact": "Three Gorges run from west of Chongqing to east of Yichang (Hubei).", "page": 13}, {"fact": "Yellow River: starts at Bayankala Mountain (Qinghai), flows through 9 provinces/regions, 5,500 km in the book (usually 5,464 km).", "page": 13}, {"fact": "Beijing was capital of six dynasties: Yan, Liao, Jin, Yuan, Ming, Qing. Forbidden City: about 720,000 sq m, more than 70 palaces, more than 9,000 houses.", "page": 16}, {"fact": "Hong Kong: 'Pearl of the Orient', returned July 1, 1997; Victoria Harbour is one of the world's three natural harbours (with San Francisco Bay and Rio de Janeiro).", "page": 19}, {"fact": "Xinjiang: 1.66 million sq km, almost 1/6 of China; 'three mountains squeezing two basins' (Aertai, Tianshan, Kunlun; Junggar, Tarim).", "page": 23}, {"fact": "Great Wall: total length 21,196.18 km across 15 provinces (announced June 5, 2012); Ming section about 6,300 km; World Heritage 1987.", "page": 29}, {"fact": "Terracotta Army (Lintong, Xi'an): found 1974; more than 8,000 figures, 50+ chariots, 400,000+ weapons; World Heritage 1987.", "page": 29}], "printed_pages": true}], "learn": {"tips": ["Wrong answers love the words <b>only, all, never<\/b>. Not one correct answer in the teacher's banks uses them.", "On a <b>NOT<\/b> question, find the one that doesn't belong. Read the question twice.", "Spend about <b>6 minutes<\/b> on the 20 questions and about <b>6 minutes<\/b> on each essay. The 4 essays are worth <b>80 of the 100 points<\/b>."], "lessons": [{"id": "c1-location", "chapter": "Chapter 1 · Geography", "title": "Location and size", "cn": "地理位置", "facts": [{"fact": "China is in Eastern Asia on the west coast of the Pacific; land area about 9.6 million sq km, 3rd largest country in the world and largest in Asia.", "page": 2}, {"fact": "North-south distance about 5,500 km; east-west about 5,200 km, spanning 5 time zones.", "page": 2}, {"fact": "Easternmost point: where the main channels of the Heilongjiang and Wusuli Rivers meet; westernmost point: near the Pamir Plateau.", "page": 2}, {"fact": "Land border about 22,800 km; coastline about 18,000 km.", "page": 3}, {"fact": "Seas from north to south: Bohai, Yellow, East China, South China. More than 7,600 islands; Taiwan is the largest.", "page": 3}], "cards": [{"cue": "China's four corners?", "answer": "N: middle of the Heilongjiang River, just north of Mohe · S: Zengmu Ansha · W: Pamir · E: Heilongjiang + Wusuli meet", "hook": "The Heilongjiang is the border with Russia, and the line runs down the middle of its main channel. Mohe = MOre cold, the town beside it. Z is the last letter, so Zengmu is the very bottom. Pamir is on your side, toward Central Asia.", "qs": ["G2", "P-G-11", "P-G-12", "P-G-13", "B-Geography-1"]}, {"cue": "How big is China?", "answer": "9.6 million km² · 3rd largest, after Russia and Canada · 5 time zones · land border 22,800 km", "hook": "9.6 sounds like a nearly perfect exam score: 9.6 out of 10.", "qs": ["P-G-14", "P-G-15", "P-G-16", "B-Geography-2"]}, {"cue": "Coast and seas, north to south?", "answer": "Coast 18,000 km · Bohai, Yellow, East China, South China · largest island Taiwan", "hook": "Big Yaks Eat Salad.", "qs": ["B-Geography-3", "B-Geography-4", "P-G-17"]}, {"cue": "How many land neighbours?", "answer": "14, including Kazakhstan · Japan is not one", "hook": "Valentine's Day is the 14th: 14 neighbours to love. Japan is across the sea, so it can't share a land border.", "qs": ["G10", "P-G-26"]}]}, {"id": "c1-divisions", "chapter": "Chapter 1 · Geography", "title": "Administrative divisions", "cn": "行政区划", "facts": [{"fact": "Divisions: 23 provinces, 4 municipalities (Beijing, Shanghai, Tianjin, Chongqing), 5 autonomous regions, 2 SARs. Short names: Beijing = Jing, Jiangsu = Su.", "page": 4}, {"fact": "Autonomous region capitals: Guangxi - Nanning, Inner Mongolia - Huhhot, Ningxia - Yinchuan, Tibet - Lhasa, Xinjiang - Urumqi.", "page": 5}], "cards": [{"cue": "How is China divided?", "answer": "23 provinces + 5 autonomous regions + 4 municipalities + 2 SARs = 34", "hook": "Michael Jordan's 23, then count down: 5, 4, 2. The SARs are Hong Kong and Macao.", "qs": ["P-G-18", "P-G-19", "P-G-20", "P-G-21", "P-G-22", "G4"]}, {"cue": "The 4 municipalities? Short name Lu?", "answer": "Beijing, Shanghai, Tianjin, Chongqing · Lu = Shandong", "hook": "B-S-T-C: BeST City. Guangzhou is not one. Lu was Confucius's home state, in Shandong.", "qs": ["B-Geography-5", "B-Geography-6"]}, {"cue": "Autonomous regions on the border?", "answer": "South: Guangxi · North: Inner Mongolia", "hook": "Guangxi is next door to your Guangdong, so it has to be south.", "qs": ["G14", "P-G-23"]},
