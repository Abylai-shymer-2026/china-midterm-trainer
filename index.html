<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>Overview of China Mock Exam</title>
<style>
/* Layout: an exam sheet lying on a desk. The student writes in blue ballpoint, the teacher marks in red pen. */
:root{
  --desk:#E3E8EC; --paper:#FCFCFA; --line:#D9E0E6; --ink:#1A222C; --ink2:#4B5663; --muted:#7A8592;
  --blue:#1E4DB3; --blue-soft:#E7EEFB; --red:#C4161C; --red-soft:#FBE9E9; --ok:#13734A; --ok-soft:#E5F4EC;
  --chip:#EEF2F5; --shadow:0 1px 2px rgba(20,30,40,.08),0 8px 28px rgba(20,30,40,.08);
  --f-paper:"Source Serif 4","Noto Serif SC",Georgia,serif; --f-ui:"IBM Plex Sans","Noto Serif SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --f-pen:"Kalam","Chalkboard SE","Segoe Print","Comic Sans MS",sans-serif; --f-cn:"Noto Serif SC","Songti SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0F1317; --paper:#181D23; --line:#2A323C; --ink:#E5E9ED; --ink2:#AEB7C1; --muted:#7E8995;
  --blue:#86A9FF; --blue-soft:#1C2740; --red:#FF6B66; --red-soft:#3A1F21; --ok:#5ED19B; --ok-soft:#173027;
  --chip:#222A33; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0F1317; --paper:#181D23; --line:#2A323C; --ink:#E5E9ED; --ink2:#AEB7C1; --muted:#7E8995;
  --blue:#86A9FF; --blue-soft:#1C2740; --red:#FF6B66; --red-soft:#3A1F21; --ok:#5ED19B; --ok-soft:#173027;
  --chip:#222A33; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:16px/1.55 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
.wrap{max-width:860px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cn{font-family:var(--f-cn)}

/* top nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk);display:flex;gap:4px;align-items:center;padding:14px 0 10px;flex-wrap:wrap}
nav.top .brand{font:600 15px var(--f-paper);margin-right:auto;letter-spacing:.2px}
nav.top .brand small{display:block;font:500 11px var(--f-ui);color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
#sync{letter-spacing:.3px;text-transform:none}
nav.top a{padding:7px 12px;border-radius:999px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14.5px}
nav.top a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

/* the sheet */
.sheet{background:var(--paper);box-shadow:var(--shadow);border-radius:4px;padding:clamp(18px,4vw,44px)}
.sheet + .sheet{margin-top:18px}
.inst{text-align:center;font:500 13px var(--f-paper);color:var(--ink2)}
.ptitle{text-align:center;font:700 clamp(19px,3.2vw,24px)/1.25 var(--f-paper);margin:6px 0 4px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;font:14px var(--f-paper);color:var(--ink2);border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:20px}
.fields{display:flex;flex-wrap:wrap;gap:8px 20px;font:14.5px var(--f-paper);margin-bottom:18px}
.fields label{display:flex;gap:6px;align-items:baseline;flex:1 1 160px;min-width:0}
.fields input{border:0;border-bottom:1px solid var(--ink2);background:none;padding:2px 4px;flex:1;min-width:0;font-family:var(--f-pen);font-size:18px;color:var(--blue)}
h2.part{font:700 17px/1.4 var(--f-paper);margin:26px 0 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
h2.part .score{font:400 14px var(--f-paper);color:var(--ink2)}
h2.part .score b{font:700 22px var(--f-pen);color:var(--red);padding:0 4px}

/* questions */
ol.qs{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.q{position:relative;font-family:var(--f-paper);padding-left:34px}
.q .n{position:absolute;left:0;top:0;font-weight:700;width:28px;text-align:right}
.q .stem{font-size:16.5px;margin-bottom:6px;text-wrap:pretty}
.q .tag{font:500 11px var(--f-ui);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-left:6px;white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.opts.long{grid-template-columns:1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;cursor:pointer;min-width:0}
.opt:hover{background:var(--chip)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .L{font-weight:600;min-width:1.4em}
.opt:has(input:checked){background:var(--blue-soft);color:var(--blue)}
.opt:has(input:checked) .L{font-family:var(--f-pen);font-size:19px;line-height:1.1;border:1.6px solid var(--blue);border-radius:50%;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.opt:has(input:focus-visible){outline:2px solid var(--blue)}
.graded .opt{cursor:default}
.opt.right,.opt.right:has(input:checked){background:var(--ok-soft);color:var(--ok)}
.opt.wrong:has(input:checked) .L{border-color:var(--red)}
.opt.right:has(input:checked) .L{border-color:var(--ok)}
.opt.wrong,.opt.wrong:has(input:checked){background:var(--red-soft);color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px}
.mark{position:absolute;left:-8px;top:-10px;font:700 30px/1 var(--f-pen);color:var(--red);transform:rotate(-8deg);pointer-events:none}
.why{margin-top:6px;font:14px/1.5 var(--f-ui);color:var(--ink2);background:var(--chip);padding:8px 12px;border-radius:6px}
.why b{color:var(--red);font-family:var(--f-pen);font-size:16px}

/* essay */
.prompt{font:600 16.5px/1.5 var(--f-paper)}
textarea{width:100%;min-height:260px;margin-top:10px;border:1px solid var(--line);border-radius:4px;padding:10px 12px;resize:vertical;
  font:19px/32px var(--f-pen);color:var(--blue);background:var(--paper) repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-attachment:local}
.wc{font:13px var(--f-mono);color:var(--muted);text-align:right}

/* chrome */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);box-shadow:var(--shadow);border-radius:999px;padding:6px 6px 6px 18px;margin-bottom:14px}
.timer{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.prog{font:13px var(--f-mono);color:var(--ink2)}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.choice{display:grid;gap:10px;margin:14px 0}
.choice label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.choice label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.choice b{display:block}
.choice span{color:var(--ink2);font-size:14px}
select{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--paper);max-width:100%}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.eyebrow{font:600 11.5px var(--f-ui);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.confirm{border:1.5px solid var(--red);background:var(--red-soft);border-radius:8px;padding:12px 14px;margin-top:12px}

/* result stamp */
.stamp{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:flex-end;border-bottom:1.5px dashed var(--line);padding-bottom:16px;margin-bottom:8px}
.stamp .big{font:700 clamp(54px,11vw,78px)/.9 var(--f-pen);color:var(--red);transform:rotate(-4deg)}
.stamp .big small{font-size:.42em}
.stamp .parts{font:15px var(--f-paper);color:var(--ink2)}
.stamp .parts b{font-family:var(--f-pen);color:var(--red);font-size:20px}
.rub{display:grid;gap:8px;margin:12px 0}
.rub label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 10px;border-radius:6px;background:var(--chip)}
.rub .pts{font:600 14px var(--f-mono)}
.fb{border-left:3px solid var(--red);padding:4px 0 4px 14px;margin-top:12px;font-size:15px}
.fb h4{margin:10px 0 4px;font:600 13px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.fb ul{margin:0;padding-left:20px}
.fb .fix{font-family:var(--f-paper)}
.fb .fix s{color:var(--red)}
.model{font:15.5px/1.65 var(--f-paper);white-space:pre-line;background:var(--chip);border-radius:6px;padding:14px 16px;margin-top:10px}
details>summary{cursor:pointer;font-weight:600;padding:4px 0}

/* practice */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .c{font:12px var(--f-mono);opacity:.7;margin-left:4px}
.pcount{display:flex;justify-content:space-between;font:13px var(--f-mono);color:var(--muted);margin-bottom:12px}
.hist{font:13px var(--f-mono);color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}

/* essays + facts */
.ess{border-top:1px solid var(--line);padding:16px 0}
.eyebrow + .ess{border-top:0;padding-top:10px}
.ess h3{font:700 19px var(--f-paper);margin:0 0 4px}
.badge{display:inline-block;font:600 11px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;background:var(--red-soft);color:var(--red);border-radius:4px;padding:2px 7px;margin-left:6px;vertical-align:3px}
ul.kp{margin:8px 0 0;padding-left:20px;font-family:var(--f-paper)}
ul.kp li{margin:3px 0}
.facts h3{font:700 18px var(--f-paper);margin:22px 0 8px}
.facts h3:first-child{margin-top:0}
.facts ul{margin:0;padding-left:20px;font-family:var(--f-paper)}
.facts li{margin:4px 0}
.facts .pg{font:12px var(--f-mono);color:var(--muted)}
table.mt{border-collapse:collapse;font:14.5px var(--f-paper);width:100%}
table.mt td,table.mt th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.mt td:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.tw{overflow-x:auto}

/* notes */
.notes h2{font:700 22px var(--f-paper);margin:30px 0 0;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.notes .eyebrow + h2{margin-top:10px}
.notes li{margin:8px 0}
.notes .nq{color:var(--ink2)}
.notes .nh{display:block;font:400 16.5px/1.3 var(--f-pen);color:var(--red)}
.notes ol{margin:4px 0;padding-left:20px;font-size:15px;color:var(--ink2)}
.move{margin-top:16px}
.move label{display:block;margin-top:10px}
.move textarea{min-height:76px;margin:4px 0 8px;padding:8px 10px;font:12px/1.4 var(--f-mono);color:var(--ink2);background:var(--chip);word-break:break-all}
#move-msg{margin-top:8px;color:var(--ok)}
/* learn */
.ready{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:end}
.ready .num{font:700 clamp(46px,9vw,64px)/.9 var(--f-pen);color:var(--red)}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);transition:width .4s ease}
.lessons{display:grid;gap:2px;margin-top:18px}
.lesson{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px}
.lesson:hover{background:var(--chip)}
.lesson .i{font:600 14px var(--f-mono);color:var(--muted)}
.lesson.done .i{color:var(--ok);font-size:17px}
.lesson b{font:600 17px var(--f-paper)}
.lesson small{font-family:var(--f-cn);color:var(--muted);margin-left:6px}
.lesson .s{font:12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.tips{margin:18px 0 0;padding:14px 16px 14px 34px;background:var(--chip);border-radius:6px;font-size:14.5px}
.tips li{margin:3px 0}
.mem{min-height:300px;display:flex;flex-direction:column;gap:14px;justify-content:center;padding:18px 0}
.mem .cue{font:500 17px var(--f-ui);color:var(--ink2)}
.mem .ans{font:700 clamp(25px,5vw,36px)/1.2 var(--f-paper);text-wrap:balance}
.mem .hook{font:400 clamp(19px,3.4vw,23px)/1.35 var(--f-pen);color:var(--red)}
.mem ol{margin:0;padding-left:22px;font:15.5px/1.55 var(--f-paper);color:var(--ink2)}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--chip)}
.steps i.on{background:var(--ink)}
.lhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;font-size:14px;color:var(--muted)}
.lhead button{background:none;border:0;padding:2px 0;color:var(--ink2);text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.mark,.stamp .big{animation:pen .35s ease-out both}@keyframes pen{from{opacity:0;transform:scale(1.4) rotate(-8deg)}}}
</style>
