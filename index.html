<script>
const DATA = {"bank": {"sets": [{"id": "G", "name": "Geography of China", "src": "Teacher's bank: geography (15)", "questions": [{"q": "Which of the following describes China's terrain feature most accurately?", "options": ["High in the east and low in the west", "High in the west and low in the east, with three tiered steps", "Dominated by plains and basins", "Mostly mountainous with no obvious elevation variation"], "answer": 1, "explain": "China's land falls from the Qinghai-Tibet Plateau in the west to the plains and sea in the east, in three steps (tiers)."}, {"q": "What is the southernmost point of China's territory?", "options": ["Mohe River", "Pamir Plateau", "Zengmu Ansha", "Confluence of Heilongjiang and Wusuli River"], "answer": 2, "explain": "Zengmu Ansha (曾母暗沙, James Shoal) in the Nansha Islands. Mohe is the northernmost point, the Pamirs the westernmost, and the Heilongjiang–Wusuli confluence the easternmost.", "past": 1}, {"q": "Which mountain range serves as the dividing line between the first and second terrain tiers of China?", "options": ["Taihang Mountains", "Himalayas", "Kunlun Mountains - Qilian Mountains - Hengduan Mountains", "Greater Khingan Range"], "answer": 2, "explain": "The Kunlun–Qilian–Hengduan line divides tiers 1 and 2. The Greater Khingan–Taihang–Wushan–Xuefeng line divides tiers 2 and 3.", "past": 2}, {"q": "How many provinces are there in China's administrative division?", "options": ["22", "23", "24", "25"], "answer": 1, "explain": "23 provinces (including Taiwan), plus 5 autonomous regions, 4 municipalities and 2 special administrative regions: 34 provincial-level units."}, {"q": "Which river is known as China's \"Mother River\" and forms a \"hanging river\" in its lower reaches?", "options": ["Yangtze River", "Pearl River", "Yellow River", "Tarim River"], "answer": 2, "explain": "The Yellow River carries so much silt from the Loess Plateau that its bed in the lower reaches is higher than the land around it (地上河, a hanging river)."}, {"q": "Which climate type dominates the Qinghai-Tibet Plateau?", "options": ["Temperate monsoon climate", "Plateau mountain climate", "Temperate continental climate", "Subtropical monsoon climate"], "answer": 1, "explain": "Average height above 4,000 m gives a cold plateau mountain climate."}, {"q": "Where is China's wettest place located?", "options": ["Turpan Basin, Xinjiang", "Huoshaoliao, Taiwan", "Guilin, Guangxi", "Hangzhou, Zhejiang"], "answer": 1, "explain": "Huoshaoliao (火烧寮) in Taiwan has the highest average yearly rainfall in China. The Turpan Basin is one of the driest places."}, {"q": "Which basin is the lowest-lying area in China (with the lowest point at -154 meters)?", "options": ["Sichuan Basin", "Tarim Basin", "Turpan Basin", "Junggar Basin"], "answer": 2, "explain": "The Turpan Basin's Aydingkol Lake is 154 m below sea level.", "past": 3}, {"q": "Which of the following is China's largest plain?", "options": ["Northeast Plain", "North China Plain", "Yangtze River Delta Plain", "Pearl River Delta Plain"], "answer": 0, "explain": "The Northeast Plain (about 350,000 km²) is the largest of China's three great plains.", "past": 4}, {"q": "How many land neighboring countries does China have?", "options": ["12", "13", "14", "15"], "answer": 2, "explain": "14 land neighbours, including Kazakhstan, Russia, Mongolia, India and Vietnam.", "past": 5}, {"q": "Which of the following is an endorheic river (not flowing into the ocean) in China?", "options": ["Heilongjiang", "Tarim River", "Pearl River", "Yangtze River"], "answer": 1, "explain": "The Tarim River in Xinjiang is China's longest inland (endorheic) river and ends in the desert.", "past": 6}, {"q": "Which mountain range is the watershed between the Yangtze River and the Yellow River?", "options": ["Qinling Mountains", "Nanling Mountains", "Wuyi Mountains", "Tianshan Mountains"], "answer": 0, "explain": "The Qinling Mountains divide the two river systems and also form China's north–south climate line (with the Huai River).", "past": 7}, {"q": "Which climate feature is typical of China's eastern regions?", "options": ["Annual precipitation evenly distributed", "Large temperature difference between winter and summer", "No obvious seasonal changes", "Dry all year round"], "answer": 1, "explain": "The monsoon gives eastern China hot, rainy summers and cold, dry winters."}, {"q": "Which autonomous region is located in China's southern border?", "options": ["Inner Mongolia Autonomous Region", "Guangxi Zhuang Autonomous Region", "Xinjiang Uygur Autonomous Region", "Ningxia Hui Autonomous Region"], "answer": 1, "explain": "Guangxi borders Vietnam in the south. Inner Mongolia is north, Xinjiang northwest, Ningxia inland.", "past": 8}, {"q": "What percentage of China's land area is covered by mountainous regions (including mountains, hills and plateaus)?", "options": ["1/3", "1/2", "2/3", "3/4"], "answer": 2, "explain": "About two thirds of China's land is mountains, hills and plateaus.", "past": 9}]}, {"id": "H", "name": "History of China", "src": "Teacher's bank: history (10)", "questions": [{"q": "Who was the first emperor of a unified China?", "options": ["Emperor Wu of Han", "Qin Shi Huang", "Kangxi Emperor", "Tang Taizong"], "answer": 1, "explain": "Qin Shi Huang unified China in 221 BC and took the title 皇帝 (emperor)."}, {"q": "Which dynasty is credited with building the earliest sections of the Great Wall?", "options": ["Ming Dynasty", "Tang Dynasty", "Qin Dynasty", "Song Dynasty"], "answer": 2, "explain": "Teacher's key: Qin. Strictly, states of the Warring States period built walls first; Qin Shi Huang linked them into one wall. Most of the wall you see today is Ming."}, {"q": "The Silk Road was initially established during the reign of which dynasty?", "options": ["Yuan Dynasty", "Han Dynasty", "Qing Dynasty", "Zhou Dynasty"], "answer": 1, "explain": "Zhang Qian's missions to the Western Regions under Emperor Wu of Han (2nd century BC) opened the Silk Road."}, {"q": "Which famous explorer from the Ming Dynasty led naval expeditions to Southeast Asia, India, and East Africa?", "options": ["Guo Shoujing", "Zheng He", "Xu Guangqi", "Li Zicheng"], "answer": 1, "explain": "Zheng He made seven voyages between 1405 and 1433."}, {"q": "Which country invaded China in the Opium Wars (1840–1842 and 1856–1860)?", "options": ["France", "United States", "Britain", "Russia"], "answer": 2, "explain": "Britain fought both Opium Wars (France joined Britain in the second).", "past": 10}, {"q": "Who founded the Yuan Dynasty after conquering the Southern Song?", "options": ["Genghis Khan", "Kublai Khan", "Hongwu Emperor", "Yongle Emperor"], "answer": 1, "explain": "Kublai Khan, Genghis Khan's grandson, founded the Yuan in 1271 and conquered the Southern Song in 1279."}, {"q": "The \"Three Kingdoms\" period followed the collapse of which dynasty?", "options": ["Shang Dynasty", "Han Dynasty", "Tang Dynasty", "Sui Dynasty"], "answer": 1, "explain": "Wei, Shu and Wu rose as the Eastern Han collapsed (220 AD).", "past": 11}, {"q": "Which event marked the end of imperial rule in China in 1912?", "options": ["The May Fourth Movement", "The Xinhai Revolution", "The Boxer Rebellion", "The Long March"], "answer": 1, "explain": "The Xinhai Revolution (1911) led to the Qing emperor's abdication and the Republic of China in 1912.", "past": 12}, {"q": "The Terracotta Army was discovered in the tomb of which ruler?", "options": ["Emperor Gaozu of Han", "Qin Shi Huang", "Wu Zetian", "Emperor Taizong of Tang"], "answer": 1, "explain": "Found in 1974 near Xi'an, guarding Qin Shi Huang's mausoleum.", "past": 13}, {"q": "Which dynasty is known for its cultural flourishing and the invention of movable type printing?", "options": ["Tang Dynasty", "Song Dynasty", "Ming Dynasty", "Qing Dynasty"], "answer": 1, "explain": "Bi Sheng invented movable type in the Northern Song (around 1040).", "past": 14}]}, {"id": "R", "name": "Yangtze & Yellow River", "src": "Teacher's bank: rivers (10) + past paper", "questions": [{"q": "Which is the longest river in China?", "options": ["The Yellow River", "The Yangtze River", "The Pearl River", "The Heilongjiang River"], "answer": 1, "explain": "The Yangtze, about 6,300 km."}, {"q": "The Yangtze River is the ______ longest river in the world.", "options": ["first", "second", "third", "fourth"], "answer": 2, "explain": "Third, after the Nile and the Amazon."}, {"q": "Where does the Yangtze River finally flow into?", "options": ["The East China Sea", "The South China Sea", "The Bohai Sea", "The Yellow Sea"], "answer": 0, "explain": "It reaches the East China Sea at Shanghai."}, {"q": "Which city is along the Yangtze River?", "options": ["Beijing", "Wuhan", "Xi'an", "Zhengzhou"], "answer": 1, "explain": "Wuhan, Chongqing, Nanjing and Shanghai are on the Yangtze. Zhengzhou is on the Yellow River."}, {"q": "The Yellow River is also called ______ of China.", "options": ["the Mother River", "the Longest River", "the Blue River", "the West River"], "answer": 0, "explain": "母亲河, the Mother River: early Chinese civilization grew along it."}, {"q": "Why is it named the Yellow River?", "options": ["Because it has many yellow fish", "Because the river water carries lots of yellow sand", "Because the sky above it is yellow", "Because people build yellow houses along it"], "answer": 1, "explain": "It carries huge amounts of yellow silt from the Loess Plateau."}, {"q": "The Yellow River is the ______ longest river in China.", "options": ["first", "second", "third", "fourth"], "answer": 1, "explain": "Second, about 5,464 km."}, {"q": "The Yellow River flows into the ______.", "options": ["East China Sea", "South China Sea", "Bohai Sea", "Red Sea"], "answer": 2, "explain": "It enters the Bohai Sea in Shandong."}, {"q": "Which river is the birthplace of Chinese civilization?", "options": ["Only the Yangtze River", "Only the Yellow River", "Both the Yangtze and Yellow River", "Neither of them"], "answer": 2, "explain": "Both basins are core cradles (the teacher's 4 Nov message: Chinese civilization is pluralistic and integrated)."}, {"q": "Which of the following is true?", "options": ["The Yellow River is longer than the Yangtze River.", "The Yangtze River has more yellow sand.", "Both rivers run from west to east in China.", "They both flow into the Bohai Sea."], "answer": 2, "explain": "Both rise on the Qinghai-Tibet Plateau and flow east, following the west-high, east-low terrain.", "past": 15}, {"q": "Which of the following provinces does the Yangtze River NOT travel through?", "options": ["Sichuan Province", "Yunnan Province", "Hunan Province", "Shandong Province"], "answer": 3, "explain": "The Yangtze flows through Qinghai, Tibet, Sichuan, Yunnan, Chongqing, Hubei, Hunan, Jiangxi, Anhui, Jiangsu and Shanghai. Shandong is on the Yellow River.", "past": 20}]}, {"id": "M", "name": "Famous mountains", "src": "Teacher's bank: Five Sacred & Three Famous Mountains (10)", "questions": [{"q": "How many sacred mountains are there in the traditional Chinese \"Five Sacred Mountains\"?", "options": ["Three", "Five", "Seven", "Nine"], "answer": 1, "explain": "五岳: Tai (east), Hua (west), Heng 衡 (south), Heng 恒 (north), Song (centre)."}, {"q": "Which mountain is known as the \"Eastern Mountain\" of the Five Sacred Mountains?", "options": ["Mount Hua", "Mount Heng", "Mount Tai", "Mount Song"], "answer": 2, "explain": "东岳泰山, Mount Tai in Shandong."}, {"q": "Which of the following mountains is the highest in the Five Sacred Mountains?", "options": ["Mount Hua", "Mount Tai", "Mount Heng (Hunan)", "Mount Song"], "answer": 0, "explain": "Mount Hua, 2,154.9 m. The lowest is Southern Heng (Hunan), 1,300.2 m."}, {"q": "Which mountain is famous for its steep and dangerous cliffs?", "options": ["Northern Mount Heng", "Mount Hua", "Eastern Mount Tai", "Southern Mount Heng"], "answer": 1, "explain": "华山天下险: Mount Hua is famous as the most dangerous."}, {"q": "Where is Mount Song located?", "options": ["Shandong Province", "Shaanxi Province", "Henan Province", "Hunan Province"], "answer": 2, "explain": "中岳嵩山, Mount Song in Henan."}, {"q": "Which temple is located on Mount Song?", "options": ["Shaolin Temple", "Puji Temple", "Fayu Temple", "Lingyin Temple"], "answer": 0, "explain": "The Shaolin Temple, home of Shaolin kung fu."}, {"q": "Which group belongs to the traditional \"Three Famous Mountains\" (Sanshan)?", "options": ["Huangshan, Lushan, Yandang Mountain", "Tai Mountain, Hua Mountain, Song Mountain", "Heng Mountain, Emei Mountain, Huangshan", "Lushan, Wuyi Mountain, Changbai Mountain"], "answer": 0, "explain": "三山: Huangshan (Anhui), Lushan (Jiangxi) and Yandang (Zhejiang)."}, {"q": "Which mountain is famous for its strange pine trees, weird rocks and sea of clouds?", "options": ["Lushan Mountain", "Huangshan Mountain", "Yandang Mountain", "Heng Mountain"], "answer": 1, "explain": "Huangshan's 'four wonders': odd pines, strange rocks, a sea of clouds and hot springs."}, {"q": "Which mountain is called the \"Western Mountain\" of the Five Sacred Mountains?", "options": ["Mount Tai", "Mount Hua", "Mount Heng", "Mount Song"], "answer": 1, "explain": "西岳华山, Mount Hua in Shaanxi."}, {"q": "Which statement about mountains is correct?", "options": ["Five Sacred Mountains are all in southern China", "Mount Tai lies in Shandong Province", "Huangshan is one of the Five Sacred Mountains", "All three mountains are in northern China"], "answer": 1, "explain": "Mount Tai is in Shandong. Huangshan is one of the Three Famous Mountains, not the Five Sacred Mountains.", "past": 16}]}, {"id": "F", "name": "May Fourth Movement", "src": "Teacher's bank (5)", "questions": [{"q": "When did the May Fourth Movement take place?", "options": ["In 1911", "In 1919", "In 1921", "In 1949"], "answer": 1, "explain": "4 May 1919, after the Paris Peace Conference gave Shandong to Japan."}, {"q": "Where did the May Fourth Movement first break out?", "options": ["Shanghai", "Nanjing", "Beijing", "Guangzhou"], "answer": 2, "explain": "Students gathered at Tiananmen in Beijing."}, {"q": "Which group was the main force at the beginning of the movement?", "options": ["Workers", "Farmers", "Students", "Soldiers"], "answer": 2, "explain": "Students started it; workers in Shanghai later joined with strikes."}, {"q": "What was the main spirit of the May Fourth Movement?", "options": ["Patriotism", "Peace", "Friendship", "Cooperation"], "answer": 0, "explain": "Patriotism, progress, democracy and science. 4 May is now China's Youth Day."}, {"q": "Which statement about the May Fourth Movement is correct?", "options": ["It is a violent war", "It is an important patriotic movement", "It happened after 1950", "It only took place in Shanghai"], "answer": 1, "explain": "A patriotic movement of 1919 that began in Beijing.", "past": 17}]}, {"id": "C", "name": "The Grand Canal", "src": "Teacher's bank (5)", "questions": [{"q": "What is the Grand Canal famous for?", "options": ["The deepest canal", "The longest artificial canal in the world", "The widest canal", "The oldest natural river"], "answer": 1, "explain": "The Beijing–Hangzhou Grand Canal (about 1,794 km) is the world's longest artificial canal and a UNESCO World Heritage site (2014)."}, {"q": "The Grand Canal runs from ______ to ______.", "options": ["east; west", "south; north", "northeast; southwest", "northwest; southeast"], "answer": 1, "explain": "It links south and north, crossing the west–east rivers."}, {"q": "Which two cities are the main ends of the Grand Canal?", "options": ["Beijing and Hangzhou", "Beijing and Shanghai", "Tianjin and Suzhou", "Nanjing and Guangzhou"], "answer": 0, "explain": "京杭大运河: Beijing in the north, Hangzhou in the south."}, {"q": "What is one main function of the Grand Canal?", "options": ["Produce electricity", "Transport goods and people", "Prevent earthquakes", "Provide drinking water only"], "answer": 1, "explain": "It carried grain and goods from the rich south to the capital in the north."}, {"q": "Which province does NOT have the Grand Canal?", "options": ["Zhejiang", "Jiangsu", "Guangdong", "Shandong"], "answer": 2, "explain": "It passes Beijing, Tianjin, Hebei, Shandong, Jiangsu and Zhejiang, not Guangdong.", "past": 18}]}, {"id": "Z", "name": "Zheng He's voyages", "src": "Teacher's bank (5)", "questions": [{"q": "In which dynasty did Zheng He carry out his voyages?", "options": ["Tang Dynasty", "Song Dynasty", "Ming Dynasty", "Qing Dynasty"], "answer": 2, "explain": "Ming, under the Yongle and Xuande emperors (1405–1433)."}, {"q": "How many times did Zheng He sail to the western seas?", "options": ["Five times", "Six times", "Seven times", "Eight times"], "answer": 2, "explain": "Seven voyages (郑和七下西洋)."}, {"q": "Which port did Zheng He mainly depart from?", "options": ["Nanjing", "Suzhou", "Quanzhou", "Shanghai"], "answer": 0, "explain": "Teacher's key: Nanjing, where the fleet was built and assembled. Strictly, it put out to sea from Liujiagang (Taicang, near Suzhou). In the exam, answer Nanjing."}, {"q": "What was the main purpose of Zheng He's voyages?", "options": ["Fight wars", "Trade and cultural communication", "Catch fish", "Find new homes"], "answer": 1, "explain": "Diplomacy, trade and showing Ming power."}, {"q": "Which statement is true about Zheng He's voyages?", "options": ["His ships were very large", "He never left Asia", "The voyages lasted for only one year", "He brought back many wars"], "answer": 0, "explain": "His 'treasure ships' were among the largest wooden ships ever built, and he reached East Africa.", "past": 19}]}]}, "essays": {"rubric": [{"k": "intro", "pts": 15, "label": "Introduces it correctly", "hint": "Name in English and Chinese, date (lunar or solar), origin or legend."}, {"k": "facts", "pts": 20, "label": "Customs and key facts", "hint": "At least 3 customs or facts, each explained in a sentence."}, {"k": "why", "pts": 20, "label": "Answers the 'why' with your own reflection", "hint": "Two clear reasons: values (family, roots, respect) plus your personal view or a comparison with your own culture."}, {"k": "lang", "pts": 5, "label": "Clear structure and English", "hint": "Short paragraphs: introduction, customs, reasons, conclusion."}], "essays": [{"id": "northsouth", "title": "China's north and south", "book": true, "prompt": "In China, some people say they are \"southerners\" and others say they are \"northerners\". What is the basis for the division of China's south, north, northwest and southwest?", "points": ["The main line is the Qinling Mountains–Huai River", "North: colder and drier, wheat, noodles and steamed buns; South: warmer and wetter, rice", "Northwest: far from the sea, dry, deserts and grassland, herding; Southwest: high mountains and plateaus, many ethnic groups", "Division is based on geography and climate, which shape farming, food and customs", "Your example from Zhuhai or Kazakhstan"], "model": "China is divided into north, south, northwest and southwest mainly by geography and climate.\n\nThe most important line is the Qinling Mountains and the Huai River. North of this line, winters are cold and the climate is drier, so people grow wheat and eat noodles and steamed buns. South of it, the weather is warm and wet, so people grow rice.\n\nThe northwest, including Xinjiang, Gansu and Ningxia, is far from the sea. It is very dry, with deserts and grasslands, so herding has long been important. The southwest, including Sichuan, Yunnan and Tibet, has high mountains and plateaus and is home to many ethnic groups.\n\nI think this division matters because land shapes life. Climate decides what people can grow, what they eat, how they build houses and even their customs. Living in Zhuhai, I eat rice and enjoy warm winters, but in northwest China I would feel closer to home in Kazakhstan, with its steppe, lamb and noodles. China's variety shows how one country can hold many ways of life.", "group": "Chapter 1 · Geography"}, {"id": "rivers", "title": "The Yellow River and the Yangtze River", "prompt": "Introduce the Yellow River and the Yangtze River and explain why they are important to China.", "points": ["Both rise on the Qinghai-Tibet Plateau and flow west to east, following the terrain", "Yangtze: about 6,300 km, longest in China and third in the world; Wuhan, Chongqing, Nanjing, Shanghai; into the East China Sea; Three Gorges Dam", "Yellow River: about 5,464 km, second in China; 'Mother River'; yellow silt from the Loess Plateau; a hanging river in its lower reaches; into the Bohai Sea", "Both are cradles of Chinese civilization; the Qinling Mountains divide them", "Importance: farming, transport, water, energy, culture and identity"], "model": "The Yangtze River and the Yellow River are China's two greatest rivers. Both rise on the Qinghai-Tibet Plateau and flow from west to east, because China's land is high in the west and low in the east. The Qinling Mountains divide their basins.\n\nThe Yangtze (长江) is about 6,300 km long, the longest river in China and the third longest in the world, after the Nile and the Amazon. It passes great cities such as Chongqing, Wuhan and Nanjing and enters the East China Sea at Shanghai. The Three Gorges Dam on it is the world's largest hydropower station.\n\nThe Yellow River (黄河) is about 5,464 km long, the second longest in China. It is called the Mother River (母亲河) because early Chinese civilization grew on its banks. Its water is yellow because it carries silt from the Loess Plateau; in its lower reaches the riverbed is higher than the land, so it is a \"hanging river\". It flows into the Bohai Sea.\n\nThese rivers are important because both are cradles of Chinese civilization. They give water for farming, routes for transport and energy for industry. They are also symbols of the Chinese nation: Chinese people often call themselves children of the Yellow River.", "group": "Chapter 1 · Geography"}, {"id": "mother", "title": "Why the Yellow River is the Mother River", "book": true, "prompt": "Why is the Yellow River called the mother river of the Chinese nation? What legends do you know that are related with the Yellow River?", "points": ["About 5,500 km (5,464 km exactly), second longest in China; rises at Bayankala, flows into the Bohai Sea", "Early farming and Chinese civilization grew in its basin (Yangshao culture; early capitals such as Xi'an, Luoyang, Kaifeng)", "Legends: the Yellow Emperor 黄帝; Yu the Great 大禹 tamed the floods by digging channels and passed his home three times without going in", "A mother gives life but can also be hard: fertile silt and terrible floods", "Your reflection: why a river can become a symbol of identity"], "model": "The Yellow River (黄河) is about 5,500 km long (5,464 km exactly), the second longest river in China. It begins at the Bayankala Mountains in Qinghai and flows into the Bohai Sea.\n\nIt is called the mother river because the Chinese nation grew up beside it. Its rich silt made the land good for farming, so early villages such as the Yangshao culture appeared in its basin, and great capitals such as Xi'an, Luoyang and Kaifeng rose nearby. Like a mother, it gave people food and a home.\n\nMany legends come from this river. The Yellow Emperor (黄帝) is honoured as an ancestor of the Chinese people. The most famous story is Yu the Great (大禹). When terrible floods came, Yu dug channels to lead the water away instead of only building walls. He worked for thirteen years and passed his own home three times without going in.\n\nI think the river is a mother for two reasons. First, it gave life and culture. Second, its floods taught people to work together and never give up. In Kazakhstan, the Syr Darya flows near my home, Turkestan, and our people also built their lives around it, so I understand why a river can feel like family.", "group": "Chapter 1 · Geography"}, {"id": "bjsh", "title": "Beijing and Shanghai", "book": true, "prompt": "Take Beijing and Shanghai as examples, and compare the urban cultures between the north and south of China.", "points": ["Beijing: capital of six dynasties (Yan, Liao, Jin, Yuan, Ming, Qing); Forbidden City, hutongs, Peking Opera; political and cultural centre", "Shanghai: grew after opening as a port in the 1840s; the Bund, 'Paris of the Orient'; finance and trade", "Beijing feels traditional and grand; Shanghai feels open, international and commercial (海派 Haipai)", "Both are modern and both are Chinese: tradition and openness complete each other", "Your own view"], "model": "Beijing and Shanghai are China's two most famous cities, and they show two different urban cultures.\n\nBeijing, in the north, was the capital of six dynasties: Yan, Liao, Jin, Yuan, Ming and Qing. Its culture is grand and traditional. The Forbidden City, the old hutong lanes and Peking Opera all show its long history. As the capital, it is China's political and cultural centre.\n\nShanghai, in the south at the mouth of the Yangtze, grew quickly after it opened as a port in the 1840s. It mixed Chinese and Western styles, as the buildings on the Bund show, and was called \"the Paris of the Orient\". Today it is China's centre of finance and trade. Its Haipai (海派) culture is open, international and practical.\n\nSo Beijing represents history and tradition, while Shanghai represents openness and business. I think China needs both. Tradition gives a nation its roots, and openness helps it grow. My first steps in China were in Beijing's huge airport, and even there I felt that old and new can stand side by side.", "group": "Chapter 1 · Geography"}, {"id": "ecology", "title": "Nature and development", "book": true, "prompt": "China's natural environment is beautiful, but there are also contradictions between natural environment and economic development. Please share your views on environmental protection and ecological construction.", "points": ["Beautiful nature: Tibet, Jiuzhaigou, Zhangjiajie, Huangshan", "Problems from fast growth: air and water pollution, soil erosion on the Loess Plateau, desertification", "Solutions: the Three-North Shelterbelt, returning farmland to forest, national parks, renewable energy", "Xi Jinping's phrase: lucid waters and lush mountains are invaluable assets 绿水青山就是金山银山", "Your view: development and protection must go together; the Aral Sea as a warning from Central Asia"], "model": "China has beautiful nature, from the Tibetan Plateau to Jiuzhaigou and Huangshan. However, rapid economic growth has also brought problems such as air and water pollution, soil erosion on the Loess Plateau and the spread of deserts.\n\nChina has taken strong action. The Three-North Shelterbelt, started in 1978, plants huge belts of trees against the deserts. Farmers have returned farmland to forest, national parks protect wild places, and China now leads the world in solar and wind power. The idea behind this is 绿水青山就是金山银山: lucid waters and lush mountains are invaluable assets.\n\nI think development and protection are not enemies. First, a country cannot be rich for long if its land and water are destroyed. Second, a clean environment creates new value through tourism, healthy food and green industry.\n\nAs a Kazakh, I know a sad example. The Aral Sea shrank terribly after its rivers were used too heavily for farming. It shows what happens when people take from nature without limits, so I believe every country should protect nature while it develops.", "group": "Chapter 1 · Geography"}, {"id": "eachplace", "title": "\"Each place supports its own people\"", "book": true, "prompt": "Chinese people often say that \"Each place has its own way of supporting its own inhabitants\", and the farming system has a profound impact on the traditional thinking of the Chinese. What is your idea about this?", "points": ["一方水土养一方人: land and climate shape food, character and customs", "Examples: northern wheat and southern rice; Mongolian herders; Hani rice terraces in Yunnan", "Farming culture values family, staying rooted, working with the seasons (24 solar terms), harmony between people and nature", "Compare with nomadic Kazakh culture: mobility, hospitality", "Your view: different lands create different strengths"], "model": "The Chinese saying 一方水土养一方人 means that each place's land and water raise its own kind of people. I agree with this idea.\n\nGeography decides how people live. In the north people grow wheat and eat noodles; in the south they grow rice. On the grasslands, Mongolian people herd animals. In Yunnan, the Hani people carved mountains into beautiful rice terraces.\n\nFarming also shaped traditional Chinese thinking in three ways. Because farmers must stay on their land, people value home, family and ancestors. Because crops follow the weather, people created the 24 solar terms and learned to respect the seasons. Because they depend on nature, they believe in harmony between humans and nature.\n\nMy own culture shows the same rule from the other side. Kazakhs were traditionally nomads on the steppe, so we value freedom, horses and welcoming guests, because a traveller on the steppe needs help. Farmers and nomads live differently, but both learned wisdom from their land. That is why I think understanding a country begins with understanding its land.", "group": "Chapter 1 · Geography"}, {"id": "civilization", "title": "Chinese civilization: pluralistic and integrated 多元一体", "prompt": "Chinese civilization is said to be \"pluralistic and integrated\". Explain this idea and give examples.", "points": ["Teacher's text (4 Nov): the Yellow River and Yangtze basins are the two core cradles; the Pearl and Liao river basins also had brilliant prehistoric cultures", "Pluralistic 多元: many sources (Yangshao on the Yellow River, Liangzhu and Sanxingdui on the Yangtze, Hongshan on the Liao)", "Integrated 一体: they exchanged and merged into one civilization; unification under the Qin (221 BC), common Chinese characters", "Today: 56 ethnic groups in one nation; the only ancient civilization that continues without a break", "Your view: diversity and unity together make it strong"], "model": "Chinese civilization is pluralistic and integrated (多元一体). This means it has many sources, but they joined together into one civilization.\n\nIt is pluralistic because it did not start in one place. The Yellow River basin and the Yangtze River basin are its two core cradles: the Yangshao culture grew on the Yellow River, while the Liangzhu culture and the mysterious Sanxingdui grew on the Yangtze. The Pearl River and Liao River basins also had brilliant prehistoric cultures, such as the Hongshan culture in the northeast.\n\nIt is integrated because these cultures kept exchanging and merging. Over thousands of years they became one civilization. Qin Shi Huang unified the country in 221 BC with one writing system, one currency and one system of measures. Today China has 56 ethnic groups living together as one nation.\n\nI think this is why Chinese civilization is the only ancient civilization that has continued without a break for about 5,000 years. Diversity gave it richness and new ideas, and unity gave it strength to survive. Kazakhstan is also a country of many peoples, so I find this idea of unity in diversity very inspiring.", "group": "Chapter 2 · History"}, {"id": "yanhuang", "title": "Descendants of Yan and Huang", "book": true, "prompt": "Why do Chinese people say they are \"Descendants of Yan and Huang\"?", "points": ["Yandi and Huangdi were legendary tribal leaders", "Together they defeated Chiyou in the Zhuolu Battle and took the Central Plains", "Their tribes merged with others and formed the Huaxia nationality", "Later dynasties and ethnic minorities also claimed this ancestry, so Zhonghua came to mean all of China", "Your view: a shared origin story creates identity"], "model": "Chinese people call themselves Descendants of Yan and Huang (炎黄子孙) because of two legendary tribal leaders, Yandi and Huangdi, the Yellow Emperor.\n\nIn ancient times, the Yandi tribe was attacked by the Jiuli tribe, led by Chiyou. Yandi asked Huangdi for help, and together they won the Zhuolu Battle in today's Hebei. Later Huangdi became leader of the tribal alliance in the Central Plains, and the two tribes became one.\n\nThey then joined with the Yi, Li and Miao peoples along the Yellow River. After a long time, they formed the Huaxia nationality, the main root of the Chinese people. Later emperors said they descended from Huangdi, and minorities who accepted Central Plains culture used the name too, so Zhonghua came to mean the whole of China.\n\nI think this name matters for two reasons. First, it gives people one shared family, even across different regions. Second, it shows that the nation grew through integration. Every year people still travel to worship at the Huangdi Mausoleum in Shaanxi. Kazakhs also remember our ancestors through our seven generations, shezhire, so I understand this feeling of belonging.", "group": "Chapter 2 · History"}, {"id": "qinshi", "title": "Qin Shi Huang", "prompt": "Introduce Qin Shi Huang and explain why he is important in Chinese history.", "points": ["Unified China in 221 BC and became the first emperor (皇帝)", "Standardized writing, currency, measures and axle widths", "Joined the northern walls into the Great Wall; the Terracotta Army guards his tomb near Xi'an (found 1974)", "Criticism: heavy labour, harsh laws, burning books; the Qin fell soon after his death", "Your balanced view"], "model": "Qin Shi Huang was the first emperor of a unified China. In 221 BC, he defeated the other warring states and created the title 皇帝, emperor.\n\nHe built a strong central government and divided the country into commanderies. He standardized writing, currency, weights and measures, so people across China could trade and communicate. He joined older walls in the north into the Great Wall. His tomb near Xi'an is guarded by the Terracotta Army, which local farmers found in 1974.\n\nHe is important for two reasons. First, he created the idea of one united China, which lasted for more than 2,000 years. Second, one writing system kept people with different dialects connected.\n\nHowever, he was also cruel. His projects cost many lives, his laws were harsh, and he burned books. The Qin Dynasty collapsed soon after his death. I think he teaches us that a strong ruler can build great things, but a state also needs kindness to last.", "group": "Chapter 2 · History"}, {"id": "zhangqian", "title": "Zhang Qian's mission", "book": true, "prompt": "What was the purpose of Emperor Wudi of the Han Dynasty sending Zhang Qian to the Western Regions for the first time?", "points": ["The Huns blocked the way to the Western Regions", "139 BC: Zhang Qian was sent to join Dayuezhi against the Huns", "He was captured for more than ten years, escaped, but Dayuezhi refused", "His report gave valuable knowledge of Central Asia", "Result: second trip in 119 BC with silk; Silk Road formally established by 105 BC"], "model": "Emperor Wudi sent Zhang Qian to the Western Regions for a military and diplomatic purpose: to join Dayuezhi in attacking the Huns.\n\nAt that time, the Huns controlled the Hexi Corridor and many small countries in the west, so the road between the Han Dynasty and the Western Regions was blocked. In 139 BC, Zhang Qian set out, but the Huns caught him. After more than ten years he escaped and found Dayuezhi, but its king refused to unite against the Huns.\n\nSo the first mission failed in its goal, but it succeeded in another way. Zhang Qian returned to Chang'an with valuable information about Central Asia. Han armies then defeated the Huns and opened the road. In 119 BC he went west again, this time carrying silk, and by 105 BC the Silk Road was formally established.\n\nI admire his patience: he never gave up after years as a prisoner. His journey also matters to me because he reached Central Asia, and my hometown, Turkestan, later became a Silk Road city.", "group": "Chapter 2 · History"}, {"id": "silkroad", "title": "The Silk Road", "prompt": "Introduce the Silk Road and explain why it is important for China and the world.", "points": ["Opened in the Han Dynasty after Zhang Qian's missions under Emperor Wu", "From Chang'an (Xi'an) through Central Asia to the Mediterranean", "Goods: silk, tea, porcelain west; horses, grapes, spices east", "Ideas: Buddhism came to China; papermaking travelled west", "Today: Belt and Road; link to Kazakhstan and Turkestan"], "model": "The Silk Road was a network of trade routes linking China with Central Asia, the Middle East and Europe. It opened in the Han Dynasty, after Emperor Wu sent Zhang Qian to the Western Regions in the second century BC. It began at Chang'an, today's Xi'an.\n\nMerchants carried silk, tea and porcelain to the west, and brought horses, grapes and spices to China. Ideas travelled too. Buddhism reached China along this road, and Chinese papermaking spread to the west.\n\nThe Silk Road is important for two reasons. First, it made China part of a wider world and enriched its economy and culture. Second, it shows that different civilizations can grow by exchanging with each other instead of fighting.\n\nThis topic is personal for me. My hometown, Turkestan in Kazakhstan, is an old Silk Road city. The road that once connected my home with China is why I can feel connected to China today. The Silk Road Economic Belt, part of today's Belt and Road, was even announced in Kazakhstan in 2013.", "group": "Chapter 2 · History"}, {"id": "tangworld", "title": "Was the Tang a World Empire?", "book": true, "prompt": "Was the Tang Dynasty a \"World Empire\"?", "points": ["Yes: strong, open and influential (618–907)", "Zhenguan under Taizong and Kaiyuan under Xuanzong", "Chang'an: over 200 countries and regions had contact; 4,000–5,000 foreigners lived there", "Japan sent envoys 15 times, Arabs 36, Eastern Rome 7; foreign students at the Imperial Academy", "Legacy: Tang People and Tang People's Street (Chinatown)"], "model": "I believe the Tang Dynasty (618–907) was a World Empire, because of its strength, its openness and its lasting influence.\n\nFirst, it was strong and prosperous. Under Emperor Taizong came the Rule of Zhenguan, and under Emperor Xuanzong came the Kaiyuan Age of Prosperity. The northern peoples even called Taizong the Heavenly Khan.\n\nSecond, it was open to the world. More than 200 countries and regions had contact with the Tang. Japan sent envoys to Chang'an 15 times, the Arab Empire 36 times and the Eastern Roman Empire 7 times. Merchants from Iran and Central Asia traded spices and jewelry for silk and porcelain, students from Japan and Korea studied at the Imperial Academy, and 4,000 to 5,000 foreigners lived in Chang'an.\n\nThird, its influence continues today. Foreigners still call Chinese people Tang People, and Chinatown is called Tang People's Street in Chinese.\n\nFor me, the Silk Road makes this personal: traders from Central Asia, near my home, walked all the way to Chang'an. The Tang shows that a country becomes greater when it opens its doors.", "group": "Chapter 2 · History"}, {"id": "opiumwar", "title": "The First Opium War", "book": true, "prompt": "Why was the First Opium War the beginning of modern Chinese history?", "points": ["Britain sold opium; it harmed people and drained silver", "1839 Lin Zexu banned it; 1840 Britain attacked", "1842 Treaty of Nanjing: ceded Hong Kong Island, opened 5 ports, paid 21 million silver dollars", "It was the first of many unequal treaties: China began losing sovereignty", "Your reflection: why national independence matters"], "model": "The First Opium War (1840–1842) is the beginning of modern Chinese history because it changed China from an independent empire into a country forced to accept foreign control.\n\nFrom the 1770s, Britain sold opium to China. It harmed people's bodies and minds and caused silver to flow out of the country. In 1839, Emperor Daoguang sent Lin Zexu to Guangzhou, and he destroyed the opium. In June 1840, a British fleet came and the war began. China fought bravely, but its weapons were poor.\n\nThe war ended with the Treaty of Nanjing. China had to give up Hong Kong Island, open Guangzhou, Xiamen, Fuzhou, Ningbo and Shanghai as trading ports, and pay 21 million silver dollars. This was the first of many unequal treaties, so China's sovereignty began to be damaged.\n\nI think this is why Chinese people remember it so strongly. It shows that a country which falls behind can be bullied. It also explains why independence and development matter so much to China today. Kazakhstan gained independence only in 1991, so I understand how much sovereignty means to a nation.", "group": "Chapter 2 · History"}, {"id": "reform", "title": "Reform and opening-up", "book": true, "prompt": "What do you think the impact of the reform and opening-up has had on the development of China?", "points": ["Began in 1978; Deng Xiaoping was the chief designer", "From planned economy to socialist market economy", "Special economic zones: Shenzhen, Zhuhai, Shantou, Xiamen; then coastal and inland cities", "Results: second largest economy, better living standards, high-speed rail, mobile payment, space", "Personal: you study in Zhuhai, one of the first zones"], "model": "China's reform and opening-up began in 1978, with Deng Xiaoping as its chief designer. I think it is the most important change in China's recent development.\n\nFirst, it changed the economy. China moved from a planned economy to a socialist market economy, starting in the countryside and then in the cities. Second, it opened China to the world. Guangdong and Fujian opened first, and special economic zones were set up in Shenzhen, Zhuhai, Shantou and Xiamen. Then coastal cities, the Yangtze River and inland cities followed. The policy of One Country, Two Systems also solved the return of Hong Kong and Macao.\n\nThe results are huge. China became the world's second largest economy, and people's living standards rose. Today China has high-speed rail, mobile payment and its own spacecraft.\n\nI can see this impact with my own eyes. I study in Zhuhai, one of the first four special economic zones, and I often visit Shenzhen, which grew into a modern city with amazing speed. My shuttle bus leaving exactly on time is a small example of how far this country has come.", "group": "Chapter 2 · History"}, {"id": "spring", "title": "Spring Festival 春节", "prompt": "Introduce the Spring Festival and explain why it is the most important festival for Chinese people.", "points": ["Chinese New Year, 1st day of the 1st lunar month (6 February 2027); celebrations end with the Lantern Festival on the 15th day", "Legend of the monster Nian, scared away by red colour and firecrackers", "Customs: cleaning the house, spring couplets 春联 and an upside-down 福, the reunion dinner on New Year's Eve, dumplings, red envelopes 红包, the CCTV Gala, visiting relatives", "春运: the largest human migration on Earth, as people travel home", "Why most important: reunion 团圆, hope for a new year, family and roots"], "model": "The Spring Festival (春节), or Chinese New Year, is the most important festival in China. It begins on the first day of the first lunar month (in 2027, 6 February) and the celebration lasts until the Lantern Festival on the fifteenth day.\n\nAccording to legend, a monster called Nian came every new year, but it was afraid of the colour red and loud noise. That is why people hang red spring couplets (春联) and an upside-down 福 character, and set off firecrackers. Before the festival, families clean the house to sweep away bad luck. On New Year's Eve the whole family eats a reunion dinner; in the north people make dumplings, which look like old silver ingots and bring wealth. Elders give children red envelopes (红包), and many families watch the CCTV Spring Festival Gala together.\n\nI think the Spring Festival is the most important festival because of one word: reunion (团圆). Hundreds of millions of people travel home during 春运, the largest yearly migration on Earth, just to sit at one table with their family. It also gives everyone hope: the old year with its problems is gone and a new start begins.\n\nThis is like our Nauryz in Kazakhstan: we clean the house, wear new clothes, visit elders and share a big table. Both festivals show that family is the centre of life.", "group": "Festivals"}, {"id": "qingming", "title": "Qingming Festival 清明节", "past": true, "prompt": "Introduce the Qingming Festival and why do you think the Qingming Festival is considered to be one of the greatest festivals for Chinese people?", "points": ["Tomb-Sweeping Day; both a solar term (one of the 24) and a festival; 4, 5 or 6 April", "Customs: sweeping tombs and honouring ancestors (offer food and flowers, burn incense); spring outing 踏青, flying kites, planting willows", "Origin: the Cold Food Festival 寒食节 and the legend of Jie Zitui", "Why great: filial piety 孝 and remembering ancestors; it joins sorrow and joy, death and the new life of spring", "Teacher's full-mark idea: it answers 'Who am I? Where do I come from? Where am I going?'"], "model": "The Qingming Festival (清明节), also called Tomb-Sweeping Day, is both one of the 24 solar terms and one of China's most important traditional festivals. It falls on 4, 5 or 6 April each year, when spring is clear and bright, which is the meaning of \"qingming\".\n\nPeople do two main things. First, they sweep the tombs of their ancestors: they clean the graves, offer food and flowers, burn incense and remember family members who have died. Second, they enjoy the spring: they go for a spring outing (踏青), fly kites and plant willows. The festival grew out of the older Cold Food Festival and the story of the loyal Jie Zitui.\n\nI think Qingming is one of the greatest Chinese festivals for two reasons. First, it carries core Chinese values: filial piety, respect for ancestors and strong family ties. It answers three big questions. Who am I? A member of a family and a culture. Where do I come from? From my ancestors and my homeland. Where am I going? To live a meaningful life and pass on the family tradition. Second, it joins sadness and joy: people miss those they lost, but they also celebrate the new life of spring. It teaches people to cherish life.\n\nIn Kazakhstan we also visit our ancestors' graves and say a prayer for them, so I understand why Qingming touches Chinese people so deeply.", "group": "Festivals"}, {"id": "dragonboat", "title": "Dragon Boat Festival 端午节", "prompt": "Introduce the Dragon Boat Festival and explain why it is still important today.", "points": ["5th day of the 5th lunar month; UNESCO intangible cultural heritage (2009)", "Remembers the patriotic poet Qu Yuan 屈原, who drowned himself in the Miluo River", "Customs: dragon boat races, zongzi 粽子 (rice in bamboo leaves), sachets 香囊, hanging mugwort, realgar wine", "Values: patriotism, loyalty, teamwork, staying healthy as summer begins"], "model": "The Dragon Boat Festival (端午节) is on the fifth day of the fifth lunar month. In 2009 UNESCO listed it as intangible cultural heritage of humanity.\n\nIt remembers Qu Yuan (屈原), a loyal poet and minister of the state of Chu. When his country was destroyed, he drowned himself in the Miluo River. People rowed boats to search for him and threw rice into the water so the fish would not eat his body. That is the origin of the two main customs: dragon boat races and eating zongzi (粽子), sticky rice wrapped in bamboo leaves. People also hang mugwort at the door and give children scented sachets (香囊) to keep away disease in the hot season.\n\nI think it is still important for two reasons. First, it teaches patriotism and loyalty through Qu Yuan's story. Second, the dragon boat race is about teamwork: twenty rowers must move as one to win. The festival also reminds people to look after their health as summer begins.\n\nFor me, the festival shows how a story from more than 2,000 years ago can still bring a whole country together on the same day.", "group": "Festivals"}, {"id": "midautumn", "title": "Mid-Autumn Festival 中秋节", "prompt": "Introduce the Mid-Autumn Festival and explain its meaning for Chinese people.", "points": ["15th day of the 8th lunar month (25 September 2026), when the moon is fullest", "Legend of Chang'e 嫦娥 flying to the moon, with the Jade Rabbit", "Customs: admiring the moon, mooncakes 月饼, family dinner, lanterns, and in the south, osmanthus wine", "A round moon and a round mooncake both mean reunion 团圆", "Su Shi: 但愿人长久，千里共婵娟 ('we share the same moon though a thousand miles apart')"], "model": "The Mid-Autumn Festival (中秋节) falls on the fifteenth day of the eighth lunar month, when the moon is the roundest and brightest of the year. In 2026 it was on 25 September. It is the second most important festival in China after the Spring Festival.\n\nThe most famous legend is about Chang'e (嫦娥), who drank an elixir and flew to the moon, where she lives with the Jade Rabbit. On this night families eat dinner together, admire the full moon and share mooncakes (月饼). A round moon and a round mooncake are symbols of reunion (团圆). Children carry lanterns, and in the south people drink osmanthus wine.\n\nI think the festival is so meaningful because it is about family and missing home. The poet Su Shi wrote 但愿人长久，千里共婵娟: \"I hope we live long and share the beautiful moon though we are a thousand miles apart.\" Even when people cannot go home, they look at the same moon as their family.\n\nThis was my first Chinese festival, two weeks after I arrived in Zhuhai. I was almost 4,800 km from my family, and that night I understood the poem: the moon over Zhuhai was the same moon my family saw in Turkestan.", "group": "Festivals"}, {"id": "doubleninth", "title": "Double Ninth Festival 重阳节", "prompt": "Introduce the Double Ninth Festival and explain why it is meaningful for Chinese people today.", "points": ["9th day of the 9th lunar month (18 October 2026); nine is a yang number, so 'double yang' 重阳", "Legend of Huan Jing, who escaped disaster by climbing a mountain with dogwood 茱萸 and chrysanthemum wine", "Customs: climbing heights 登高, enjoying chrysanthemums, chrysanthemum wine, Chongyang cake 重阳糕, wearing dogwood", "九九 sounds like 久久 (long-lasting), so it wishes long life; since 2012 by law it is also Seniors' Day 老年节", "Wang Wei: 独在异乡为异客，每逢佳节倍思亲"], "model": "The Double Ninth Festival (重阳节) is on the ninth day of the ninth lunar month; in 2026 it was 18 October. In Chinese thought nine is a yang number, so the day with two nines is called \"double yang\".\n\nAn old legend says a man called Huan Jing was warned of a disaster. He led his family up a mountain, wearing dogwood (茱萸) and drinking chrysanthemum wine, and they were saved. So people climb mountains or high places (登高), enjoy chrysanthemums, drink chrysanthemum wine and eat Chongyang cake; 糕 (cake) sounds like 高 (high).\n\nToday the festival is meaningful because it is about respect for old people. 九九 sounds like 久久, \"long-lasting\", so it is a wish for a long life. Since 2012 the law has made it China's Seniors' Day (老年节). Families visit grandparents and many seniors go hiking together. It shows the Chinese value of filial piety (孝).\n\nThe poet Wang Wei wrote on this day 独在异乡为异客，每逢佳节倍思亲: \"Alone in a strange land, on every festival I miss my family twice as much.\" As an international student far from Kazakhstan, I feel this poem. Respect for elders is also at the heart of my own culture, so this festival feels close to me.", "group": "Festivals"}]}, "book": [{"chapter": "Geography", "pages": "1-31", "questions": [{"q": "What is the northernmost point of China?", "options": ["The Pamir Plateau", "The meeting point of the Heilongjiang and Wusuli Rivers", "The central line of the main channel of the Heilongjiang River", "The Daxing'anling Mountains"], "answer": 2, "explain": "The book says the northernmost part of China is the central line in the main channel of the Heilongjiang River (the Heilongjiang-Wusuli meeting point is the easternmost).", "page": 2}, {"q": "In land area, China is second only to which two countries?", "options": ["The USA and Brazil", "Russia and Canada", "Russia and the USA", "Canada and Australia"], "answer": 1, "explain": "The book says China's land area of about 9.6 million square km is second only to Russia and Canada, making it the third largest country in the world.", "page": 2}, {"q": "How long is China's coastline?", "options": ["About 22,800 km", "About 5,500 km", "About 9,600 km", "About 18,000 km"], "answer": 3, "explain": "The book gives a total coastline of about 18,000 km (22,800 km is the length of the land border).", "page": 3}, {"q": "Which list shows China's seas in order from north to south?", "options": ["Yellow Sea, Bohai Sea, South China Sea, East China Sea", "Bohai Sea, Yellow Sea, East China Sea, South China Sea", "East China Sea, Bohai Sea, Yellow Sea, South China Sea", "Bohai Sea, East China Sea, Yellow Sea, South China Sea"], "answer": 1, "explain": "The book lists China's seas from north to south as the Bohai Sea, the Yellow Sea, the East China Sea and the South China Sea.", "page": 3}, {"q": "Which of the following is NOT one of China's 4 municipalities?", "options": ["Chongqing", "Tianjin", "Shanghai", "Guangzhou"], "answer": 3, "explain": "The book's table lists the 4 municipalities as Beijing, Shanghai, Tianjin and Chongqing; Guangzhou is the capital of Guangdong Province.", "page": 4}, {"q": "Which province has the short name \"Lu\"?", "options": ["Shandong", "Hubei", "Anhui", "Liaoning"], "answer": 0, "explain": "The book's table gives Shandong the short name Lu (Hubei is E, Anhui is Wan, Liaoning is Liao).", "page": 4}, {"q": "According to the book, about what share of the world's population is Chinese?", "options": ["About 22% (one in five people)", "About 10% (one in ten people)", "About 33% (one in three people)", "About 50% (one in two people)"], "answer": 0, "explain": "The book says China has more than 1.37 billion people, 22% of the world, so one in five people is Chinese; today it is about 1.41 billion (about 17%), and India passed China in 2023.", "page": 5}, {"q": "The Han people make up about what percent of China's population?", "options": ["55%", "91.5%", "98%", "75%"], "answer": 1, "explain": "The book says the Han have the largest population, about 91.5% of China's total (the 2020 census gives 91.11%); 98% is the Han share in Taiwan.", "page": 6}, {"q": "Which ethnic group is called the \"Prairie Nation\" and holds the Nadamu fair?", "options": ["The Uyghur people", "The Miao people", "The Tibetan people", "The Mongolian people"], "answer": 3, "explain": "The book says the Mongolian people are known as the \"Prairie Nation\" and hold the yearly Nadamu fair.", "page": 6}, {"q": "According to the book, which is the third largest of China's four great plateaus?", "options": ["The Qinghai-Tibet Plateau", "The Inner Mongolia Plateau", "The Loess Plateau", "The Yunnan-Guizhou Plateau"], "answer": 2, "explain": "The book says the Loess Plateau is the third largest of the four plateaus and is covered with 50-80 meters of loess.", "page": 8}, {"q": "Which of these is NOT one of China's four major basins?", "options": ["The Junggar Basin", "The Turpan Basin", "The Qaidam Basin", "The Sichuan Basin"], "answer": 1, "explain": "The book lists the four major basins as the Tarim, Junggar, Qaidam and Sichuan Basins.", "page": 9}, {"q": "Which basin is called a \"land of abundance\"?", "options": ["The Tarim Basin", "The Qaidam Basin", "The Junggar Basin", "The Sichuan Basin"], "answer": 3, "explain": "The book says the Sichuan Basin has plains and hills, many kinds of plants and a developed economy, and is a rich \"land of abundance\".", "page": 9}, {"q": "Which of these is NOT one of China's three major plains?", "options": ["The North China Plain", "The Pearl River Delta", "The Northeast Plain", "The Middle and Lower Yangtze River Plain"], "answer": 1, "explain": "The book names the Northeast Plain, the North China Plain and the Middle and Lower Yangtze River Plain as the three major plains; the Pearl River Delta is listed as an extra one.", "page": 9}, {"q": "What is the largest desert in China?", "options": ["The Taklamakan Desert", "The Gobi Desert", "The Badain Jaran Desert", "The Tengger Desert"], "answer": 0, "explain": "The book says the Tarim Basin in Xinjiang holds the largest desert in China, the Taklamakan Desert.", "page": 23}, {"q": "According to the book, how high is Qomolangma (Mount Everest)?", "options": ["3,767 meters", "6,000 meters", "8,844.43 meters", "9,120 meters"], "answer": 2, "explain": "The book gives 8,844.43 meters (the 2005 survey); the 2020 China-Nepal survey gives 8,848.86 meters.", "page": 10}, {"q": "Which of the following about the Himalayas is true?", "options": ["They are one of the oldest mountains in the world", "They are on the border between China and Mongolia", "The north slope gets more rain than the south slope", "They are still rising because they are young mountains"], "answer": 3, "explain": "The book says the Himalayas are one of the youngest mountains in the world and are still rising; the south slope is the rainy, green side.", "page": 10}, {"q": "What is the main peak of the Qinling Ridge?", "options": ["Mount Taibai", "Mount Tai", "Mount Song", "Mount Lu"], "answer": 0, "explain": "The book says Mount Taibai (3,767 m) is the main peak of the Qinling Ridge and the highest peak east of the Qinghai-Tibet Plateau.", "page": 11}, {"q": "Which river belongs to the Arctic Ocean water system?", "options": ["The Nujiang River", "The Pearl River", "The Ertiz River", "The Yarlung Zangbo River"], "answer": 2, "explain": "The book divides China's rivers into Pacific, Indian Ocean and Arctic Ocean systems, and gives the Ertiz River as the Arctic example.", "page": 12}, {"q": "Where does the Yangtze River begin?", "options": ["The Bayankala Mountain", "The Tanggula Mountains on the Qinghai-Tibet Plateau", "The Tianshan Mountains", "The Qinling Ridge"], "answer": 1, "explain": "The book says the Yangtze originates from the Tanggula Mountains on the Qinghai-Tibet Plateau (the Yellow River starts at Bayankala).", "page": 12}, {"q": "Beijing was the capital of six dynasties. Which of these was NOT one of them?", "options": ["Yuan", "Liao", "Tang", "Ming"], "answer": 2, "explain": "The book lists Beijing's six dynasties as Yan, Liao, Jin, Yuan, Ming and Qing.", "page": 17}, {"q": "Which is the largest of the three grand halls of the Forbidden City?", "options": ["The Hall of Central Harmony (Zhonghe)", "The Hall of Preserving Harmony (Baohe)", "The Hall of Heavenly Purity", "The Hall of Supreme Harmony (Taihe)"], "answer": 3, "explain": "The book says the Taihe (Supreme Harmony) Hall is the largest of the three grand halls and the Zhonghe Hall is the smallest.", "page": 17}, {"q": "Which city is called \"the Paris of the Orient\"?", "options": ["Hong Kong", "Shanghai", "Beijing", "Guangzhou"], "answer": 1, "explain": "The book says Shanghai has the title of \"the Paris of the Orient\" (Hong Kong is \"the Pearl of the Orient\").", "page": 17}, {"q": "When did Hong Kong return to China?", "options": ["July 1, 1997", "October 1, 1949", "December 20, 1999", "July 1, 1982"], "answer": 0, "explain": "The book says China set up the Hong Kong Special Administrative Region on July 1, 1997; talks with Britain began in 1982.", "page": 20}, {"q": "Which mountains divide Xinjiang into southern and northern parts?", "options": ["The Kunlun Mountains", "The Aertai (Altai) Mountains", "The Tianshan Mountains", "The Qilian Mountains"], "answer": 2, "explain": "The book says Xinjiang is \"three mountains squeezing two basins\" and the Tianshan in the middle divides southern and northern Xinjiang.", "page": 23}, {"q": "Which city is called the \"City of Sunlight\"?", "options": ["Lhasa", "Shigatse", "Urumqi", "Xining"], "answer": 0, "explain": "The book says Lhasa, more than 3,500 meters above sea level, is called the \"City of Sunlight\".", "page": 26}, {"q": "What does the name \"Jiuzhaigou\" mean?", "options": ["Valley of nine villages", "Valley of nine lakes", "Valley of nine waterfalls", "Valley of nine dragons"], "answer": 0, "explain": "The book says the Jiuzhaigou valley in northern Sichuan has nine Tibetan villages, hence its name.", "page": 26}, {"q": "Which is the first National Forest Park in China?", "options": ["Jiuzhaigou", "The Yili Valley", "Zhangjiajie", "Shennongjia"], "answer": 2, "explain": "The book says Zhangjiajie in northwest Hunan is the first National Forest Park in China.", "page": 27}, {"q": "The Ming Dynasty Great Wall runs from where in the east to where in the west?", "options": ["From Shanhaiguan to Yumenguan", "From Beijing to Xi'an", "From the Bohai Sea to Lhasa", "From the Yalu River to Jiayuguan Pass"], "answer": 3, "explain": "The book says the Ming Great Wall, about 6,300 km long, runs from the Yalu River in the east to Jiayuguan Pass in the west.", "page": 28}, {"q": "When did local peasants find the Terracotta Army?", "options": ["1949", "1974", "1987", "2004"], "answer": 1, "explain": "The book says peasants found the clay warriors in 1974 while drilling wells (1987 is when it became World Heritage).", "page": 29}, {"q": "Where are the Hani Terraces?", "options": ["Yunnan", "Guangxi", "Sichuan", "Hunan"], "answer": 0, "explain": "The book names the Hani Terraces in Yunnan and the Longji Terraces in Guangxi as China's two representative terraced fields.", "page": 30}], "facts": [{"fact": "China is in Eastern Asia on the west coast of the Pacific; land area about 9.6 million sq km, 3rd largest country in the world and largest in Asia.", "page": 2}, {"fact": "North-south distance about 5,500 km; east-west about 5,200 km, spanning 5 time zones.", "page": 2}, {"fact": "Easternmost point: where the main channels of the Heilongjiang and Wusuli Rivers meet; westernmost point: near the Pamir Plateau.", "page": 2}, {"fact": "Land border about 22,800 km; coastline about 18,000 km.", "page": 3}, {"fact": "Seas from north to south: Bohai, Yellow, East China, South China. More than 7,600 islands; Taiwan is the largest.", "page": 3}, {"fact": "Divisions: 23 provinces, 4 municipalities (Beijing, Shanghai, Tianjin, Chongqing), 5 autonomous regions, 2 SARs. Short names: Beijing = Jing, Jiangsu = Su.", "page": 4}, {"fact": "Autonomous region capitals: Guangxi - Nanning, Inner Mongolia - Huhhot, Ningxia - Yinchuan, Tibet - Lhasa, Xinjiang - Urumqi.", "page": 5}, {"fact": "Population (book, 'as of 2010'): over 1.37 billion = 22% of the world; urban 49.68%, rural 50.32% in 2010. (Now about 1.41 billion; India is more populous since 2023.)", "page": 5}, {"fact": "56 ethnic groups; Han 91.5%; 55 minorities live mainly in the northwest, southwest and northeast.", "page": 6}, {"fact": "Miao embroidery (Guizhou) became National Intangible Cultural Heritage in 2006; 'Nadamu' means 'entertainment/game' in Mongolian.", "page": 6}, {"fact": "Plains are only 18.75% of land area (book figure); mountains, plateaus and hills are more than two-thirds.", "page": 7}, {"fact": "Four great plateaus (Qinghai-Tibet, Inner Mongolia, Loess, Yunnan-Guizhou) = 33.3% of land (book figure); Qinghai-Tibet is largest, average over 4,000 m.", "page": 8}, {"fact": "Four major basins: Tarim, Junggar, Qaidam, Sichuan. Tarim is the largest inland basin and rich in oil and natural gas.", "page": 9}, {"fact": "Himalayas: more than 2,400 km long, average over 6,000 m; Qomolangma ('Mother Earth' in Tibetan) is 8,844.43 m in the book (8,848.86 m since 2020), on the China-Nepal border.", "page": 10}, {"fact": "Yarlung Zangbo Grand Canyon is the world's largest and deepest canyon.", "page": 11}, {"fact": "Qinling Ridge: more than 1,500 km long, from Gansu through Shaanxi to Henan; main peak Mount Taibai, 3,767 m, the 'back garden' of Xi'an.", "page": 11}, {"fact": "Three water systems: Pacific (Yangtze, Yellow, Pearl), Indian Ocean (Nujiang, Yarlung Zangbo), Arctic (Ertiz). China's hydropower resources rank first in the world.", "page": 12}, {"fact": "Yangtze: starts at the Tanggula Mountains; basin 1.8 million sq km (about 20% of China); more than 6,300 km; lower reaches = 'golden waterway'.", "page": 13}, {"fact": "Three Gorges run from west of Chongqing to east of Yichang (Hubei).", "page": 13}, {"fact": "Yellow River: starts at Bayankala Mountain (Qinghai), flows through 9 provinces/regions, 5,500 km in the book (usually 5,464 km).", "page": 13}, {"fact": "Beijing was capital of six dynasties: Yan, Liao, Jin, Yuan, Ming, Qing. Forbidden City: about 720,000 sq m, more than 70 palaces, more than 9,000 houses.", "page": 16}, {"fact": "Hong Kong: 'Pearl of the Orient', returned July 1, 1997; Victoria Harbour is one of the world's three natural harbours (with San Francisco Bay and Rio de Janeiro).", "page": 19}, {"fact": "Xinjiang: 1.66 million sq km, almost 1/6 of China; 'three mountains squeezing two basins' (Aertai, Tianshan, Kunlun; Junggar, Tarim).", "page": 23}, {"fact": "Great Wall: total length 21,196.18 km across 15 provinces (announced June 5, 2012); Ming section about 6,300 km; World Heritage 1987.", "page": 29}, {"fact": "Terracotta Army (Lintong, Xi'an): found 1974; more than 8,000 figures, 50+ chariots, 400,000+ weapons; World Heritage 1987.", "page": 29}], "printed_pages": true}], "learn": {"tips": ["Wrong answers love the words <b>only, all, never<\/b>. Not one correct answer in the teacher's banks uses them.", "On a <b>NOT<\/b> question, find the one that doesn't belong. Read the question twice.", "Spend about <b>10 minutes<\/b> on the 20 questions and <b>20 minutes<\/b> on the essay. The essay is worth 60 of the 100 points."], "lessons": [{"id": "c1-location", "chapter": "Chapter 1 · Geography", "title": "Location and size", "cn": "地理位置", "facts": [{"fact": "China is in Eastern Asia on the west coast of the Pacific; land area about 9.6 million sq km, 3rd largest country in the world and largest in Asia.", "page": 2}, {"fact": "North-south distance about 5,500 km; east-west about 5,200 km, spanning 5 time zones.", "page": 2}, {"fact": "Easternmost point: where the main channels of the Heilongjiang and Wusuli Rivers meet; westernmost point: near the Pamir Plateau.", "page": 2}, {"fact": "Land border about 22,800 km; coastline about 18,000 km.", "page": 3}, {"fact": "Seas from north to south: Bohai, Yellow, East China, South China. More than 7,600 islands; Taiwan is the largest.", "page": 3}], "cards": [{"cue": "China's four corners?", "answer": "N: middle of the Heilongjiang River, just north of Mohe · S: Zengmu Ansha · W: Pamir · E: Heilongjiang + Wusuli meet", "hook": "The Heilongjiang is the border with Russia, and the line runs down the middle of its main channel. Mohe = MOre cold, the town beside it. Z is the last letter, so Zengmu is the very bottom. Pamir is on your side, toward Central Asia.", "qs": ["G2", "P-G-11", "P-G-12", "P-G-13", "B-Geography-1"]}, {"cue": "How big is China?", "answer": "9.6 million km² · 3rd largest, after Russia and Canada · 5 time zones · land border 22,800 km", "hook": "9.6 sounds like a nearly perfect exam score: 9.6 out of 10.", "qs": ["P-G-14", "P-G-15", "P-G-16", "B-Geography-2"]}, {"cue": "Coast and seas, north to south?", "answer": "Coast 18,000 km · Bohai, Yellow, East China, South China · largest island Taiwan", "hook": "Big Yaks Eat Salad.", "qs": ["B-Geography-3", "B-Geography-4", "P-G-17"]}, {"cue": "How many land neighbours?", "answer": "14, including Kazakhstan · Japan is not one", "hook": "Valentine's Day is the 14th: 14 neighbours to love. Japan is across the sea, so it can't share a land border.", "qs": ["G10", "P-G-26"]}]}, {"id": "c1-divisions", "chapter": "Chapter 1 · Geography", "title": "Administrative divisions", "cn": "行政区划", "facts": [{"fact": "Divisions: 23 provinces, 4 municipalities (Beijing, Shanghai, Tianjin, Chongqing), 5 autonomous regions, 2 SARs. Short names: Beijing = Jing, Jiangsu = Su.", "page": 4}, {"fact": "Autonomous region capitals: Guangxi - Nanning, Inner Mongolia - Huhhot, Ningxia - Yinchuan, Tibet - Lhasa, Xinjiang - Urumqi.", "page": 5}], "cards": [{"cue": "How is China divided?", "answer": "23 provinces + 5 autonomous regions + 4 municipalities + 2 SARs = 34", "hook": "Michael Jordan's 23, then count down: 5, 4, 2. The SARs are Hong Kong and Macao.", "qs": ["P-G-18", "P-G-19", "P-G-20", "P-G-21", "P-G-22", "G4"]}, {"cue": "The 4 municipalities? Short name Lu?", "answer": "Beijing, Shanghai, Tianjin, Chongqing · Lu = Shandong", "hook": "B-S-T-C: BeST City. Guangzhou is not one. Lu was Confucius's home state, in Shandong.", "qs": ["B-Geography-5", "B-Geography-6"]}, {"cue": "Autonomous regions on the border?", "answer": "South: Guangxi · North: Inner Mongolia", "hook": "Guangxi is next door to your Guangdong, so it has to be south.", "qs": ["G14", "P-G-23"]}, {"cue": "Capitals of the 5 autonomous regions?", "answer": "Guangxi Nanning · Inner Mongolia Hohhot · Ningxia Yinchuan · Tibet Lhasa · Xinjiang Urumqi", "hook": "Lhasa is the sunlight city. Urumqi is the big city on the Kazakhstan side of China.", "qs": ["P-G-24", "P-G-25"]}]}, {"id": "c1-people", "chapter": "Chapter 1 · Geography", "title": "Population and ethnic groups", "cn": "人口与民族", "facts": [{"fact": "Population (book, 'as of 2010'): over 1.37 billion = 22% of the world; urban 49.68%, rural 50.32% in 2010. (Now about 1.41 billion; India is more populous since 2023.)", "page": 5}, {"fact": "56 ethnic groups; Han 91.5%; 55 minorities live mainly in the northwest, southwest and northeast.", "page": 6}, {"fact": "Miao embroidery (Guizhou) became National Intangible Cultural Heritage in 2006; 'Nadamu' means 'entertainment/game' in Mongolian.", "page": 6}], "cards": [{"cue": "People and ethnic groups?", "answer": "56 ethnic groups · Han is the largest, 91.5% in the book · Mongolians = Prairie Nation, hold the Nadamu fair · China = 22% of the world in the book", "hook": "The book's numbers are old (today about 17% and 91.1%), but use the book's if the question says \"according to the book\".", "qs": ["B-Geography-7", "B-Geography-8", "B-Geography-9", "P-G-27", "P-G-28"]}]}, {"id": "c1-terrain", "chapter": "Chapter 1 · Geography", "title": "Terrain: the three steps", "cn": "地形地貌", "facts": [{"fact": "Plains are only 18.75% of land area (book figure); mountains, plateaus and hills are more than two-thirds.", "page": 7}, {"fact": "Four great plateaus (Qinghai-Tibet, Inner Mongolia, Loess, Yunnan-Guizhou) = 33.3% of land (book figure); Qinghai-Tibet is largest, average over 4,000 m.", "page": 8}, {"fact": "Four major basins: Tarim, Junggar, Qaidam, Sichuan. Tarim is the largest inland basin and rich in oil and natural gas.", "page": 9}, {"fact": "Xinjiang: 1.66 million sq km, almost 1/6 of China; 'three mountains squeezing two basins' (Aertai, Tianshan, Kunlun; Junggar, Tarim).", "page": 23}], "cards": [{"cue": "China's shape?", "answer": "High in the west, low in the east: 3 steps", "hook": "Picture a giant staircase from Tibet down to the sea. Water runs down it, so the big rivers flow west to east.", "qs": ["G1"]}, {"cue": "Which line divides step 1 and step 2?", "answer": "Kunlun – Qilian – Hengduan", "hook": "K-Q-H: Kings Queue Here, at the top of the stairs. Taihang and Greater Khingan belong to the lower line.", "qs": ["G3"]}, {"cue": "Which line divides step 2 and step 3?", "answer": "Greater Khingan – Taihang – Wushan – Xuefeng", "hook": "G-T-W-X: Go To Water's eXit, the last step before the sea.", "qs": ["P-G-1", "P-G-2"]}, {"cue": "What sits on each step?", "answer": "Step 1: Qinghai-Tibet Plateau (over 4,000 m) · Step 2: Sichuan Basin, Loess and Inner Mongolia plateaus · Step 3: the big eastern plains", "hook": "Top = roof of China. Middle = plateaus and bowls. Bottom = flat land and big cities.", "qs": ["P-G-3", "P-G-4", "P-G-5", "P-G-6"]}, {"cue": "How much of China is mountains, hills and plateaus?", "answer": "2/3", "hook": "Cut China into 3 slices: 2 are bumpy, 1 is flat.", "qs": ["G15"]}, {"cue": "The four great plateaus?", "answer": "Qinghai-Tibet, Inner Mongolia, Loess, Yunnan-Guizhou", "hook": "Biggest first: Tibet is the giant. Remember Q-I-L-Y: Quite Impressive Land, Yes. Loess is third.", "qs": ["P-G-7", "P-G-8", "B-Geography-10"]}, {"cue": "Four major basins?", "answer": "Tarim, Junggar, Qaidam, Sichuan", "hook": "Trap: Turpan is the lowest, but not one of the big four. Sichuan = land of abundance.", "qs": ["B-Geography-11", "B-Geography-12", "P-G-10"]}, {"cue": "Lowest basin (−154 m)?", "answer": "Turpan Basin", "hook": "Tur-PAN: a frying pan, deep and low.", "qs": ["G8"]}, {"cue": "Three major plains?", "answer": "Northeast (largest) · North China (Beijing) · Middle-Lower Yangtze", "hook": "NE = Number-one Expanse. The Pearl River Delta is not one of the three.", "qs": ["G9", "P-G-9", "B-Geography-13"]}, {"cue": "Xinjiang's shape?", "answer": "3 mountains squeeze 2 basins: Altai, Junggar, Tianshan, Tarim, Kunlun · Tianshan splits Xinjiang: Junggar is north of it, Tarim is south · the Turpan Basin is also in Xinjiang", "hook": "Read it north to south like a sandwich: mountain, basin, mountain, basin, mountain. Tianshan is the middle.", "qs": ["P-G-37", "P-G-38", "B-Geography-24"]}]}, {"id": "c1-mountains", "chapter": "Chapter 1 · Geography", "title": "Great mountains", "cn": "山脉", "facts": [{"fact": "Himalayas: more than 2,400 km long, average over 6,000 m; Qomolangma ('Mother Earth' in Tibetan) is 8,844.43 m in the book (8,848.86 m since 2020), on the China-Nepal border.", "page": 10}, {"fact": "Yarlung Zangbo Grand Canyon is the world's largest and deepest canyon.", "page": 11}, {"fact": "Qinling Ridge: more than 1,500 km long, from Gansu through Shaanxi to Henan; main peak Mount Taibai, 3,767 m, the 'back garden' of Xi'an.", "page": 11}], "cards": [{"cue": "Highest peak, deepest canyon, biggest desert?", "answer": "Qomolangma, in the Himalayas: 8,844.43 m in the book (8,848.86 m since 2020) · Yarlung Zangbo Canyon · Taklamakan Desert, in the Tarim Basin", "hook": "The Himalayas are young and still rising. The Yarlung Zangbo cuts the deepest canyon below them.", "qs": ["P-G-34", "P-G-35", "P-G-36", "B-Geography-14", "B-Geography-15", "B-Geography-16"]}, {"cue": "Qinling Mountains?", "answer": "Yangtze–Yellow watershed · with the Huai River, the north–south line · main peak Taibai", "hook": "Qin-LING = Qin-LINE. North eats wheat, south eats rice.", "qs": ["G12", "P-G-32", "P-G-33", "B-Geography-17"]}]}, {"id": "c1-sacred", "chapter": "Chapter 1 · Geography", "title": "Five Mountains, Three Famous", "cn": "五岳三山", "facts": [], "cards": [{"cue": "The Five Mountains 五岳?", "answer": "Tai (east), Hua (west), Heng 衡 (south), Heng 恒 (north), Song (centre)", "hook": "五岳: one for each compass point, plus one in the middle. The book calls them the Five Famous Mountains.", "qs": ["M1"]}, {"cue": "Eastern mountain?", "answer": "Mount Tai, in Shandong, 1,545 m", "hook": "Tai chi at sunrise: the sun rises in the east. Emperors worshipped heaven here.", "qs": ["M2", "M10", "P-M-6"]}, {"cue": "Western, highest, most dangerous?", "answer": "Mount Hua, in Shaanxi, 2,154.9 m", "hook": "H-U-A: Highest, Unsafe, At the west. Book p.22 wrongly says it isn't the highest.", "qs": ["M3", "M4", "M9", "P-M-4"]}, {"cue": "Mount Song: where, and which temple?", "answer": "Centre · Henan · 1,491.7 m · Shaolin Temple", "hook": "Song and Shaolin both start with S. Picture the monks singing a song in the centre of China.", "qs": ["M5", "M6", "P-M-5"]}, {"cue": "South and north sacred mountains?", "answer": "South: Heng 衡, Hunan, 1,300.2 m (lowest) · North: Heng 恒, Shanxi, 2,016.1 m", "hook": "Two Hengs. HuNan = soutH. The south one is the lowest.", "qs": ["P-M-1", "P-M-2", "P-M-3"]}, {"cue": "The Three Famous Mountains?", "answer": "Huangshan (Anhui) · Lushan (Jiangxi) · Yandang (Zhejiang) · none of them is in the Five", "hook": "H-L-Y = HoLY mountains, in A-J-Z. Huangshan is the ink painting: pines, rocks, sea of clouds.", "qs": ["M7", "P-M-9", "P-M-10", "P-M-7", "P-M-8", "M8"]}]}, {"id": "c1-rivers", "chapter": "Chapter 1 · Geography", "title": "Yangtze and Yellow River", "cn": "长江与黄河", "facts": [{"fact": "Yangtze: starts at the Tanggula Mountains; basin 1.8 million sq km (about 20% of China); more than 6,300 km; lower reaches = 'golden waterway'.", "page": 13}, {"fact": "Three Gorges run from west of Chongqing to east of Yichang (Hubei).", "page": 13}, {"fact": "Yellow River: starts at Bayankala Mountain (Qinghai), flows through 9 provinces/regions, 5,500 km in the book (usually 5,464 km).", "page": 13}], "cards": [{"cue": "Length, rank and source?", "answer": "Yangtze: longest in China, 3rd in the world, 6,300 km, starts at Tanggula · Yellow: 2nd in China, about 5,500 km in the book (5,464 km exactly), starts at Bayankala", "hook": "World podium: Nile, Amazon, Yangtze. T for Tanggula. B for Bayankala.", "qs": ["P-R-1", "P-R-2", "P-R-3", "P-R-4", "R1", "R2", "R7", "B-Geography-19"]}, {"cue": "Where do they end?", "answer": "Yangtze: East China Sea, at Shanghai · Yellow: Bohai Sea, in Shandong", "hook": "YangtzE → East. Mother gives Birth → Bohai.", "qs": ["R3", "R8"]}, {"cue": "Cities on each river?", "answer": "Yangtze: Chongqing, Wuhan, Nanjing, Shanghai + the Three Gorges · Yellow: Lanzhou, Zhengzhou, Jinan", "hook": "Yangtze is the C-W-N-S chain. Yellow is L-Z-J.", "qs": ["P-R-5", "P-R-6", "P-R-7", "R4"]}, {"cue": "Which provinces?", "answer": "Yangtze = south and middle (Sichuan, Yunnan, Hubei, Hunan), not Shandong · Yellow = north, ends in Shandong · neither passes Guangdong", "hook": "Shandong belongs to the Yellow River. Your Guangdong has neither.", "qs": ["P-R-8", "P-R-9", "P-R-10", "R11"]}, {"cue": "Why is the Yellow River special?", "answer": "Mother River · yellow sand from the Loess Plateau · hanging river: const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// Progress lives in memory, is cached in this browser, and syncs to the viewer's private account document.
const PFX = 'uc-mid-', local = {};
let stamps = {};
try {
  for (let i = 0; i < localStorage.length; i++) {

    if (k.startsWith(PFX)) try { local[k.slice(PFX.length)] = JSON.parse(localStorage.getItem(k)); } catch {}

} catch {}
stamps = local._at || {};
delete local._at;
Object.keys(local).forEach(k => { stamps[k] ??= 1; });  // saved before sync existed: older than anything in the account
const cacheLocal = k => { try { localStorage.setItem(PFX + k, JSON.stringify(local[k])); localStorage.setItem(PFX + '_at', JSON.stringify(stamps)); } catch {} };
const store = {
  get(k, d) { return k in local ? structuredClone(local[k]) : d; },
  set(k, v) { local[k] = v; stamps[k] = Date.now(); cacheLocal(k); pushSoon(); },
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// every question gets a stable id: G3, H7, B-Geography-4 ...

const BOOK = DATA.book.flatMap(c => c.questions.map((q, i) => ({...q, id: 'B-' + c.chapter + '-' + (i + 1), set: 'B-' + c.chapter, setName: 'Textbook: ' + c.chapter, src: 'Textbook p.' + q.page})));
const ALL = [...BANK, ...BOOK];

const SETN = {'P-G': 'Predicted: geography', 'P-R': 'Predicted: rivers', 'P-M': 'Predicted: mountains', 'P-H': 'Predicted: history', 'P-X': 'Predicted: May 4, Canal, Zheng He'};
const PRED = DATA.learn.pred.map(q => ({...q, setName: SETN[q.set], src: 'Predicted'}));
const byId = Object.fromEntries([...ALL, ...PRED, ...DRILL].map(q => [q.id, q]));
