 {"cue": "Capitals of the 5 autonomous regions?", "answer": "Guangxi Nanning · Inner Mongolia Hohhot · Ningxia Yinchuan · Tibet Lhasa · Xinjiang Urumqi", "hook": "Lhasa is the sunlight city. Urumqi is the big city on the Kazakhstan side of China.", "qs": ["P-G-24", "P-G-25"]}]}, {"id": "c1-people", "chapter": "Chapter 1 · Geography", "title": "Population and ethnic groups", "cn": "人口与民族", "facts": [{"fact": "Population (book, 'as of 2010'): over 1.37 billion = 22% of the world; urban 49.68%, rural 50.32% in 2010. (Now about 1.41 billion; India is more populous since 2023.)", "page": 5}, {"fact": "56 ethnic groups; Han 91.5%; 55 minorities live mainly in the northwest, southwest and northeast.", "page": 6}, {"fact": "Miao embroidery (Guizhou) became National Intangible Cultural Heritage in 2006; 'Nadamu' means 'entertainment/game' in Mongolian.", "page": 6}], "cards": [{"cue": "People and ethnic groups?", "answer": "56 ethnic groups · Han is the largest, 91.5% in the book · Mongolians = Prairie Nation, hold the Nadamu fair · China = 22% of the world in the book", "hook": "The book's numbers are old (today about 17% and 91.1%), but use the book's if the question says \"according to the book\".", "qs": ["B-Geography-7", "B-Geography-8", "B-Geography-9", "P-G-27", "P-G-28"]}]}, {"id": "c1-terrain", "chapter": "Chapter 1 · Geography", "title": "Terrain: the three steps", "cn": "地形地貌", "facts": [{"fact": "Plains are only 18.75% of land area (book figure); mountains, plateaus and hills are more than two-thirds.", "page": 7}, {"fact": "Four great plateaus (Qinghai-Tibet, Inner Mongolia, Loess, Yunnan-Guizhou) = 33.3% of land (book figure); Qinghai-Tibet is largest, average over 4,000 m.", "page": 8}, {"fact": "Four major basins: Tarim, Junggar, Qaidam, Sichuan. Tarim is the largest inland basin and rich in oil and natural gas.", "page": 9}, {"fact": "Xinjiang: 1.66 million sq km, almost 1/6 of China; 'three mountains squeezing two basins' (Aertai, Tianshan, Kunlun; Junggar, Tarim).", "page": 23}], "cards": [{"cue": "China's shape?", "answer": "High in the west, low in the east: 3 steps", "hook": "Picture a giant staircase from Tibet down to the sea. Water runs down it, so the big rivers flow west to east.", "qs": ["G1"]}, {"cue": "Which line divides step 1 and step 2?", "answer": "Kunlun – Qilian – Hengduan", "hook": "K-Q-H: Kings Queue Here, at the top of the stairs. Taihang and Greater Khingan belong to the lower line.", "qs": ["G3"]}, {"cue": "Which line divides step 2 and step 3?", "answer": "Greater Khingan – Taihang – Wushan – Xuefeng", "hook": "G-T-W-X: Go To Water's eXit, the last step before the sea.", "qs": ["P-G-1", "P-G-2"]}, {"cue": "What sits on each step?", "answer": "Step 1: Qinghai-Tibet Plateau (over 4,000 m) · Step 2: Sichuan Basin, Loess and Inner Mongolia plateaus · Step 3: the big eastern plains", "hook": "Top = roof of China. Middle = plateaus and bowls. Bottom = flat land and big cities.", "qs": ["P-G-3", "P-G-4", "P-G-5", "P-G-6"]}, {"cue": "How much of China is mountains, hills and plateaus?", "answer": "2/3", "hook": "Cut China into 3 slices: 2 are bumpy, 1 is flat.", "qs": ["G15"]}, {"cue": "The four great plateaus?", "answer": "Qinghai-Tibet, Inner Mongolia, Loess, Yunnan-Guizhou", "hook": "Biggest first: Tibet is the giant. Remember Q-I-L-Y: Quite Impressive Land, Yes. Loess is third.", "qs": ["P-G-7", "P-G-8", "B-Geography-10"]}, {"cue": "Four major basins?", "answer": "Tarim, Junggar, Qaidam, Sichuan", "hook": "Trap: Turpan is the lowest, but not one of the big four. Sichuan = land of abundance.", "qs": ["B-Geography-11", "B-Geography-12", "P-G-10"]}, {"cue": "Lowest basin (−154 m)?", "answer": "Turpan Basin", "hook": "Tur-PAN: a frying pan, deep and low.", "qs": ["G8"]}, {"cue": "Three major plains?", "answer": "Northeast (largest) · North China (Beijing) · Middle-Lower Yangtze", "hook": "NE = Number-one Expanse. The Pearl River Delta is not one of the three.", "qs": ["G9", "P-G-9", "B-Geography-13"]}, {"cue": "Xinjiang's shape?", "answer": "3 mountains squeeze 2 basins: Altai, Junggar, Tianshan, Tarim, Kunlun · Tianshan splits Xinjiang: Junggar is north of it, Tarim is south · the Turpan Basin is also in Xinjiang", "hook": "Read it north to south like a sandwich: mountain, basin, mountain, basin, mountain. Tianshan is the middle.", "qs": ["P-G-37", "P-G-38", "B-Geography-24"]}]}, {"id": "c1-mountains", "chapter": "Chapter 1 · Geography", "title": "Great mountains", "cn": "山脉", "facts": [{"fact": "Himalayas: more than 2,400 km long, average over 6,000 m; Qomolangma ('Mother Earth' in Tibetan) is 8,844.43 m in the book (8,848.86 m since 2020), on the China-Nepal border.", "page": 10}, {"fact": "Yarlung Zangbo Grand Canyon is the world's largest and deepest canyon.", "page": 11}, {"fact": "Qinling Ridge: more than 1,500 km long, from Gansu through Shaanxi to Henan; main peak Mount Taibai, 3,767 m, the 'back garden' of Xi'an.", "page": 11}], "cards": [{"cue": "Highest peak, deepest canyon, biggest desert?", "answer": "Qomolangma, in the Himalayas: 8,844.43 m in the book (8,848.86 m since 2020) · Yarlung Zangbo Canyon · Taklamakan Desert, in the Tarim Basin", "hook": "The Himalayas are young and still rising. The Yarlung Zangbo cuts the deepest canyon below them.", "qs": ["P-G-34", "P-G-35", "P-G-36", "B-Geography-14", "B-Geography-15", "B-Geography-16"]}, {"cue": "Qinling Mountains?", "answer": "Yangtze–Yellow watershed · with the Huai River, the north–south line · main peak Taibai", "hook": "Qin-LING = Qin-LINE. North eats wheat, south eats rice.", "qs": ["G12", "P-G-32", "P-G-33", "B-Geography-17"]}]}, {"id": "c1-sacred", "chapter": "Chapter 1 · Geography", "title": "Five Mountains, Three Famous", "cn": "五岳三山", "facts": [], "cards": [{"cue": "The Five Mountains 五岳?", "answer": "Tai (east), Hua (west), Heng 衡 (south), Heng 恒 (north), Song (centre)", "hook": "五岳: one for each compass point, plus one in the middle. The book calls them the Five Famous Mountains.", "qs": ["M1"]}, {"cue": "Eastern mountain?", "answer": "Mount Tai, in Shandong, 1,545 m", "hook": "Tai chi at sunrise: the sun rises in the east. Emperors worshipped heaven here.", "qs": ["M2", "M10", "P-M-6"]}, {"cue": "Western, highest, most dangerous?", "answer": "Mount Hua, in Shaanxi, 2,154.9 m", "hook": "H-U-A: Highest, Unsafe, At the west. Book p.22 wrongly says it isn't the highest.", "qs": ["M3", "M4", "M9", "P-M-4"]}, {"cue": "Mount Song: where, and which temple?", "answer": "Centre · Henan · 1,491.7 m · Shaolin Temple", "hook": "Song and Shaolin both start with S. Picture the monks singing a song in the centre of China.", "qs": ["M5", "M6", "P-M-5"]}, {"cue": "South and north sacred mountains?", "answer": "South: Heng 衡, Hunan, 1,300.2 m (lowest) · North: Heng 恒, Shanxi, 2,016.1 m", "hook": "Two Hengs. HuNan = soutH. The south one is the lowest.", "qs": ["P-M-1", "P-M-2", "P-M-3"]}, {"cue": "The Three Famous Mountains?", "answer": "Huangshan (Anhui) · Lushan (Jiangxi) · Yandang (Zhejiang) · none of them is in the Five", "hook": "H-L-Y = HoLY mountains, in A-J-Z. Huangshan is the ink painting: pines, rocks, sea of clouds.", "qs": ["M7", "P-M-9", "P-M-10", "P-M-7", "P-M-8", "M8"]}]}, {"id": "c1-rivers", "chapter": "Chapter 1 · Geography", "title": "Yangtze and Yellow River", "cn": "长江与黄河", "facts": [{"fact": "Yangtze: starts at the Tanggula Mountains; basin 1.8 million sq km (about 20% of China); more than 6,300 km; lower reaches = 'golden waterway'.", "page": 13}, {"fact": "Three Gorges run from west of Chongqing to east of Yichang (Hubei).", "page": 13}, {"fact": "Yellow River: starts at Bayankala Mountain (Qinghai), flows through 9 provinces/regions, 5,500 km in the book (usually 5,464 km).", "page": 13}], "cards": [{"cue": "Length, rank and source?", "answer": "Yangtze: longest in China, 3rd in the world, 6,300 km, starts at Tanggula · Yellow: 2nd in China, about 5,500 km in the book (5,464 km exactly), starts at Bayankala", "hook": "World podium: Nile, Amazon, Yangtze. T for Tanggula. B for Bayankala.", "qs": ["P-R-1", "P-R-2", "P-R-3", "P-R-4", "R1", "R2", "R7", "B-Geography-19"]}, {"cue": "Where do they end?", "answer": "Yangtze: East China Sea, at Shanghai · Yellow: Bohai Sea, in Shandong", "hook": "YangtzE → East. Mother gives Birth → Bohai.", "qs": ["R3", "R8"]}, {"cue": "Cities on each river?", "answer": "Yangtze: Chongqing, Wuhan, Nanjing, Shanghai + the Three Gorges · Yellow: Lanzhou, Zhengzhou, Jinan", "hook": "Yangtze is the C-W-N-S chain. Yellow is L-Z-J.", "qs": ["P-R-5", "P-R-6", "P-R-7", "R4"]}, {"cue": "Which provinces?", "answer": "Yangtze = south and middle (Sichuan, Yunnan, Hubei, Hunan), not Shandong · Yellow = north, ends in Shandong · neither passes Guangdong", "hook": "Shandong belongs to the Yellow River. Your Guangdong has neither.", "qs": ["P-R-8", "P-R-9", "P-R-10", "R11"]}, {"cue": "Why is the Yellow River special?", "answer": "Mother River · yellow sand from the Loess Plateau · hanging river: its bed is higher than the land", "hook": "Mother = Yellow. So much mud piles up that the river hangs above the fields.", "qs": ["G5", "R5", "R6", "P-R-11", "P-R-12"]}, {"cue": "What is true of both rivers?", "answer": "Both run west to east · both are birthplaces of Chinese civilization", "hook": "Back to the staircase: water runs down from west to east. Options with \"only\" are traps.", "qs": ["R10", "R9"]}]}, {"id": "c1-water", "chapter": "Chapter 1 · Geography", "title": "Other rivers and oceans", "cn": "水系", "facts": [{"fact": "Three water systems: Pacific (Yangtze, Yellow, Pearl), Indian Ocean (Nujiang, Yarlung Zangbo), Arctic (Ertiz). China's hydropower resources rank first in the world.", "page": 12}], "cards": [{"cue": "River that never reaches the ocean?", "answer": "Tarim River", "hook": "Tarim = Trapped. It dies in the desert.", "qs": ["G11"]}, {"cue": "Three ocean systems?", "answer": "Pacific: Yangtze, Yellow, Pearl (Pearl → South China Sea) · Indian: Yarlung Zangbo, Nujiang · Arctic: Ertiz", "hook": "Ertiz goes north through Kazakhstan to the Arctic.", "qs": ["P-G-39", "P-G-40", "B-Geography-18"]}]}, {"id": "c1-climate", "chapter": "Chapter 1 · Geography", "title": "Climate", "cn": "气候", "facts": [], "cards": [{"cue": "Climate by region?", "answer": "East: monsoon, big winter–summer difference · Northwest: dry temperate continental · Tibet: plateau mountain · Hainan: tropical monsoon", "hook": "Sea nearby = monsoon rain. Far from the sea = dry.", "qs": ["P-G-29", "P-G-30", "P-G-31", "G6", "G13"]}, {"cue": "Wettest place?", "answer": "Huoshaoliao, Taiwan", "hook": "火烧 means burned. The place with a fire in its name is the wettest in China.", "qs": ["G7"]}]}, {"id": "c1-cities", "chapter": "Chapter 1 · Geography", "title": "Famous cities", "cn": "名城", "facts": [{"fact": "Beijing was capital of six dynasties: Yan, Liao, Jin, Yuan, Ming, Qing. Forbidden City: about 720,000 sq m, more than 70 palaces, more than 9,000 houses.", "page": 16}, {"fact": "Hong Kong: 'Pearl of the Orient', returned July 1, 1997; Victoria Harbour is one of the world's three natural harbours (with San Francisco Bay and Rio de Janeiro).", "page": 19}], "cards": [{"cue": "Beijing, Shanghai, Hong Kong?", "answer": "Beijing: capital of 6 dynasties (Yan, Liao, Jin, Yuan, Ming, Qing; not Tang), largest hall Taihe (Hall of Supreme Harmony) · Shanghai: Paris of the Orient · Hong Kong: returned 1 July 1997", "hook": "Tang's capital was Chang'an, today's Xi'an. Shanghai is the Paris.", "qs": ["B-Geography-20", "B-Geography-21", "B-Geography-22", "B-Geography-23"]}]}, {"id": "c1-tour", "chapter": "Chapter 1 · Geography", "title": "Tour in China", "cn": "游中国", "facts": [{"fact": "Great Wall: total length 21,196.18 km across 15 provinces (announced June 5, 2012); Ming section about 6,300 km; World Heritage 1987.", "page": 29}, {"fact": "Terracotta Army (Lintong, Xi'an): found 1974; more than 8,000 figures, 50+ chariots, 400,000+ weapons; World Heritage 1987.", "page": 29}], "cards": [{"cue": "Four famous places?", "answer": "Lhasa (Tibet): City of Sunlight · Jiuzhaigou (Sichuan): Valley of 9 Villages · Zhangjiajie (Hunan): first National Forest Park · Hani Terraces (Yunnan): rice fields on mountains", "hook": "Picture one trip: sunny Lhasa, 9 villages (九 = 9), a forest of stone towers, then rice-field stairs.", "qs": ["B-Geography-25", "B-Geography-26", "B-Geography-27", "B-Geography-30"]}, {"cue": "Ming Great Wall? Terracotta Army found?", "answer": "Yalu River → Jiayuguan · 1974", "hook": "The wall runs east to west, Y to J. Peasants found the army while digging a well in 1974.", "qs": ["B-Geography-28", "B-Geography-29"]}]}, {"id": "c2-origins", "chapter": "Chapter 2 · History", "title": "Origins: Yan, Huang, Xia", "cn": "炎黄与三代", "facts": [], "cards": [{"cue": "The order of the main dynasties?", "answer": "Qin · Han · Tang · Song · Yuan · Ming · Qing", "hook": "Queens Have Tea, Sing, Yawn, Move, Quit. The Three Kingdoms come right after Han.", "qs": []}, {"cue": "Who are the Chinese people's legendary ancestors?", "answer": "Yandi + Huangdi beat Chiyou, leader of the Jiuli tribe, in the Zhuolu Battle · Huangdi's mausoleum is in Shaanxi", "hook": "Yan and Huang team up, so Chinese people say Descendants of Yan and Huang.", "qs": ["P-H-1", "P-H-2", "P-H-3", "P-H-4", "P-H-5"]}, {"cue": "The very beginning?", "answer": "Yu founds the Xia, the first dynasty · Shang has oracle bones · Confucius lived in the Spring and Autumn Period", "hook": "Oracle bones: the Shang SHOWED the earliest mature Chinese writing.", "qs": ["P-H-6", "P-H-7", "P-H-8"]}]}, {"id": "c2-qin", "chapter": "Chapter 2 · History", "title": "Qin Shi Huang", "cn": "秦始皇", "facts": [], "cards": [{"cue": "Seven Powers of the Warring States?", "answer": "Qi, Chu, Yan, Han, Zhao, Wei, Qin", "hook": "Qin was the seventh and the strongest. It swallowed the other six.", "qs": ["P-H-9"]}, {"cue": "What did Qin Shi Huang do?", "answer": "221 BC first emperor · one writing, one money, one measures · Great Wall · Terracotta Army", "hook": "2-2-1 counts down to one China. He joined the walls and built a clay army for his tomb.", "qs": ["H1", "H2", "H9", "P-H-10", "P-H-11"]}, {"cue": "More about the Qin?", "answer": "Small seal script · Meng Tian beat the Huns · lasted 15 years · China may come from Qin", "hook": "Fast and short: Qin Shi Huang died in 210 BC and the Qin ended in 207 BC.", "qs": ["P-H-12", "P-H-13", "P-H-14", "P-H-15"]}]}, {"id": "c2-han", "chapter": "Chapter 2 · History", "title": "Han and the Silk Road", "cn": "汉与丝绸之路", "facts": [], "cards": [{"cue": "Han Dynasty people?", "answer": "Liu Bang founds it · Zhang Qian goes west · Cai Lun improves paper · after Han: Three Kingdoms (Wei, Shu, Wu)", "hook": "Liu starts it. Zhang walks. Cai writes. When Han breaks, it breaks into 3.", "qs": ["P-H-16", "P-H-17", "P-H-18", "P-H-19", "H3", "H7"]}, {"cue": "Emperor Wudi and the Silk Road?", "answer": "Emperor Wudi (Liu Che) · 139 BC: Zhang Qian goes to join Dayuezhi against the Huns · Silk Road starts at Chang'an, passes the Hexi Corridor (Gansu), peaks in the Tang", "hook": "The first trip was about war with the Huns. The silk came on the second trip.", "qs": ["P-H-20", "P-H-21", "P-H-22", "P-H-23", "P-H-24"]}]}, {"id": "c2-canal", "chapter": "Chapter 2 · History", "title": "Sui and the Grand Canal", "cn": "隋与大运河", "facts": [], "cards": [{"cue": "The Grand Canal?", "answer": "Longest artificial canal · runs south–north, Beijing to Hangzhou · carries goods and people · not in Guangdong", "hook": "Rivers run west to east, so people dug one south to north. 京杭 = Jing + Hang.", "qs": ["C1", "C2", "C3", "C4", "C5"]}, {"cue": "Grand Canal facts?", "answer": "Sui's Emperor Yang links it · Yuan straightens it · about 1,794 km · passes Hebei, Shandong, Jiangsu, Zhejiang · UNESCO 2014 · 5 rivers", "hook": "It links Hai, Yellow, Huai, Yangtze and Qiantang.", "qs": ["P-X-5", "P-X-6", "P-X-7", "P-X-8"]}]}, {"id": "c2-tang", "chapter": "Chapter 2 · History", "title": "The Tang Dynasty", "cn": "唐", "facts": [], "cards": [{"cue": "Tang: what to remember?", "answer": "Capital Chang'an · Wu Zetian, the only female emperor · monk Xuanzang goes to India · poets Li Bai and Du Fu · Chinatown = Tang People's Street", "hook": "Tang = the golden age of poems and the only female emperor.", "qs": ["P-H-25", "P-H-26", "P-H-27", "P-H-28"]}, {"cue": "Tang's two golden ages?", "answer": "Zhenguan = Taizong (Li Shimin), the Heavenly Khan, who married Princess Wencheng to Tubo · Kaiyuan = Xuanzong (Li Longji)", "hook": "Taizong comes first and Xuanzong later, with Wu Zetian in between.", "qs": ["P-H-29", "P-H-30", "P-H-31", "P-H-32", "P-H-33"]}]}, {"id": "c2-song", "chapter": "Chapter 2 · History", "title": "The Song Dynasty", "cn": "宋", "facts": [], "cards": [{"cue": "The Song and its money?", "answer": "Zhao Kuangyin founds it in 960 · first banknotes · sea trade", "hook": "Song = Shops, Ships and paper money. The book calls it the richest dynasty.", "qs": ["P-H-34", "P-H-35", "P-H-36"]}, {"cue": "The Four Great Inventions?", "answer": "Paper · printing (movable type: Bi Sheng, Song) · gunpowder · compass", "hook": "PPGC: Paper, Printing, Gunpowder, Compass. You print a SONG book.", "qs": ["P-H-37", "P-H-38", "H10"]}]}, {"id": "c2-yuan", "chapter": "Chapter 2 · History", "title": "The Yuan Dynasty", "cn": "元", "facts": [], "cards": [{"cue": "Genghis and Kublai?", "answer": "Temujin = Genghis Khan, Mongol Empire 1206 · Kublai names the Yuan 1271, ends the Song 1279 · capital Dadu (Beijing) · province system", "hook": "Grandpa Genghis conquered, grandson Kublai founded. 71 he names it, 79 he finishes it. Marco Polo came in the Yuan.", "qs": ["P-H-39", "P-H-40", "P-H-41", "H6", "P-H-46", "P-H-47", "P-H-48"]}]}, {"id": "c2-ming", "chapter": "Chapter 2 · History", "title": "Ming and Zheng He", "cn": "明与郑和", "facts": [], "cards": [{"cue": "The Ming Dynasty?", "answer": "Zhu Yuanzhang founds it in 1368 · Forbidden City (finished 1420) and today's Great Wall are Ming", "hook": "Ming built what tourists see today.", "qs": ["P-H-42", "P-H-43", "P-H-44"]}, {"cue": "Zheng He?", "answer": "Ming · sent by Yongle (Zhu Di, Ming Chengzu) · 7 voyages, 1405–1433 · from Nanjing · trade and diplomacy · very large ships · reached East Africa · Muslim from Yunnan", "hook": "The letter Z looks like a 7. N for Navy: the teacher's key says Nanjing. He sailed 87 years before Columbus.", "qs": ["Z1", "H4", "Z2", "Z3", "Z4", "Z5", "P-X-9", "P-X-10", "P-X-11", "P-X-12"]}]}, {"id": "c2-qing", "chapter": "Chapter 2 · History", "title": "The Qing Dynasty", "cn": "清", "facts": [], "cards": [{"cue": "The Qing Dynasty?", "answer": "Last dynasty · golden age of Kangxi, Yongzheng, Qianlong (1662–1796) · Kangxi ended the Three Vassals' Rebellion · Qianlong: Complete Library in the Four Branches", "hook": "Qing Quit last. Kangxi ruled longest, 61 years, and took back Taiwan. Qianlong's name is on the great library.", "qs": ["P-H-49", "P-H-50", "P-H-51", "P-H-52", "P-H-45"]}]}, {"id": "c2-opium", "chapter": "Chapter 2 · History", "title": "The Opium Wars", "cn": "鸦片战争", "facts": [], "cards": [{"cue": "Opium Wars?", "answer": "Britain · 1839 Lin Zexu bans opium · 1840 war, start of modern history · 1842 Treaty of Nanjing: Hong Kong Island + 5 ports (Guangzhou, Xiamen, Fuzhou, Ningbo, Shanghai) · 1856–60 Britain + France burn Yuanmingyuan", "hook": "Britain wanted tea and paid with opium. Lin burns it, Britain attacks, China signs. Modern Chinese history begins here.", "qs": ["P-H-53", "P-H-54", "P-H-55", "P-H-56", "P-H-57", "H5"]}]}, {"id": "c2-1911", "chapter": "Chapter 2 · History", "title": "The 1911 Revolution", "cn": "辛亥革命", "facts": [], "cards": [{"cue": "The Xinhai Revolution?", "answer": "Sun Yat-sen · Three Principles: nationality, civil rights, people's livelihood · Wuchang Uprising 10 October 1911 · imperial rule ends 1912 · Yuan Shikai takes over as president", "hook": "10/10 in Wuchang. Xin sounds like 新, new: on New Year's Day 1912 Sun was sworn in at Nanjing.", "qs": ["P-H-58", "P-H-59", "P-H-60", "P-H-61", "P-H-62", "H8"]}]}, {"id": "c2-may4", "chapter": "Chapter 2 · History", "title": "May Fourth and the CPC", "cn": "五四与建党", "facts": [], "cards": [{"cue": "May Fourth Movement?", "answer": "1919, Beijing · students · patriotism · Paris gave Shandong's German rights to Japan · democracy and science · Youth Day", "hook": "Paris → Shandong → anger in Beijing. Mr. Democracy and Mr. Science were its two heroes.", "qs": ["F1", "F2", "P-X-1", "P-X-2", "F3", "F4", "F5", "P-X-3", "P-X-4"]}, {"cue": "Birth of the Communist Party?", "answer": "1921 · Shanghai · 13 delegates · Chen Duxiu and Li Dazhao", "hook": "19 + 2 = 21: two years after May Fourth.", "qs": ["P-H-63", "P-H-64", "P-H-65"]}]}, {"id": "c2-wars", "chapter": "Chapter 2 · History", "title": "War with Japan, War of Liberation", "cn": "抗战与解放战争", "facts": [], "cards": [{"cue": "War of Resistance?", "answer": "18 Sep 1931 Shenyang · Puyi = puppet emperor of Manchuria · 7 July 1937 · 15 Aug 1945 Japan surrenders · 14 years", "hook": "9/18 starts it, 7/7 spreads it, 8/15 ends it.", "qs": ["P-H-66", "P-H-67", "P-H-68"]}, {"cue": "War of Liberation?", "answer": "Three battles: Liaoshen, Huaihai, Pingjin", "hook": "L-H-P: Liberation Happens Past the Yangtze. Nanjing fell on 23 April 1949.", "qs": ["P-H-69"]}]}, {"id": "c2-prc", "chapter": "Chapter 2 · History", "title": "New China and diplomacy", "cn": "新中国与外交", "facts": [], "cards": [{"cue": "1 October 1949?", "answer": "Mao declares the PRC at Tian'anmen · anthem March of Volunteers · five-star red flag", "hook": "Beiping became Beijing again, and 1 October became National Day.", "qs": ["P-H-70", "P-H-71", "P-H-72"]}, {"cue": "Diplomacy?", "answer": "Zhou Enlai's Five Principles · 1955 Bandung · 1971 UN seat · 1972 Nixon and Japan", "hook": "71 the UN, 72 America and Japan.", "qs": ["P-H-73", "P-H-74", "P-H-75", "P-H-76"]}]}, {"id": "c2-reform", "chapter": "Chapter 2 · History", "title": "Reform and China today", "cn": "改革开放", "facts": [], "cards": [{"cue": "Reform and opening-up?", "answer": "1978 · Deng Xiaoping · Guangdong + Fujian open first · SEZs: Shenzhen, Zhuhai, Shantou, Xiamen · One Country, Two Systems: Hong Kong 1997, Macao 1999", "hook": "Your city is on the list! Zhuhai is one of the first four special economic zones.", "qs": ["P-H-77", "P-H-78", "P-H-79", "P-H-80", "P-H-81", "P-H-82"]}, {"cue": "China today?", "answer": "Shenzhou 5 in 2003 · 2008 Beijing Olympics · 2010 Shanghai Expo · new Four Great Inventions", "hook": "New four: Rail, Alipay, Bikes, Online shopping.", "qs": ["P-H-83", "P-H-84", "P-H-85"]}]}, {"id": "essay", "chapter": "Essay topics", "title": "The 4 essays", "cn": "万能作文", "facts": [], "drill": ["E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9", "E10", "E11", "E12", "E13", "E14", "E15", "E16", "E17", "E18", "E19", "E20", "E21", "E22", "E23", "E24", "E25", "E26", "E27", "E28", "E29", "E30", "E31", "E32", "E33", "E34", "E35", "E36"], "cards": [{"cue": "One formula for any festival", "answer": "Date → Story → 3 customs → 2 reasons → Kazakhstan", "hook": "D-S-3-2-K. One or two sentences each and you have a full answer.", "qs": [], "lines": ["The ___ Festival (___) is on ___. It is one of China's most important traditional festivals.", "It comes from the story of ___.", "On this day people ___, ___ and ___.", "I think it is great for two reasons. First, it carries the value of ___. Second, it teaches us ___.", "In Kazakhstan we ___, so I understand why this festival matters so much."]}, {"cue": "Hello China 你好中国", "answer": "CCTV · 100 short films · each teaches one Chinese word · words carry history, values repeat, traditions are alive", "hook": "Example: 东西 = East + West = thing. Your link: tai chi in Shenzhen.", "qs": []}, {"cue": "Seasons of China 四季中国", "answer": "24 episodes, one per solar term · host Dominic 江森海 · UNESCO 2016 · harmony with nature, seasonal food, young people keeping crafts alive", "hook": "Write: what i l stories", "answer": "Nian fears · Jie Zitui burns · Qu Yuan drowns · Weaver Girl crosses · Chang'e flies · Huan Jing climbs", "hook": "One verb per festival, in calendar order.", "qs": []}, {"cue": "Spring Festival 春节", "answer": "1st day of 1st lunar month · monster Nian · reunion dinner, red envelopes, couplets and firecrackers", "hook": "Value: reunion 团圆. Kazakhstan: our Nauryz also means a clean house, visiting elders and a big table.", "qs": []}, {"cue": "Lantern Festival 元宵节", "answer": "1st month, 15th day · first full moon, ends Spring Festival · lanterns, riddles, Yuanxiao / tangyuan", "hook": "Value: reunion. Round moon, round rice balls.", "qs": []}, {"cue": "Qingming 清明节", "answer": "4–6 April · Jie Zitui, Cold Food Festival · sweep tombs, spring outing, fly kites", "hook": "Value: filial piety 孝. The teacher's full-mark idea: Who am I? Where do I come from? Where am I going?", "qs": []}, {"cue": "Dragon Boat 端午节", "answer": "5th day of 5th lunar month · remembers Qu Yuan · boat races, zongzi, scented sachets", "hook": "Value: patriotism and teamwork.", "qs": []}, {"cue": "Qixi 七夕节", "answer": "7th month, 7th day · Cowherd and Weaver Girl meet on the magpie bridge · stars, praying for skill", "hook": "Value: faithful love. It's the Chinese Valentine's Day. Your link: Kozy Korpesh and Bayan Sulu.", "qs": []}, {"cue": "Mid-Autumn 中秋节", "answer": "15th day of 8th lunar month · Chang'e flies to the moon · watch the moon, mooncakes, lanterns", "hook": "Value: reunion. Your line: the moon over Zhuhai is the same moon my family sees in Turkestan.", "qs": []}, {"cue": "National Day 国庆节", "answer": "1 October · 1949 Mao founds the PRC at Tian'anmen · March of Volunteers · five-star red flag · Golden Week", "hook": "Value: independence and national pride. Say China's National Day, as the teacher did. Your link: Kazakhstan's Independence Day, 16 December.", "qs": []}, {"cue": "BIT slogan 校训", "answer": "德以明理，学以精工 · Seek Truth in Virtue; Pursue Study to Perfect P const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const L = 'ABCD';
// Progress lives in memory, is cached in this browser, and syncs to the viewer's private account document.
const PFX = 'uc-mid-', local = {};
let stamps = {};
try {
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(PFX)) try { local[k.slice(PFX.length)] = JSON.parse(localStorage.getItem(k)); } catch {}
  }
} catch {}
stamps = local._at || {};
delete local._at;
Object.keys(local).forEach(k => { stamps[k] ??= 1; });  // saved before sync existed: older than anything in the account
const cacheLocal = k => { try { localStorage.setItem(PFX + k, JSON.stringify(local[k])); localStorage.setItem(PFX + '_at', JSON.stringify(stamps)); } catch {} };
const store = {
  get(k, d) { return k in local ? structuredClone(local[k]) : d; },
  set(k, v) { local[k] = v; stamps[k] = Date.now(); cacheLocal(k); pushSoon(); },
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// every question gets a stable id: G3, H7, B-Geography-4 ...
const BANK = DATA.bank.sets.flatMap(s => s.questions.map((q, i) => ({...q, id: s.id + (i + 1), set: s.id, setName: s.name, src: 'Teacher bank'})));
const BOOK = DATA.book.flatMap(c => c.questions.map((q, i) => ({...q, id: 'B-' + c.chapter + '-' + (i + 1), set: 'B-' + c.chapter, setName: 'Textbook: ' + c.chapter, src: 'Textbook p.' + q.page})));
const ALL = [...BANK, ...BOOK];
const DRILL = DATA.learn.drill.map((q, i) => ({...q, id: 'E' + (i + 1), set: 'E', setName: 'Essay facts', src: 'Essay drill'}));
const SETN = {'P-G': 'Predicted: geography', 'P-R': 'Predicted: rivers', 'P-M': 'Predicted: mountains', 'P-H': 'Predicted: history', 'P-X': 'Predicted: May 4, Canal, Zheng He'};
const PRED = DATA.learn.pred.map(q => ({...q, setName: SETN[q.set], src: 'Predicted'}));
const byId = Object.fromEntries([...ALL, ...PRED, ...DRILL].map(q => [q.id, q]));
const ESS = DATA.essays.essays, RUB = DATA.essays.rubric;

/* ---------------------------------------------------------------- exam */
const FIRST_GROUP = ['seasons', 'axis', 'zhuhai', 'doubleninth'], ESSAY_MAX = 20, MCQ_PTS = 1;
function compose(kind) {
  const from = (set, n) => shuffle(BANK.filter(q => q.set === set)).slice(0, n);
  const twist = (set, k) => PRED.filter(q => q.set === set).map(q => [Math.random() - (q.likely === 'h' ? .35 : 0), q]).sort((x, y) => x[0] - y[0]).slice(0, k).map(x => x[1]);
  if (kind === 'pred') return [...from('G', 4), ...twist('P-G', 5), ...from('H', 2), ...twist('P-H', 3), ...from('R', 1), ...twist('P-R', 1), ...twist('P-M', 1), ...twist('P-X', 3)].map(q => q.id);
  return [...from('G', 9), ...from('H', 5), ...from('R', 2), ...from('M', 1), ...from('F', 1), ...from('C', 1), ...from('Z', 1)].map(q => q.id);
}

let tick;
function examView() {
  clearInterval(tick);
  let st = store.get('exam', null);
  if (st && (!Array.isArray(st.essays) || st.qs.length !== 20)) {  // a paper from an older format: keep its essays as drafts
    const old = st.texts || (st.essay ? {[st.essay]: st.text} : {});
    for (const [id, t] of Object.entries(old)) if (t && ESS.some(e => e.id === id)) store.set('draft-' + id, t);
    store.set('exam', null);
    st = null;
  }
  if (!st) return examStart();
  if (st.done) return examResult(st);
  examPaper(st);
}

function examStart() {
  const hist = store.get('history', []);
  $('#view').innerHTML = `<section class="sheet">
    <div class="eyebrow">Mid-term simulation</div>
    <h1 class="ptitle" style="text-align:left;margin-top:6px">Sit a 30-minute mock paper</h1>

    <div class="choice" role="radiogroup" aria-label="Paper">
      <label><input type="radio" name="kind" id="k-bank" value="bank" checked><div><b>Random paper</b><span>20 teacher-bank questions + 4 random essay topics.</span></div></label>
      <label><input type="radio" name="kind" id="k-pred" value="pred"><div><b>Harder paper</b><span>7 teacher-bank questions + 13 new twists + 4 random essay topics.</span></div></label>
      <label><input type="radio" name="kind" id="k-group" value="group"><div><b>First group's essays</b><span>20 teacher-bank questions + Seasons of China, Beijing Axis, Zhuhai and Double Ninth.</span></div></label>
    </div>
    <div class="row" style="margin-top:18px"><button class="btn" id="go">Start the exam · 30:00</button></div>
    ${hist.length ? `<div class="hist">Your past attempts: ${hist.slice(-8).map(h => `<span>${esc(h.d)} · <b>${+h.score}</b>/${+h.max || (h.essay == null ? 40 : 100)}</span>`).join('')}</div>` : ''}
  </section>`;
  $('#go').onclick = () => {
    const kind = $('input[name=kind]:checked').value;
    const essays = kind === 'group' ? FIRST_GROUP : shuffle(ESS).slice(0, 4).map(e => e.id);
    store.set('exam', {kind, qs: compose(kind), ans: {}, essays, texts: {}, scores: {}, start: Date.now(), name: store.get('name', '')});
    examView();
  };
}

function qHtml(q, n, chosen, graded) {
  const long = q.options.some(o => o.length > 34);
  const ok = graded && chosen === q.answer;
  return `<li class="q" data-id="${q.id}">
    ${graded ? `<span class="mark" aria-label="${ok ? 'correct' : 'wrong'}">${ok ? '✓' : '✗'}</span>` : ''}
    <span class="n">${n}.</span>
    <div class="stem">${esc(q.q)}${graded && q.src !== 'Teacher bank' ? `<span class="tag">${esc(q.src)}</span>` : ''}</div>
    <div class="opts ${long ? 'long' : ''}">${q.options.map((o, i) => {
      const cls = graded ? (i === q.answer ? 'right' : i === chosen ? 'wrong' : '') : '';
      return `<label class="opt ${cls}"><input type="radio" name="${q.id}" value="${i}" ${chosen === i ? 'checked' : ''} ${graded ? 'disabled' : ''}><span class="L">${L[i]}</span><span>${esc(o)}</span></label>`;
    }).join('')}</div>
    ${graded && !ok ? `<div class="why"><b>${L[q.answer]}</b> · ${esc(q.explain)}</div>` : ''}
  </li>`;
}

function header(st) {
  return `<div class="inst">The Office of International Students · Beijing Institute of Technology (Zhuhai)</div>
    <div class="ptitle">Mid-Term Exam Paper for “Overview of China” · Mock</div>
    <div class="meta"><span>Exam Format: Closed-book</span><span>Exam Duration: 30 mins</span><span>Total: 100 points</span></div>
    <div class="fields"><label>Name: <input id="f-name" value="${esc(st.name || '')}" autocomplete="off"></label><label>Class: <input id="f-class" autocomplete="off"></label><label>Student ID No.: <input id="f-id" autocomplete="off" inputmode="numeric"></label></div>`;
}

const essayWords = st => st.essays.reduce((n, id) => n + words(st.texts[id] || ''), 0);
function examPaper(st) {
  const n = st.qs.length;
  $('#view').innerHTML = `<div class="bar"><span class="timer" id="timer">30:00</span><span class="prog" id="prog"></span><button class="btn red" id="submit">Hand in</button></div>
  <div id="confirm"></div>
  <section class="sheet">${header(st)}
    <h2 class="part">I. Choose the best answer for each question. (${n * MCQ_PTS} points, ${MCQ_PTS} for each)</h2>
    <ol class="qs">${st.qs.map((id, i) => qHtml(byId[id], i + 1, st.ans[id], false)).join('')}</ol>
    <h2 class="part">II. Write on the following 4 topics. (${st.essays.length * ESSAY_MAX} points, ${ESSAY_MAX} for each)</h2>
    ${st.essays.map((id, i) => `<div class="prompt" style="margin-top:18px">${i + 1}. ${esc(ESS.find(e => e.id === id).prompt)}</div>
      <textarea class="exam-essay" style="min-height:190px" data-id="${id}" aria-label="Your answer to question ${i + 1}" placeholder="Write as much as you can: what it is, key facts, why it matters, your own view.">${esc(st.texts[id] || '')}</textarea>
      <div class="wc" data-wc="${id}"></div>`).join('')}
  </section>`;
  const save = () => store.set('exam', st);
  const prog = () => {
    $('#prog').textContent = `${Object.keys(st.ans).length}/${n} answered · ${essayWords(st)} words`;
    st.essays.forEach(id => { $(`[data-wc="${id}"]`).textContent = words(st.texts[id] || '') + ' words'; });
  };
  $('#view .sheet').addEventListener('change', e => {
    if (e.target.type === 'radio') { st.ans[e.target.name] = +e.target.value; save(); prog(); }
  });
  $('#view').querySelectorAll('.exam-essay').forEach(t => t.addEventListener('input', () => { st.texts[t.dataset.id] = t.value; save(); prog(); }));
  $('#f-name').addEventListener('input', e => { st.name = e.target.value; store.set('name', st.name); save(); });
  $('#submit').onclick = () => {
    const left = n - Object.keys(st.ans).length, thin = st.essays.filter(id => words(st.texts[id] || '') < 40).length;
    if (!left && !thin) return finish(st);
    $('#confirm').innerHTML = `<div class="confirm">${left ? `<b>${left} question${left > 1 ? 's' : ''} still blank.</b> ` : ''}${thin ? `<b>${thin} essay${thin > 1 ? 's are' : ' is'} under 40 words.</b> ` : ''}Hand in anyway?
      <div class="row" style="margin-top:8px"><button class="btn red" id="yes">Hand in now</button><button class="btn ghost" id="no">Keep writing</button></div></div>`;
    $('#yes').onclick = () => finish(st);
    $('#no').onclick = () => { $('#confirm').innerHTML = ''; };
  };
  const end = st.start + 30 * 60 * 1000;
  const draw = () => {
    const ms = end - Date.now();
    if (ms <= 0) return finish(st, true);
    const sec = Math.ceil(ms / 1000);
    $('#timer').textContent = `${String(sec / 60 | 0).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    $('#timer').classList.toggle('low', sec <= 300);
  };
  prog(); draw(); tick = setInterval(draw, 1000);
}
const words = t => (t.trim().match(/\S+/g) || []).length;

function finish(st, timeUp) {
  clearInterval(tick);
  st.done = true; st.timeUp = !!timeUp; st.used = Math.min(30 * 60, Math.round((Date.now() - st.start) / 1000));
  st.mcq = st.qs.reduce((s, id) => s + (st.ans[id] === byId[id].answer ? MCQ_PTS : 0), 0);
  const miss = new Set(store.get('mistakes', []));
  st.qs.forEach(id => { const ok = st.ans[id] === byId[id].answer; ok ? miss.delete(id) : miss.add(id); remember(id, ok); });
  store.set('mistakes', [...miss]);
  store.set('exam', st);
  logHistory(st);
  examResult(st);
}
const essayTotal = st => Object.values(st.scores).reduce((a, x) => a + (+x || 0), 0);
function logHistory(st) {
  const h = store.get('history', []).filter(x => x.t !== st.start), marked = Object.keys(st.scores).length;
  h.push({t: st.start, d: new Date(st.start).toLocaleDateString(undefined, {month: 'short', day: 'numeric'}), score: st.mcq + essayTotal(st),
          essay: marked ? essayTotal(st) : null, max: st.qs.length * MCQ_PTS + marked * ESSAY_MAX});
  store.set('history', h.slice(-20));
}

/* ---------------------------------------------------------------- move progress by code: no account, no server */
let moveMsg = '';
const toB64 = bytes => { let t = ''; for (let i = 0; i < bytes.length; i += 8192) t += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(t); };
const fromB64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const through = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
async function packProgress() {
  const bytes = new TextEncoder().encode(JSON.stringify({v: local, at: stamps}));
  return window.CompressionStream ? 'UC1.' + toB64(await through(bytes, new CompressionStream('gzip'))) : 'UC0.' + toB64(bytes);
}
async function unpackProgress(code) {
  const [tag, body] = code.replace(/\s+/g, '').split('.');
  if (!['UC0', 'UC1'].includes(tag) || !body) throw 0;
  const bytes = fromB64(body);
  return JSON.parse(new TextDecoder().decode(tag === 'UC1' ? await through(bytes, new DecompressionStream('gzip')) : bytes));
}
// A pasted code is outside data: keep only well-formed progress for questions that exist.
function cleanProgress(doc) {
  const v = {}, at = {}, src = doc?.v, num = Number.isFinite;
  if (!src || typeof src !== 'object') throw 0;
  const put = (k, x) => { v[k] = x; at[k] = Math.min(Number(doc.at?.[k]) || 0, Date.now()); };
  if (src.mem && typeof src.mem === 'object') put('mem', Object.fromEntries(Object.entries(src.mem).filter(([id, x]) => byId[id] && [0, 1, 2, 3].includes(x?.b) && num(x.due))
    .map(([id, x]) => [id, {b: x.b, due: x.due, t: num(x.t) ? x.t : 0}])));
  if (Array.isArray(src.lessons)) put('lessons', src.lessons.filter(id => LES.some(l => l.id === id)));
  if (Array.isArray(src.mistakes)) put('mistakes', src.mistakes.filter(id => byId[id]));
  if (Array.isArray(src.history)) put('history', src.history.filter(h => num(h?.t) && num(h.score) && typeof h.d === 'string').slice(-20)
    .map(h => ({t: h.t, d: h.d.slice(0, 20), score: h.score, essay: num(h.essay) ? h.essay : null})));
  const e = src.exam;
  if (e === null || (e && Array.isArray(e.qs) && e.qs.length === 20 && e.qs.every(id => byId[id]) && Array.isArray(e.essays) && e.essays.length === 4 && e.essays.every(id => ESS.some(x => x.id === id)) && num(e.start) && e.ans && typeof e.ans === 'object' && e.texts && typeof e.texts === 'object' && e.scores && typeof e.scores === 'object')) put('exam', e);
  if (typeof src.name === 'string') put('name', src.name.slice(0, 80));
  for (const x of ESS) if (typeof src['draft-' + x.id] === 'string') put('draft-' + x.id, src['draft-' + x.id].slice(0, 20000));
  return {v, at};
}
function wireMove() {
  const out = $('#move-out'), fill = () => packProgress().then(c => { out.value = c; }).catch(() => { out.value = ''; });
  $('#move').addEventListener('toggle', () => { if ($('#move').open) fill(); });
  if ($('#move').open) fill();
  $('#move-copy').onclick = () => {
    const done = () => { $('#move-msg').textContent = 'Code copied. Paste it on your other device.'; };
    const manual = () => { out.focus(); out.select(); out.setSelectionRange(0, out.value.length); $('#move-msg').textContent = 'Code selected. Copy it from the menu.'; };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(out.value).then(done, manual); else manual();
  };
  $('#move-load').onclick = async () => {
    try {
      const clean = cleanProgress(await unpackProgress($('#move-in').value));
      absorb(clean);
      Object.keys(clean.v).forEach(cacheLocal);
      pushSoon();
      moveMsg = 'Progress added.';
      learnHome();
    } catch { $('#move-msg').textContent = 'That code did not work. Copy the whole code and try again.'; }
  };
}
function startQuiz(ids, i) {
  ls = {i, mode: 'quiz', queue: shuffle(ids), total: ids.length, missed: new Set(), right: 0};
  drawLearn();
}
function quitLearn() { ls = null; learnHome(); scrollTo(0, 0); }

function drawLearn() {
  const l = ls.i == null ? null : LES[ls.i], name = l ? l.title : 'Review';
  const head = right => `<div class="lhead"><button id="quit">← All lessons</button><span>${esc(name)} · ${right}</span></div>`;
  if (ls.mode === 'cards') {
    const c = l.cards[ls.step], last = ls.step === l.cards.length - 1;
    $('#view').innerHTML = `<section class="sheet">${head(`${ls.step + 1}/${l.cards.length}`)}
      <div class="steps" aria-hidden="true">${l.cards.map((_, i) => `<i class="${i <= ls.step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="mem"><div class="cue">${esc(c.cue)}</div><div class="ans">${esc(c.answer)}</div><div class="hook">${esc(c.hook)}</div>
        ${c.lines ? `<ol>${c.lines.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}</div>
      <div class="row">${ls.step ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn" id="on">${last ? 'Test me' : 'Got it'}</button></div></section>`;
    $('#quit').onclick = quitLearn;
    if ($('#back')) $('#back').onclick = () => { ls.step--; drawLearn(); };
    $('#on').onclick = () => { if (last) startQuiz(lessonIds(l), ls.i); else { ls.step++; drawLearn(); } };
    $('#on').focus({preventScroll: true});
    return;
  }
  if (!ls.queue.length) {
    if (l) store.set('lessons', [...new Set([...store.get('lessons', []), l.id])]);
    const clean = ls.total - ls.missed.size;
    const nextL = l ? LES[ls.i + 1] : null;
    $('#view').innerHTML = `<section class="sheet">${head('finished')}
      <div class="stamp"><div class="big">${clean}<small>/${ls.total}</small></div><div class="parts">right on the first try.<br>${ls.missed.size ? 'The ones you missed will come back in your review.' : 'Perfect.'}</div></div>
      <div class="row">${nextL ? `<button class="btn" id="nx">Next: ${esc(nextL.title)}</button>` : `<a class="btn" href="#exam" style="text-decoration:none">Sit a mock exam</a>`}<button class="btn ghost" id="home">All lessons</button></div></section>`;
    $('#quit').onclick = quitLearn; $('#home').onclick = quitLearn;
    const a = $('#view a[href="#exam"]'); if (a) a.onclick = () => { ls = null; };
    if ($('#nx')) $('#nx').onclick = () => { ls = {i: LES.indexOf(nextL), mode: 'cards', step: 0}; drawLearn(); scrollTo(0, 0); };
    return;
  }
  const id = ls.queue[0], q = byId[id];
  $('#view').innerHTML = `<section class="sheet">${head(`${ls.right}/${ls.total} right`)}
    <div class="steps" aria-hidden="true">${Array.from({length: ls.total}, (_, i) => `<i class="${i < ls.right ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pcard" style="margin-top:18px"><ol class="qs">${qHtml(q, ls.right + 1, undefined, false)}</ol><div id="after"></div></div></section>`;
  $('#quit').onclick = quitLearn;
  $('#view').querySelectorAll('.pcard input').forEach(inp => inp.onchange = () => {
    const c = +inp.value, ok = c === q.answer, retried = ls.missed.has(id), n = ls.right + 1;
    remember(id, ok, retried);
    const miss = new Set(store.get('mistakes', []));
    if (ok) miss.delete(id); else miss.add(id);
    store.set('mistakes', [...miss]);
    ls.queue.shift();
    if (ok) ls.right++;
    else { ls.missed.add(id); ls.queue.splice(Math.min(2, ls.queue.length), 0, id); }
    $('#view .pcard ol').outerHTML = `<ol class="qs graded">${qHtml(q, n, c, true)}</ol>`;
    const h = hookFor(id);
    $('#after').innerHTML = `${h ? `<div class="mem" style="min-height:0;padding:12px 0 0"><div class="hook">${esc(h.hook)}</div></div>` : ok ? `<div class="why">${esc(q.explain)}</div>` : ''}
      <div class="row" style="margin-top:12px"><button class="btn" id="go-on">${ok ? 'Next' : 'Got it, ask me again'}</button></div>`;
    $('#go-on').onclick = drawLearn;
    $('#go-on').focus({preventScroll: true});
  });
}

/* ---------------------------------------------------------------- routing */
const VIEWS = {learn: learnView, exam: examView, practice: practiceView, essays: essaysView, facts: factsView};
function route() {
  const v = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'learn';
  document.querySelectorAll('nav.top a').forEach(a => a.getAttribute('href') === '#' + v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (v !== 'exam') clearInterval(tick);
  VIEWS[v]();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

/* ---------------------------------------------------------------- sync across devices */
const sync = {ref: null, ready: false, busy: false, dirty: false, timer: 0};
const SYNC_TEXT = {connecting: '· connecting…', saving: '· saving…', saved: '· saved to your account', offline: '· saved here, will sync when online', local: '· saved on this device only'};
const syncState = k => { const el = $('#sync'); if (el) el.textContent = SYNC_TEXT[k]; };
const canon = v => Array.isArray(v) ? `[${v.map(canon).join()}]` : v && typeof v === 'object'
  ? `{${Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join()}}` : JSON.stringify(v ?? null);

// Two devices can both practise offline, so answers merge one by one instead of one device overwriting the other.
function mergeKey(k, a, aAt, b, bAt) {
  if (k === 'mem') {
    const out = {...a};
    for (const [id, x] of Object.entries(b || {})) {
      const y = out[id];
      if (!y || (x.t || 0) > (y.t || 0) || ((x.t || 0) === (y.t || 0) && x.b > y.b)) out[id] = x;
    }
    return out;
  }
  if (k === 'lessons') return [...new Set([...(a || []), ...(b || [])])].sort();
  if (k === 'history') {
    const byT = {};
    for (const x of aAt > bAt ? [...(b || []), ...(a || [])] : [...(a || []), ...(b || [])]) byT[x.t] = x;
    return Object.values(byT).sort((x, y) => x.t - y.t).slice(-20);
  }
  return bAt >= aAt ? b : a;
}
function absorb(doc) {
  let changed = false;
  for (const [k, v] of Object.entries(doc?.v || {})) {
    const rAt = doc.at?.[k] || 0, merged = k in local ? mergeKey(k, local[k], stamps[k] || 0, v, rAt) : v;
    stamps[k] = Math.max(stamps[k] || 0, rAt);
    if (!(k in local) || canon(merged) !== canon(local[k])) { local[k] = structuredClone(merged); changed = true; }
    cacheLocal(k);
  }
  return changed;
}
function pushSoon() {
  sync.dirty = true;
  if (!sync.ref) return;
  syncState('saving');
  clearTimeout(sync.timer);
  sync.timer = setTimeout(() => { sync.timer = 0; push(); }, 800);
}
async function push() {
  if (!sync.ref || !sync.ready || sync.busy || !sync.dirty) return;
  sync.busy = true; sync.dirty = false;
  try {
    await sync.ref.set(JSON.parse(JSON.stringify({v: local, at: stamps})));
    if (!sync.dirty) syncState('saved');
  } catch (e) {
    sync.dirty = true;
    if (['invalid_argument', 'revoked', 'quota_exceeded', 'not_granted'].includes(e?.code)) { sync.ref = null; syncState('local'); }
    else syncState('offline');  // retried on the next answer, or when the connection returns
  } finally {
    sync.busy = false;
    if (sync.dirty && sync.ref && navigator.onLine !== false && !sync.timer) pushSoon();
  }
}
function refreshAfterSync() {
  const v = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'learn';
  if (v === 'learn' && !ls) learnHome();
  else if (v === 'exam' && $('#go')) examView();  // never redraw a paper or lesson while it is being answered
}
function connectSync(db, uid) {
  sync.ref = db.doc('data/users/' + uid + '/progress');
  syncState('connecting');
  const slow = setTimeout(() => { if (!sync.ready) syncState('offline'); }, 10000);
  sync.ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const doc = snap.exists ? snap.data() : null;
    if (snap.metadata.fromCache && !doc) return;  // an empty cache says nothing about the account
    const changed = absorb(doc);
    if (!snap.metadata.fromCache) {
      clearTimeout(slow);
      sync.ready = true;
      const same = canon({v: local, at: stamps}) === canon(doc ? {v: doc.v, at: doc.at} : {v: {}, at: {}});
      if (!same) pushSoon(); else if (!sync.busy && !sync.dirty) syncState('saved');
      if (same) sync.dirty = false;
    }
    if (changed) refreshAfterSync();
  }, () => { clearTimeout(slow); sync.ref = null; syncState('local'); });
}
addEventListener('online', () => { if (sync.dirty) push(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(sync.timer); sync.timer = 0; push(); } });

route();
(async () => {
  syncState('connecting');
  const [db, user] = window.claude?.use ? await Promise.all([claude.use('db'), claude.use('user')]) : [];
  const uid = user ? await user.id() : null;
  if (db && uid) connectSync(db, uid); else syncState('local');
})().catch(() => syncState('local'));
</script>
