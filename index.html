/* ---------------------------------------------------------------- exam */
function compose(kind) {
  const from = (set, n) => shuffle(BANK.filter(q => q.set === set)).slice(0, n);
  if (kind === 'past') return BANK.filter(q => q.past).sort((a, b) => a.past - b.past).map(q => q.id);
  const misc = shuffle(['F', 'C', 'Z']);
  // ponytail: likely twists get a head start in the shuffle; a real probability model would need more past papers
  const twist = (set, k) => PRED.filter(q => q.set === set).map(q => [Math.random() - (q.likely === 'h' ? .35 : 0), q]).sort((a, b) => a[0] - b[0]).slice(0, k).map(x => x[1]);
  if (kind === 'pred') return [...from('G', 4), ...twist('P-G', 5), ...from('H', 2), ...twist('P-H', 3), ...from('R', 1), ...twist('P-R', 1), ...twist('P-M', 1), ...twist('P-X', 3)].map(q => q.id);
  if (kind === 'bank') return [...from('G', 9), ...from('H', 5), ...from('R', 2), ...from('M', 1), ...from('F', 1), ...from('C', 1), ...from('Z', 1)].map(q => q.id);
  const book = shuffle(BOOK).slice(0, 6);
  const ids = [...from('G', 6), ...book, ...from('H', 4), ...from('R', 1), ...from('M', 1), ...from(misc[0], 1), ...from(misc[1], 1)].map(q => q.id);
  for (const q of shuffle(BANK)) if (ids.length < 20 && !ids.includes(q.id)) ids.push(q.id);  // too few book questions: top up from the bank
  return ids;
}

function qHtml(q, n, chosen, graded) {
  const long = q.options.some(o => o.length > 34);
  const ok = graded && chosen === q.answer;
  return `<li class="q" data-id="${q.id}">
    ${graded ? `<span class="mark" aria-label="${ok ? 'correct' : 'wrong'}">${ok ? '✓' : '✗'}</span>` : ''}
    <span class="n">${n}.</span>
    <div class="stem">${esc(q.q)}${graded && q.src !== 'Teacher bank' ? `<span class="tag">${esc(q.src)}</span>` : ''}</div>
    <div class="opts ${long ? 'long' : ''}">${q.options.map((o, i) => {
      const cls = graded ? (i === q.answer ? 'right' : i === chosen ? 'wrong' : '') : '';
      return `<label class="opt ${cls}"><input type="radio" name="${q.id}" value="${i}" ${chosen === i ? 'checked' : ''} ${graded ? 'disabled' : ''}><span class="L">${L[i]}</span><span>${esc(o)}</span></label>`;
    }).join('')}</div>
    ${graded && !ok ? `<div class="why"><b>${L[q.answer]}</b> · ${esc(q.explain)}</div>` : ''}
  </li>`;
}

const words = t => (t.trim().match(/\S+/g) || []).length;

function finish(st, timeUp) {
  clearInterval(tick);
  st.done = true; st.timeUp = !!timeUp; st.used = Math.min(30 * 60, Math.round((Date.now() - st.start) / 1000));
  st.mcq = st.qs.reduce((s, id) => s + (st.ans[id] === byId[id].answer ? 2 : 0), 0);
  st.essayScore = null;
  const miss = new Set(store.get('mistakes', []));
  st.qs.forEach(id => { const ok = st.ans[id] === byId[id].answer; ok ? miss.delete(id) : miss.add(id); remember(id, ok); });
  store.set('mistakes', [...miss]);
  store.set('exam', st);
  logHistory(st);
  examResult(st);
}
function logHistory(st) {
  const h = store.get('history', []).filter(x => x.t !== st.start);

  store.set('history', h.slice(-20));
}

let samplePromise = null;
const getSample = () => samplePromise ??= (window.claude?.use ? window.claude.use('sample').catch(() => null) : Promise.resolve(null));

function grader(box, essay, getText, onScore, scored) {
  box.innerHTML = `<details ${scored ? '' : 'open'}><summary>Grade this answer</summary>
    <div id="ai" class="row" style="margin-top:8px"></div>

  box.querySelector('#self').onclick = () => onScore([...box.querySelectorAll('.rub input:checked')].reduce((s, c) => s + +c.dataset.pts, 0));
  getSample().then(sample => {
    if (!sample) return;
    const ai = box.querySelector('#ai');
    ai.innerHTML = `<button class="btn red" id="ask">Grade with Claude</button><span class="small muted">Scores it out of 60 like the teacher and lists fixes.</span>`;
    ai.querySelector('#ask').onclick = async () => {
      const text = getText().trim();
      const fb = box.querySelector('#fb');
      if (words(text) < 15) { fb.innerHTML = '<div class="fb">Write at least a few sentences first.</div>'; return; }
      const btn = ai.querySelector('#ask'); btn.disabled = true; btn.textContent = 'Grading…';
      fb.innerHTML = '<div class="fb muted">Thinking…</div>';
      try {
        const r = await sample.json(gradePrompt(essay, text));
        const parts = RUB.map(x => ({...x, got: Math.max(0, Math.min(x.pts, Math.round(+r[x.k] || 0)))}));
        const score = parts.reduce((s, p) => s + p.got, 0);
        const list = a => (Array.isArray(a) ? a : []).map(x => `<li>${esc(x)}</li>`).join('');
        fb.innerHTML = `<div class="fb"><b style="font-family:var(--f-pen);color:var(--red);font-size:24px">${score}/60</b> ${esc(r.summary || '')}
          <h4>By criterion</h4><ul>${parts.map(p => `<li>${esc(p.label)}: <b>${p.got}</b>/${p.pts}</li>`).join('')}</ul>
          ${r.strengths?.length ? `<h4>What earned points</h4><ul>${list(r.strengths)}</ul>` : ''}
          ${r.improve?.length ? `<h4>To get full marks</h4><ul>${list(r.improve)}</ul>` : ''}
          ${r.fixes?.length ? `<h4>Language fixes</h4><ul class="fix">${r.fixes.slice(0, 6).map(f => `<li><s>${esc(f.wrong)}</s> → ${esc(f.right)}</li>`).join('')}</ul>` : ''}
          <div class="row" style="margin-top:12px"><button class="btn" id="use">Use ${score}/60</button></div></div>`;
        fb.querySelector('#use').onclick = () => onScore(score);

}
function connectSync(db, uid) {
  sync.ref = db.doc('data/users/' + uid + '/progress');
  syncState('connecting');
  const slow = setTimeout(() => { if (!sync.ready) syncState('offline'); }, 10000);
  sync.ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const doc = snap.exists ? snap.data() : null;
    if (snap.metadata.fromCache && !doc) return;  // an empty cache says nothing about the account
    const changed = absorb(doc);
    if (!snap.metadata.fromCache) {
      clearTimeout(slow);
      sync.ready = true;
      const same = canon({v: local, at: stamps}) === canon(doc ? {v: doc.v, at: doc.at} : {v: {}, at: {}});
      if (!same) pushSoon(); else if (!sync.busy && !sync.dirty) syncState('saved');
      if (same) sync.dirty = false;
    }
    if (changed) refreshAfterSync();
  }, () => { clearTimeout(slow); sync.ref = null; syncState('local'); });
}
addEventListener('online', () => { if (sync.dirty) push(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(sync.timer); sync.timer = 0; push(); } });

route();
(async () => {
  syncState('connecting');
  const [db, user] = window.claude?.use ? await Promise.all([claude.use('db'), claude.use('user')]) : [];
  const uid = user ? await user.id() : null;
  if (db && uid) connectSync(db, uid); else syncState('local');
})().catch(() => syncState('local'));
